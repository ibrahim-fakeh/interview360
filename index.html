.NET garbage collector frees objects that are no longer **reachable** from a root (static fields, local variables on active stacks, GC handles). It does not care if you \"finished\" with an object — only whether something still references it. Almost every managed \"leak\" is an object that is still reachable by mistake.\n\n**Generations** make GC cheap for the common case:\n\n- **Gen 0** — new objects. Most die young, so gen 0 collections are frequent and fast.\n- **Gen 1** — a buffer between short- and long-lived objects.\n- **Gen 2** — long-lived objects. Full collections are more expensive.\n- **Large Object Heap (LOH)** — objects of 85,000 bytes or more (big arrays, big strings). Collected with gen 2 and not compacted by default, so it can fragment.\n\n**Workstation vs server GC**: workstation GC is tuned for desktop apps. Server GC uses a heap and a GC thread per core, giving higher throughput but more memory. ASP.NET Core apps use server GC by default. Newer .NET versions also include DATAS, which adapts server GC heap count to the load (verify against current docs for your version). For containers or many app pools on one server, memory limits and GC mode matter.\n\n**IDisposable is not about memory.** It releases unmanaged resources (file handles, sockets, DB connections) deterministically. Forgetting `Dispose` usually leaks handles or connections, not managed memory — but the symptoms (pool exhaustion) can look similar.\n\nCommon leak causes in real systems:\n\n- **Static or singleton caches** with no size limit or expiry.\n- **Event handlers**: a long-lived publisher keeps a reference to every subscriber that never unsubscribes.\n- **Timers and background tasks** capturing objects in closures.\n- Creating a new `HttpClient` per call (socket exhaustion) — use `IHttpClientFactory`.\n- Large buffers allocated per request (LOH churn) — use `ArrayPool<T>` or `RecyclableMemoryStream`.\n\n**Diagnosis order**: measure the trend → capture the heap → find what holds it.\n\n- .NET (Core/5+): `dotnet-counters` to watch GC heap size, gen 2 size, LOH size and allocation rate; `dotnet-gcdump` for a light heap snapshot; `dotnet-dump` with `dumpheap -stat` and `gcroot` for full analysis.\n- .NET Framework on IIS: ProcDump or Task Manager dump of `w3wp.exe`, then PerfView, DebugDiag or WinDbg with SOS; performance counters for \".NET CLR Memory\".\n\nCompare **two snapshots** taken some time apart. The type whose count keeps growing is your lead; its GC root path tells you who keeps it alive.\n","questions":[{"id":"Q1","kind":"technical","question":"How does the .NET garbage collector decide what to collect, and why does it use generations and a separate Large Object Heap?","answer":"The GC collects objects that are no longer reachable. It starts from roots — static fields, local variables on running threads, and GC handles — and marks everything it can reach. Anything not marked is garbage, and its memory can be reused.\n\nGenerations are based on a simple observation: most objects die young. A request creates many small objects and drops them quickly. So new objects go into generation 0, which is collected often and cheaply. Objects that survive move to generation 1 and then generation 2. Gen 2 is collected less often because a full collection is more expensive.\n\nThe Large Object Heap is for objects of 85,000 bytes or more, like big arrays or big strings. Copying large objects during compaction is expensive, so by default the LOH is not compacted. It is collected only with gen 2. That means allocating many large temporary buffers can cause fragmentation and expensive gen 2 collections.\n\nSo in practice I try to keep allocations short-lived and small on hot paths, and for large buffers I use pooling, like ArrayPool.\n","deeper":"- Mark and compact: after marking, the GC compacts small-object generations to avoid fragmentation and updates references. This is why allocation in .NET is fast — it is mostly a pointer bump.\n- Background GC lets gen 2 collections run mostly concurrently with application threads; gen 0/1 collections still pause threads briefly.\n- Server GC: one heap and GC thread per logical core; higher throughput, larger memory footprint. Workstation GC: smaller footprint, better for many small processes. Settings: `<ServerGarbageCollection>`, `<ConcurrentGarbageCollection>`, or `runtimeconfig.json`.\n- LOH compaction can be requested once via `GCSettings.LargeObjectHeapCompactionMode`, but pooling is usually the better fix.\n- When GC is the problem: high \"% time in GC\", frequent gen 2 collections, or large allocation rate. Measure with `dotnet-counters` before tuning anything.\n- Finalizers delay collection: objects with finalizers survive at least one extra GC. Use `SafeHandle` and the dispose pattern instead of writing finalizers.\n","evaluating":"Whether you understand reachability (the real definition of a leak), why generations exist, and the practical impact of the LOH. Strong candidates connect GC behaviour to coding choices on hot paths.\n","weak":["Saying the GC uses reference counting.","Saying calling Dispose frees managed memory.","Recommending GC.Collect() calls as a fix for memory problems."],"levelUp":"A senior developer explains generations and the LOH correctly. An architect also connects GC mode and memory limits to hosting decisions — many app pools on one IIS server, container memory limits, or server vs workstation GC — and insists on measuring before tuning.\n","followUp":{"question":"When would you consider switching from server GC to workstation GC?","answer":"When many .NET processes share one machine and total memory matters more than throughput — for example many small app pools on one IIS server, or many small containers with low memory limits. Server GC creates a heap per core and can use much more memory. I would not switch on opinion; I would measure memory and latency under realistic load in both modes, and also check whether newer adaptive settings already solve the problem.\n"},"qid":"D009-Q1"},{"id":"Q2","kind":"scenario","question":"An application on IIS grows in memory for hours until the app pool recycles, and then the cycle starts again. How would you diagnose it?","answer":"A steady climb that resets only at recycle usually means a leak — objects that stay reachable — not just normal GC behaviour.\n\nFirst, I confirm the trend and what kind of memory is growing. If it is .NET Framework, I use the \".NET CLR Memory\" performance counters; if it is ASP.NET Core in-process on IIS, I use dotnet-counters. I want to know: is the managed heap growing, especially gen 2 or the LOH, or is it native memory?\n\nIf the managed heap grows, I take two heap snapshots, maybe one hour apart. For .NET Core I use dotnet-gcdump or dotnet-dump. For .NET Framework, I take a dump of w3wp with ProcDump and open it in PerfView, DebugDiag or WinDbg. I compare which types keep increasing.\n\nThen I find the GC root of those objects — who holds them. Very often it is a static dictionary used as a cache with no limit, or event handlers that are never removed.\n\nThe fix depends on the cause, for example a bounded MemoryCache with expiry. Then I verify the memory curve is flat under load.\n","deeper":"- Rule out non-leaks first: server GC simply using memory it is allowed to use; a cache that is large but bounded; normal warm-up growth that levels off.\n- Managed vs native: if process private bytes grow but the GC heap is flat, suspect native memory — unmanaged libraries, undisposed native resources, or many threads with stacks.\n- Tools by platform:\n  - **.NET (Core/5+)**: `dotnet-counters monitor`, `dotnet-gcdump collect`, `dotnet-dump collect` then `dumpheap -stat`, `gcroot <address>`.\n  - **.NET Framework**: perfmon counters, ProcDump (`-ma` for full dump), DebugDiag memory analysis, PerfView heap snapshots, WinDbg + SOS.\n- Take dumps carefully in production: a full dump can freeze the process for seconds and may contain sensitive data — follow data-handling rules and store dumps securely.\n- Keep recycling as a safety net while you fix the root cause, but do not let it hide the leak.\n","evaluating":"A structured investigation (trend → snapshot → compare → root → fix → verify), knowledge of tools for both modern .NET and .NET Framework, and awareness of production risks such as dump size and sensitive data.\n","weak":["Increasing the server's RAM or recycling more often and calling it solved.","Guessing the cause from code reading only, without heap snapshots.","Using only one snapshot, so it is impossible to see what is growing."],"levelUp":"A senior developer finds the leaking type and fixes it. A lead or architect also separates managed from native memory early, handles dumps securely in a government environment, adds a memory metric and alert so the trend is visible, and makes bounded caches a design standard.\n","followUp":{"question":"How do event handlers cause leaks, and how do you avoid them?","answer":"When an object subscribes to an event, the publisher stores a reference to the subscriber. If the publisher lives long — a static event or a singleton — and the subscriber never unsubscribes, the subscriber can never be collected, even if nothing else uses it. To avoid it, I unsubscribe in Dispose, keep event publishers short-lived where possible, or use other patterns, like an IObservable subscription that returns an IDisposable, so cleanup is explicit.\n"},"qid":"D009-Q2"},{"id":"Q3","kind":"leadership","question":"Your manager says: 'The app pool recycles every night and users are fine, so why spend time on this memory issue?' How do you respond?","answer":"I would first agree with what is true: users are fine today, and recycling is a useful safety net.\n\nThen I would explain the risk in business terms. Recycling does not fix the leak; it hides it. The leak grows with usage. If traffic increases — for example at the end of a reporting period — memory can run out before the scheduled recycle. Then users lose their sessions or get errors at the busiest moment. Also, every recycle causes a slow first request and can interrupt long-running work.\n\nI would show evidence, not opinions: a simple chart of memory over a day, and how close we are to the limit at peak.\n\nThen I would propose a small, time-boxed investigation — maybe two days — with a clear output: the cause and an estimate to fix it. If the fix is big, we can decide together when to schedule it.\n\nThis way the manager does not have to trust my feeling. They get data, a limited cost, and a decision to make.\n","deeper":"- Translate technical risk into impact: outage probability at peak, user-visible errors, lost background work, support cost, and the cost of an emergency fix later versus a planned fix now.\n- Make the trend visible: memory over 24 hours, growth rate per thousand requests, headroom at peak. A forecast (\"at current growth, we hit the limit at about [number] users\") is persuasive.\n- Offer options, not demands: (a) monitor and alert only, (b) time-boxed investigation, (c) full fix. Let the manager choose with the risk stated.\n- Trade-off: not every leak deserves immediate work. A slow, bounded growth with large headroom may correctly be deprioritised — say that honestly.\n- Record the decision (risk accepted, by whom, review date) so it is not forgotten.\n","evaluating":"Your ability to communicate technical risk to non-technical managers, use data instead of fear, and propose a proportionate response. They also check that you respect the manager's priorities rather than arguing for perfection.\n","weak":["Explaining GC generations to the manager in technical detail.","Insisting it must be fixed now without any data on risk or cost.","Accepting 'users are fine' without mentioning peak-load risk."],"levelUp":"A senior developer says the leak is technically wrong and should be fixed. A lead quantifies the risk, offers options with costs, lets the business decide, and puts monitoring in place so the decision is revisited if the trend gets worse.\n","followUp":{"question":"The manager agrees to monitoring only. What do you put in place?","answer":"I would add a metric for process memory and managed heap size to our dashboard, and an alert at a threshold that gives us time to react, for example 70 percent of the limit. I would also log the time of each recycle and its reason. Then I set a review date, maybe one month, to check the trend with the manager. If the alert fires before then, we have the data to start the fix immediately.\n"},"qid":"D009-Q3"}],"exercise":{"title":"Create, observe and fix a cache leak","minutes":25,"body":"1. In a small ASP.NET Core app (or the project), add a leaking endpoint:\n\n```csharp\nstatic readonly Dictionary<Guid, byte[]> Cache = new();\n\napp.MapGet(\"/leak\", () =>\n{\n    Cache[Guid.NewGuid()] = new byte[100_000]; // LOH-sized, never removed\n    return Results.Ok(Cache.Count);\n});\n```\n\n2. Run it, then in another terminal: `dotnet-counters monitor -n <process-name> System.Runtime`. Call `/leak` in a loop (for example with a short PowerShell or bash loop) and watch GC heap size and LOH size climb.\n3. Take two snapshots with `dotnet-gcdump collect -p <pid>` about one minute apart. Open them in Visual Studio or PerfView and compare: which type grows, and what roots it?\n4. Fix it with `IMemoryCache` and a `SizeLimit` plus expiry, or remove the cache. Show that memory now levels off.\n5. Write three lines in your notes: symptom, evidence, fix. This is your future interview story structure — but only tell it as a lab exercise, not as a production incident.\n"},"english":{"task":"Answer Q3 aloud in 60 seconds to an imaginary manager. Use one number (even an example placeholder) and finish with a clear choice for the manager. Record, then check: did you avoid technical words like \"gen 2\" and \"LOH\"?\n","phrases":["You're right that users are fine today; the risk is…","Recycling hides the problem; it doesn't fix it.","I don't have the full answer yet — I'd need about [two days] to find the cause.","Here are three options, with the cost and risk of each.","If we decide to wait, I suggest we at least…"]},"checkpoint":"You can explain without notes why a managed leak is a reachability problem, name the tools you would use on .NET 10 and on .NET Framework/IIS, and your exercise shows the growing type in a gcdump comparison and a flat memory curve after the fix.\n","project":{"milestone":"Capture a memory baseline of the upload and ingestion pipeline with dotnet-counters, confirm uploads are streamed (no whole-file byte[] per request), and note the results in the README.","evidence":"In an interview you can say: 'I measured the memory profile of our upload pipeline, made sure files are streamed instead of buffered, and documented a baseline so regressions are visible.' Show the counters output and the README note."},"references":[{"title":"Fundamentals of garbage collection (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/fundamentals"},{"title":"Workstation and server garbage collection (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/workstation-server-gc"},{"title":"Debug a memory leak in .NET (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/core/diagnostics/debug-memory-leak"},{"title":"dotnet-gcdump diagnostic tool (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/core/diagnostics/dotnet-gcdump"},{"title":"dotnet-counters diagnostic tool (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/core/diagnostics/dotnet-counters"},{"title":"Implement a Dispose method (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/implementing-dispose"}],"id":"D009"},{"day":10,"type":"learn","full":true,"title":"LINQ deferred execution, IQueryable and choosing collections","objective":"Explain deferred execution, multiple enumeration and IEnumerable vs IQueryable, pick the right collection by its lookup cost, and set a LINQ review standard that balances readability and performance.","task":"Log the SQL produced by one EF Core query before and after moving AsEnumerable(), measure a List vs HashSet vs FrozenSet lookup, and keep the project's document list IQueryable until paging.","topics":["csharp","data"],"roles":["lead","architect"],"difficulty":2,"explanation":"Most LINQ operators are **deferred**. Writing `var q = orders.Where(o => o.Total > 100);` does not run anything. It builds a description of the work. The work runs only when something **enumerates** the query: `foreach`, `ToList()`, `Count()`, `First()`, `Any()`. Operators like `ToList()`, `ToArray()` and `ToDictionary()` **materialize** the result once.\n\nTwo consequences follow:\n\n- **Multiple enumeration.** If you enumerate a deferred `IEnumerable<T>` twice, the work runs twice. Against an EF Core query, that means two database round trips. Against a generator or a stream, the second pass may return different data or fail.\n- **Late surprises.** The query uses the state of captured variables at enumeration time, not at definition time, and exceptions appear where you enumerate, not where you wrote `Where`.\n\n**IEnumerable vs IQueryable.** `IEnumerable<T>` LINQ takes delegates (`Func<T,bool>`) and runs **in memory**. `IQueryable<T>` takes **expression trees** (`Expression<Func<T,bool>>`) that a provider such as EF Core translates to SQL. The static type decides which `Where` the compiler picks:\n\n```csharp\n// SQL: WHERE Status = 'Active' — filtered in the database\nvar a = db.Documents.Where(d => d.Status == \"Active\").ToList();\n\n// SQL: SELECT * FROM Documents — filtered in memory\nvar b = db.Documents.AsEnumerable().Where(d => d.Status == \"Active\").ToList();\n```\n\nAfter `AsEnumerable()` (or an early `ToList()`, or a method parameter typed as `IEnumerable<T>`), everything runs in the application. EF Core does not warn you, because the query is valid; it is just expensive.\n\n**Collections and complexity.** Choose by the operation you do most:\n\n- `List<T>`: index O(1), `Contains` O(n).\n- `HashSet<T>` / `Dictionary<K,V>`: lookup O(1) on average; needs good `GetHashCode`/`Equals`.\n- `SortedDictionary<K,V>`: O(log n), keeps keys ordered.\n- `FrozenDictionary` / `FrozenSet` (.NET 8+, `System.Collections.Frozen`): slower to create, faster to read. Good for data built once at startup and read on every request, such as allow-lists or lookup tables.\n\nA `Contains` on a `List` inside a loop over another list is O(n×m). Switching to a `HashSet` is often the single biggest LINQ performance fix, and it keeps the code readable.\n","questions":[{"id":"Q1","kind":"technical","question":"Explain deferred execution in LINQ. What is the real difference between IEnumerable and IQueryable, and why does it matter?","answer":"Deferred execution means a LINQ query is only a description of work. Nothing runs when I write Where or Select. It runs when I enumerate it, for example with foreach, ToList, Count or First.\n\nThis matters because if I enumerate the same query twice, the work happens twice. With EF Core, that is two database calls. And the query uses the values of variables at the time it runs, not when I wrote it.\n\nThe difference between IEnumerable and IQueryable is where the work runs. IEnumerable LINQ takes normal delegates and runs in memory, in my process. IQueryable takes expression trees, and a provider like EF Core translates them into SQL, so filtering and paging happen in the database.\n\nThe compiler picks the method by the static type. So if I call AsEnumerable, or pass the query to a method that takes IEnumerable, the next Where runs in memory. The code looks the same, but now we may load the whole table.\n\nMy rule is simple: keep it IQueryable until the database has done the filtering, projection and paging. Then materialize once with ToList, and work with the list.\n","deeper":"- `Enumerable.Where` takes `Func<T,bool>` (compiled code). `Queryable.Where` takes `Expression<Func<T,bool>>` (data the provider can inspect and translate).\n- Not every C# expression can be translated. Since EF Core 3.0, an untranslatable expression in a filter throws at runtime instead of silently running on the client; only the final `Select` projection may run on the client. That is safer, but it pushes people to \"fix\" the error with `AsEnumerable()`, which moves all filtering to memory.\n- Immediate operators: `ToList`, `ToArray`, `ToDictionary`, `Count`, `First`, `Any`, `Sum`, `Max`. Everything else is mostly deferred.\n- Multiple enumeration can be detected by the analyzer rule CA1851 (off by default in many configurations — verify against current docs) and by EF Core logging showing repeated queries.\n- Tradeoff: materializing early is not always wrong. If you need the data several times and the set is small and already filtered, one `ToList()` is the correct, honest choice.\n- When deferred execution helps: composing filters conditionally (`if (x) q = q.Where(...)`) and building one SQL statement at the end.\n","evaluating":"Whether you know where the code actually executes, not only the definitions. They want to hear the link between static type, expression trees and SQL, and the practical risk of loading too much data or querying twice.\n","weak":["Saying IQueryable is 'faster' without explaining that it means the database does the work.","Not knowing that AsEnumerable() or an IEnumerable parameter switches the rest of the query to memory.","Thinking ToList() everywhere is always safe, ignoring memory and the cost of loading unneeded rows."],"levelUp":"A senior developer explains deferred execution and the IQueryable boundary correctly. A lead or architect also defines where that boundary lives in the design — for example, repositories or query handlers return projected, paged DTOs, never open IQueryable to the UI — and adds SQL logging in development so the team sees what each query costs.\n","followUp":{"question":"Should a repository return IQueryable to its callers?","answer":"It depends on the team and the design. Returning IQueryable is flexible, but it leaks data-access details: callers can build queries the database cannot run well, and the repository can no longer guarantee paging or security filters. In most business systems I prefer query methods that return a specific, paged result or DTO. Inside a small internal module, returning IQueryable can be acceptable if the team understands the risk. The key is to decide it once and be consistent.\n"},"qid":"D010-Q1"},{"id":"Q2","kind":"scenario","question":"A document search endpoint was fine in testing but now takes 20 seconds and the server memory jumps on every call. In the code you see db.Documents.AsEnumerable().Where(...).Skip(...).Take(20). How do you investigate and fix it?","answer":"The AsEnumerable before Where is my first hypothesis. It means EF Core sends SELECT star from the whole Documents table, loads every row into memory, and only then filters and pages in C#. In testing the table was small, so nobody noticed. In production it is large, so we get slow responses and high memory.\n\nTo confirm it, I would look at the SQL that runs. In development I can enable EF Core logging or call ToQueryString. In production I can check SQL Server, for example Query Store or a trace, and I expect a query with no WHERE clause and a huge number of rows read.\n\nThe fix is to move AsEnumerable to the end, or remove it, so Where, OrderBy, Skip and Take become SQL. I would also add a Select projection, so we only load the columns the list needs, not the document content.\n\nThen I check why it was added. Often a developer used AsEnumerable because some expression could not be translated, like a custom C# method. In that case I rewrite the filter in a translatable form or add a computed column. Finally I would add a test or a review check for this pattern.\n","deeper":"- Evidence: EF Core `LogTo` / `ToQueryString()` in development; Query Store, Extended Events or Activity Monitor in SQL Server; memory and GC counters (`dotnet-counters`) on the app side. On IIS, memory growth per request may look like a leak — it is actually huge allocations, often on the Large Object Heap.\n- Root causes behind `AsEnumerable()` / early `ToList()`:\n  - Untranslatable filter (custom method, unsupported string function).\n  - A helper method that accepts `IEnumerable<T>` instead of `IQueryable<T>`.\n  - Copy-paste from in-memory code.\n- Fix options:\n  - **Rewrite in translatable form** — best; the database filters and pages.\n  - **Split the query** — translatable filters in SQL first, then a small in-memory step on the already reduced set.\n  - **Computed/persisted column or raw SQL** — when the logic genuinely belongs in the database.\n- Also check: an `OrderBy` before `Skip/Take` (paging without stable ordering is non-deterministic), and an index matching the filter and sort.\n- Prevention: a review checklist item, SQL logging in dev, and a performance test with production-like data volume.\n","evaluating":"Your troubleshooting structure — hypothesis, evidence, fix, prevention — and whether you understand why it passed testing. They also look for the root cause question: why was AsEnumerable added in the first place?\n","weak":["Adding more memory or caching the whole table instead of fixing the query.","Removing AsEnumerable without checking whether the filter can be translated, causing a runtime exception.","Fixing the code but not asking why tests with small data did not catch it."],"levelUp":"A senior developer moves the filter back to SQL and adds a projection. A lead also closes the gap that let it reach production — realistic test data volumes, SQL logging in development, a checklist item — and shares the case with the team as a short learning, without blaming the author.\n","followUp":{"question":"The filter uses a custom C# method that EF Core cannot translate. What are your options?","answer":"First, I try to express the same logic with operations EF Core can translate, like comparisons, string Contains or StartsWith, and simple arithmetic. If the logic is complex but stable, I can move it into the database, for example a computed column with an index, or a SQL function mapped in EF Core. Another option is to filter as much as possible in SQL and run the custom method in memory on the small remaining set. I avoid loading everything and filtering in memory.\n"},"qid":"D010-Q2"},{"id":"Q3","kind":"leadership","question":"In code reviews your team keeps arguing about LINQ: some want readable chains everywhere, others want hand-written loops for performance. How would you set a standard?","answer":"I would make the standard about evidence, not personal taste.\n\nThe default is readability. Clear LINQ is easier to review and change, and in most business code the cost is tiny compared to a database call or an HTTP request. So I would not accept \"loops are faster\" as a review comment by itself.\n\nBut some rules are about correctness and real cost, and those are not optional. For example: keep queries IQueryable until filtering and paging are done, don't enumerate the same query twice, use a HashSet or Dictionary for lookups inside loops, and always project only the columns you need.\n\nFor hot paths, the rule is \"measure first\". If someone wants to replace LINQ with a loop, they bring a benchmark or a profiler result that shows it matters. Then we accept it and add a short comment explaining why.\n\nI would write this as a one-page guideline with examples, agree it with the team, and add the important parts to the PR checklist and analyzers. After a month we review whether the debates in reviews actually reduced.\n","deeper":"- Separate three categories in the guideline:\n  - **Correctness / data access** (must): IQueryable boundary, no repeated enumeration of queries, ordered paging, projections.\n  - **Complexity** (must): no O(n×m) `Contains` on lists inside loops; pick collections by lookup pattern.\n  - **Micro-performance** (only with evidence): loops vs LINQ, `Span<T>`, avoiding allocations in hot paths. Require BenchmarkDotNet or profiler data.\n- Automate what you can: analyzers such as CA1851 (multiple enumeration) and CA1827/CA1860 (Count/Any usage) — check the current rule list before enforcing.\n- Tradeoff: too many rules slow reviews and feel like policing; too few lead to repeated debates. A short list with examples works better than a long document.\n- Use \"comment labels\" in reviews (must / suggestion / question) so personal preferences do not block merges.\n","evaluating":"Whether you can turn a recurring team disagreement into a clear, evidence-based standard, separate correctness from taste, and keep reviews fast and respectful.\n","weak":["Picking a side ('LINQ is always fine' or 'loops are always faster') without evidence.","Writing a long rulebook that nobody reads or enforces.","Letting the most senior person's preference decide every debate."],"levelUp":"A senior developer gives correct review comments case by case. A lead turns the repeated argument into a short agreed guideline with must/suggestion levels, automates the mechanical parts, and requires measurement for performance claims — so reviews become faster and less personal.\n","followUp":{"question":"Tell me about a time you disagreed with a code review comment.","answer":"**Example answer — adapt to your real experience.** On [project name], a reviewer asked me to rewrite [a LINQ query / a method] as [a loop / a different approach] for performance. I thought it reduced readability without a real gain. Instead of arguing in comments, I suggested we measure: I ran [a benchmark / a profiler session] and the difference was [result]. We agreed to [keep it / change it] and added [a guideline / a comment]. What I learned is to move debates from opinion to evidence quickly.\n"},"qid":"D010-Q3"}],"exercise":{"title":"See where your LINQ runs and what your lookups cost","minutes":25,"body":"1. In the project (or a small EF Core console app with SQLite or LocalDB), write the same query two ways and print the SQL with `ToQueryString()` or `optionsBuilder.LogTo(Console.WriteLine)`:\n\n```csharp\nvar good = db.Documents\n    .Where(d => d.Title.Contains(term))\n    .OrderBy(d => d.UploadedAt)\n    .Select(d => new { d.Id, d.Title })\n    .Take(20);\n\nvar bad = db.Documents\n    .AsEnumerable()\n    .Where(d => d.Title.Contains(term))\n    .Take(20);\n```\n\nWrite one sentence for each: what SQL ran and how many rows were read.\n\n2. Create 100,000 strings. Measure 10,000 `Contains` calls against a `List<string>`, a `HashSet<string>` and a `FrozenSet<string>` (use `Stopwatch` now; BenchmarkDotNet comes on Day 12). Also measure creation time for each.\n3. Find one place where a deferred query is enumerated twice (for example `if (q.Any()) foreach (var x in q)`) and fix it.\n4. Write a 5-line \"LINQ review guideline\" with must / suggestion levels.\n"},"english":{"task":"Answer Q2 aloud in 90 seconds using \"symptom → hypothesis → evidence → fix → prevention\". Then explain the IEnumerable vs IQueryable difference to an imaginary non-technical manager in 30 seconds, with no code words except \"database\" and \"memory\".\n","phrases":["The code looks the same, but the difference is where it runs.","In testing the data was small, so we didn't see it.","My default is readability, unless we have evidence that…","Could you share the numbers behind that? Then we can decide.","So in short, we were loading everything and filtering at the end."]},"checkpoint":"You can explain deferred execution and the IQueryable boundary in under 90 seconds without notes, and your exercise shows the two SQL statements (filtered vs unfiltered) plus measured List/HashSet/FrozenSet lookup and creation times.\n","project":{"milestone":"Document list endpoint keeps the query IQueryable until filtering, ordering, projection and paging are done (verified by logged SQL); allowed upload file extensions stored in a FrozenSet built at startup.","evidence":"You can say: 'I checked the generated SQL for every list endpoint and made sure paging and projection run in the database' — and show the logged SQL before and after."},"references":[{"title":"Language Integrated Query (LINQ) overview (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/csharp/linq/"},{"title":"Client vs. server evaluation in EF Core (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/ef/core/querying/client-eval"},{"title":"Efficient querying in EF Core (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/ef/core/performance/efficient-querying"},{"title":"FrozenDictionary<TKey,TValue> class (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/api/system.collections.frozen.frozendictionary-2"},{"title":"CA1851: Possible multiple enumerations of IEnumerable collection (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/fundamentals/code-analysis/quality-rules/ca1851"}],"id":"D010"},{"day":11,"type":"learn","full":true,"title":"Exception strategy, IExceptionHandler and ProblemDetails","objective":"Design an error-handling strategy for an ASP.NET Core API — which errors are exceptions, how they become ProblemDetails, where they are logged once — and lead a team decision on exceptions vs the Result pattern with an ADR.","task":"Project: add a global IExceptionHandler that maps known exceptions to ProblemDetails with a traceId, and prove with one test that an unknown error returns a safe 500 without leaking details.","topics":["aspnet","architecture"],"roles":["lead","architect"],"difficulty":2,"explanation":"An error strategy answers four questions: **which failures are exceptions, where are they caught, how are they logged, and what does the client see.**\n\n**Expected vs unexpected failures.** \"Document not found\", \"validation failed\" or \"user has no access\" are normal business outcomes. Unexpected failures are bugs and infrastructure problems: a null reference, a database timeout, a broken network. Many teams use exceptions for both; others return a **Result** object for expected outcomes and keep exceptions for the unexpected. Both can work. Mixing them randomly does not.\n\n**Catch at the boundary.** Most code should not catch exceptions at all. Catch only where you can do something useful: retry, add context, translate, or compensate. Everything else bubbles up to one place — the global handler. In ASP.NET Core (.NET 8+) that place is an `IExceptionHandler`:\n\n```csharp\npublic sealed class AppExceptionHandler(IProblemDetailsService pds) : IExceptionHandler\n{\n    public async ValueTask<bool> TryHandleAsync(\n        HttpContext ctx, Exception ex, CancellationToken ct)\n    {\n        var (status, title) = ex switch\n        {\n            NotFoundException  => (404, \"Resource not found\"),\n            ForbiddenException => (403, \"Access denied\"),\n            _                  => (500, \"An unexpected error occurred\")\n        };\n        ctx.Response.StatusCode = status;\n        return await pds.TryWriteAsync(new ProblemDetailsContext\n        {\n            HttpContext = ctx,\n            Exception = ex,\n            ProblemDetails = { Title = title, Status = status }\n        });\n    }\n}\n// Program.cs\nbuilder.Services.AddProblemDetails();\nbuilder.Services.AddExceptionHandler<AppExceptionHandler>();\napp.UseExceptionHandler();\n```\n\n**ProblemDetails** (RFC 9457, which replaced RFC 7807) is a standard JSON error shape: `type`, `title`, `status`, `detail`, `instance`, plus extensions such as a `traceId`. Clients get one consistent format; internal details such as stack traces and SQL messages never leave the server in production.\n\n**Log once.** The classic anti-pattern is catch → log → rethrow at every layer, which produces five log entries for one error. Log at the boundary with full context and the trace id. If you rethrow, use `throw;` (not `throw ex;`) to keep the stack trace. Never swallow: an empty `catch {}` turns a production problem into silence.\n\nNote: the exception handler middleware also writes its own diagnostics; how it behaves when your handler returns `true` changed across versions (verify against current docs), so check you do not get duplicate logs.\n","questions":[{"id":"Q1","kind":"technical","question":"How do you design global error handling in an ASP.NET Core API? Walk me through IExceptionHandler and ProblemDetails.","answer":"I start with one principle: most code should not catch exceptions. Exceptions bubble up to one global handler at the edge of the API.\n\nIn ASP.NET Core, from .NET 8, I implement IExceptionHandler. It has one method, TryHandleAsync. I map known exception types to status codes, for example not found to 404, forbidden to 403, and everything unknown to 500. Then I write the response as ProblemDetails, using the ProblemDetails service. I register it with AddExceptionHandler, AddProblemDetails, and UseExceptionHandler early in the pipeline.\n\nProblemDetails is a standard JSON format for errors, with type, title, status and detail. I also add a trace id, so when a user reports a problem, support can find the exact log entry.\n\nTwo rules are important. First, for 500 errors we never return the exception message or stack trace to the client; that can leak SQL or internal paths. Second, we log once, at the handler, with the full exception and context, not in every layer.\n\nThe tradeoff is that a global handler is generic. If a specific operation can recover, for example retry or fall back, it should catch locally. The global handler is for everything else.\n","deeper":"- You can register several `IExceptionHandler`s; they run in registration order until one returns `true`. Keep them small: one for validation, one for domain errors, one catch-all.\n- `UseExceptionHandler()` must be early in the pipeline so it wraps the rest. Developer exception page is for development only.\n- If the response has already started (for example while streaming), the handler cannot change the status code. Streaming endpoints need their own error strategy.\n- `OperationCanceledException` when the client disconnected (`RequestAborted`) is not a server error. Handle it separately and do not log it as an error, or your alerts become noise.\n- Validation errors usually use `ValidationProblemDetails` (400) with field-level errors, often produced before reaching the handler.\n- Legacy ASP.NET MVC / Web API (.NET Framework) equivalents are `HandleErrorAttribute`, `Application_Error` and `IExceptionHandler`/`IExceptionLogger` in Web API 2 — a different interface with the same name, which is a common source of confusion in migrations.\n","evaluating":"Whether you know the modern built-in mechanism, not only custom middleware, and whether you think about security (no leakage), operability (trace id, log once) and client contract (consistent error format).\n","weak":["Wrapping every controller action in try/catch that returns BadRequest(ex.Message).","Returning stack traces or exception messages to clients in production.","Not mentioning logging or correlation, so the error is visible to the user but not to the team."],"levelUp":"A senior developer implements the handler correctly. A lead or architect defines it as a contract: a documented error catalog (type URIs and status codes), consistent behaviour across all services, trace ids that connect the client error to logs, and rules for which exceptions trigger alerts.\n","followUp":{"question":"Should a 'document not found' be an exception or a normal return value?","answer":"It depends on the team's strategy, but I need consistency. Not found is an expected outcome, so many teams return null or a result and let the endpoint return 404 directly. That is cheaper and clearer in the code. Throwing a NotFoundException is also acceptable if the team uses domain exceptions mapped by the global handler — it keeps endpoints short. What I avoid is a mix, where some services return null and others throw for the same situation.\n"},"qid":"D011-Q1"},{"id":"Q2","kind":"scenario","question":"Users complained for days that some invoices were missing, but there were no errors in the logs. You find catch blocks that swallow exceptions. How do you handle this, short and long term?","answer":"This is a dangerous situation, because the system is failing silently and losing data, and monitoring tells us everything is fine.\n\nShort term, I first find the scope. I search the code for empty catch blocks, or catch blocks that only return null or false, especially around the invoice flow. I check if a background job or integration is involved, because those often swallow errors. Then I compare data: which invoices were expected and which were saved, so we know the business impact and can recover the missing records.\n\nFor the hotfix, I replace the swallowing catch with proper handling: log the exception with context, like the invoice number, and either rethrow or mark the item as failed so it can be retried. I add an alert on that failure.\n\nLong term, I fix the system, not just the bug. We agree a rule: no empty catches, catch only where you can act, and log once at the boundary. I add an analyzer or review checklist item for it. I also add a business-level check, for example a daily count of invoices created versus requested, because technical logs alone did not catch this.\n\nFinally I would run a short blameless review, so the team learns from it.\n","deeper":"- Why it happens: developers add `catch (Exception) { }` to \"stop the crash\" during an incident or demo, then forget it. Or a catch logs at Debug level, which is filtered out in production.\n- Finding them: search for `catch {`, `catch (Exception)` followed by `return null/false`, and logging at low levels. Analyzers such as CA1031 (do not catch general exception types) can surface candidates, though it is noisy.\n- Background workers are the highest risk: an exception inside a loop may kill the worker silently, or be swallowed per item. Use a per-item try/catch that logs and moves the item to a failed/dead-letter state.\n- Recovery is part of the fix: reconcile against the source of truth, replay or re-import missing records, and communicate impact to the business owner.\n- Detection: add a business metric (expected vs created counts) and an alert. Logs only help if someone is alerted.\n- Tradeoff: swinging to \"catch nothing\" in a worker can crash the whole process on one bad item. The goal is visible failure, not maximum crashing.\n","evaluating":"Whether you think about business impact and data recovery, not only code, and whether you add detection so a silent failure cannot happen again. Calm incident handling and blameless learning are also signals for a lead.\n","weak":["Only removing the empty catch, without recovering the lost invoices.","Blaming the developer who wrote the catch.","Adding more logging but no alert, so the next failure is still invisible."],"levelUp":"A senior developer finds and fixes the swallowing code. A lead treats it as an incident: measures business impact, leads data recovery with the business owner, adds detection at the business level, and turns it into a team standard and a blameless learning review.\n","followUp":{"question":"How should a background worker handle an exception for one item out of a batch of a thousand?","answer":"It should not stop the whole batch, and it should not hide the failure. I wrap each item in its own try/catch, log the error with the item id and a correlation id, and mark the item as failed — for example, a status column or a dead-letter queue — with a retry count. Transient errors can be retried with backoff. After the batch, we report how many failed, and alert if the number is above a threshold. Someone must be able to see and replay failed items.\n"},"qid":"D011-Q2"},{"id":"Q3","kind":"leadership","question":"Your team is split: half want to keep exceptions for business errors, half want to adopt a Result pattern. The debate is slowing down reviews. How do you lead the decision?","answer":"My goal is to turn a long debate into one clear decision that the team owns, and write it down so we don't repeat it.\n\nFirst, I make sure both sides are heard with concrete examples from our code, not general opinions. I ask each side to show one real endpoint written their way. This usually shows the real tradeoffs: exceptions keep code short and work well with a global handler, but they hide failure paths and are expensive if used for normal flow. Result makes failure explicit in the method signature, but adds code and needs discipline at every call.\n\nThen I write an ADR with the options, the decision criteria — readability, consistency, performance, effort to migrate — and the consequences. Often the answer is a middle path: Result for expected business outcomes like validation and not found, exceptions for unexpected failures, and one global handler for those.\n\nWe review the ADR together, decide, and set a review date. If the team still disagrees, as the lead I make the call and explain why. After that, we apply it to new code, update the guidelines, and don't rewrite old code just for consistency.\n","deeper":"Short ADR outline you can draw on a whiteboard:\n\n- **ADR-00X: Error handling strategy for business failures** — Status: Proposed → Accepted, date, deciders.\n- **Context:** mixed styles, review debates, inconsistent API errors, one silent-failure incident.\n- **Decision drivers:** explicit failure paths, consistent ProblemDetails output, low ceremony, performance on hot paths, migration cost.\n- **Options:** (1) exceptions everywhere + global handler; (2) Result everywhere; (3) Result for expected business outcomes, exceptions for unexpected failures.\n- **Decision:** chosen option and one-line reason.\n- **Consequences:** positive (clear signatures, one error format), negative (extra mapping code, a small shared Result type or library to maintain), and rules for new vs old code.\n- **Review:** revisit after [N] sprints with evidence (review time, incidents).\n\nTradeoffs to name: no built-in Result type exists in .NET, so you either write a small one or adopt a library (a dependency decision). \"Disagree and commit\" works only if people felt heard first.\n","evaluating":"Whether you can lead a technical disagreement to a timely decision, use written decision records, stay neutral on taste, and protect delivery by not forcing a big rewrite.\n","weak":["Deciding alone immediately without hearing the team, or letting the debate continue for months.","Choosing one pattern as 'always correct' without tradeoffs.","Ordering a rewrite of all existing code to match the new decision."],"levelUp":"A senior developer argues their preferred pattern well. A lead structures the decision: concrete examples, explicit criteria, an ADR with consequences and a review date, then makes the call if consensus fails — and turns the decision into guidelines so reviews get faster.\n","followUp":{"question":"Tell me about a technical decision you documented so the team would not repeat a debate.","answer":"**Example answer — adapt to your real experience.** On [system name], the team kept discussing [topic, e.g. error handling / ORM choice / API versioning]. I wrote a short decision record with [the options] and [the criteria], reviewed it in [a team meeting], and we chose [decision] because [main reason]. Afterwards, [review comments on this topic dropped / new members onboarded faster / result]. If I did it again, I would [one honest improvement].\n"},"qid":"D011-Q3"}],"exercise":{"title":"Global exception handler with safe ProblemDetails","minutes":25,"body":"1. In the project API, add `AddProblemDetails()`, an `AppExceptionHandler : IExceptionHandler` (see the explanation), and `UseExceptionHandler()` as the first middleware.\n2. Add a `traceId` extension using `Activity.Current?.Id ?? httpContext.TraceIdentifier` (via `AddProblemDetails(o => o.CustomizeProblemDetails = ...)`).\n3. Create two test endpoints in Development: one throws `NotFoundException`, one throws `InvalidOperationException(\"SQL: secret connection detail\")`.\n4. Call both. Confirm: 404 with a clear title; 500 with a generic title, the trace id, and **no** exception message in the body. Confirm the error is logged **once** with the same trace id.\n5. Write one integration test with `WebApplicationFactory` that asserts the 500 response body does not contain \"secret\".\n6. Draft the next ADR, \"Error handling strategy\", using the outline in Q3 (10 lines max; Status: Proposed).\n"},"english":{"task":"Explain your error-handling strategy aloud in 90 seconds as if to a new team member: \"what we catch, where we log, what the client sees\". Then do Q2 in 90 seconds using \"impact → scope → hotfix → recovery → prevention\". Record both and remove filler words on the second try.\n","phrases":["The system was failing silently, which is worse than failing loudly.","First I want to understand the business impact.","Both options are valid; the question is which tradeoff fits us.","Let's write it down as a decision record, so we don't repeat this discussion.","I'm not sure how that behaves in this version — I would check the docs before relying on it.","To make sure this doesn't happen again, we added…"]},"checkpoint":"Your API returns ProblemDetails with a trace id for both a known and an unknown exception, the 500 body leaks no internal detail (proved by a passing test), the error appears once in the logs, and the error-handling ADR is drafted with at least three options and consequences.\n","project":{"milestone":"Global IExceptionHandler + ProblemDetails with traceId in the Research and Benchmarking Assistant API, a leak-prevention integration test, and an error-handling ADR in Proposed status (next number after ADR-001).","evidence":"You can say: 'I defined the API error contract — ProblemDetails with trace ids, no internal leakage, log once — and documented the exceptions vs Result decision in an ADR.' Show the handler, the test and the ADR."},"references":[{"title":"Handle errors in ASP.NET Core (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/aspnet/core/fundamentals/error-handling"},{"title":"Handle errors in ASP.NET Core controller-based web APIs (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/aspnet/core/web-api/handle-errors"},{"title":"Best practices for exceptions (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/standard/exceptions/best-practices-for-exceptions"},{"title":"RFC 9457: Problem Details for HTTP APIs (RFC Editor)","url":"https://www.rfc-editor.org/rfc/rfc9457"},{"title":"Logging in .NET (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/core/extensions/logging"}],"id":"D011"},{"day":12,"type":"learn","full":true,"title":"Performance investigation: measure first, then optimise","objective":"Investigate a .NET performance problem with evidence (percentiles, counters, traces, benchmarks) instead of guesses, and explain the tradeoffs of each tool.","task":"Project: write a BenchmarkDotNet benchmark for the text chunker, compare a naive and an improved version on time and allocations, and record the result in the README.","topics":["csharp","aspnet"],"roles":["lead","architect"],"difficulty":2,"explanation":"The first rule of performance work is **measure first**. Most \"obvious\" performance fixes are wrong, because the slow part is rarely where we think it is. A good investigation follows the same loop every time: **symptom → hypothesis → measurement → change → measure again**.\n\n**Use percentiles, not averages.** An average hides the users who suffer. If p50 is 80 ms and p99 is 2 seconds, one request in a hundred is very slow — and on a busy page that loads ten API calls, many users hit it. Track p50, p95 and p99 per endpoint, and compare them before and after each release.\n\nChoose the tool by the question you are asking:\n\n- **dotnet-counters** — live, low-overhead view of a running process: CPU, GC heap size, GC count per generation, allocation rate, thread-pool queue length, exceptions per second. Good for the first five minutes: \"Is it CPU, GC, or waiting?\"\n- **dotnet-trace** — collects a trace (CPU samples, events) you open in Visual Studio, PerfView or speedscope. It answers \"which methods take the time?\"\n- **APM / OpenTelemetry** (Application Insights or an on-prem stack) — distributed traces show which dependency (SQL, HTTP, storage) is slow for a real request.\n- **BenchmarkDotNet** — reliable micro-benchmarks for one piece of code. It handles warm-up, JIT, many iterations and statistics. `[MemoryDiagnoser]` adds allocations per operation.\n- For .NET Framework on IIS: PerfView and Windows performance counters fill the same role.\n\n```csharp\n[MemoryDiagnoser]\npublic class ChunkerBenchmarks\n{\n    [Benchmark(Baseline = true)] public int Naive()    => NaiveChunker.Chunk(_text, 1000, 100).Count;\n    [Benchmark]                  public int Improved() => ImprovedChunker.Chunk(_text, 1000, 100).Count;\n}\n```\n\n**Allocations matter** in server code. More allocations mean more Gen0 collections; large objects (85,000 bytes or more) go to the LOH and are collected with Gen2, which can create long pauses and push p99 up even when the average looks fine.\n\nCommon traps:\n\n- Benchmarking in Debug mode or with a debugger attached.\n- Measuring with one `Stopwatch` run, which includes JIT and cold caches.\n- Optimising code that takes 2% of the request while a database call takes 90%.\n- Making code faster but wrong — always keep a correctness test next to the benchmark.\n\nFinally, performance is a **requirement**, not a feeling. \"The search endpoint must answer in under 500 ms at p95 with 200 concurrent users\" can be tested and defended. \"It should be fast\" cannot.\n","questions":[{"id":"Q1","kind":"technical","question":"A developer says their new method is faster because a Stopwatch test showed it. How do you measure properly whether one .NET implementation is faster than another?","answer":"A single Stopwatch run is not reliable. The first call includes JIT compilation, the caches are cold, and the result changes with whatever else the machine is doing. Also, people often run it in Debug mode, where the compiler does not optimise.\n\nFor comparing two implementations, I use BenchmarkDotNet. It runs in Release, does warm-up iterations, runs the code many times, and gives statistics like mean, error and standard deviation. I mark the old version as the baseline, so I see a clear ratio, for example \"0.4 times the baseline\". I also add the MemoryDiagnoser, because allocations are often more important than raw speed in a web server. Fewer allocations means less GC work for every request.\n\nI also use realistic input sizes with Params. A method can be faster on 100 items and slower on one million.\n\nBut I am careful with the conclusion. A micro-benchmark proves this method is faster in isolation. It does not prove the endpoint is faster. If the method is 2% of the request time, the user will not notice. So I check the real request with a trace or with p95 latency before and after.\n","deeper":"- BenchmarkDotNet builds a separate Release process, runs pilot and warm-up stages, picks an iteration count, and reports mean, error, standard deviation and (with `[MemoryDiagnoser]`) Gen0/Gen1/Gen2 collections and bytes allocated per operation.\n- Dead-code elimination: if the benchmark result is not used, the JIT may remove the work. Return the result from the benchmark method.\n- Use `[Params]` for input sizes and `[GlobalSetup]` to build test data outside the measured code.\n- Tradeoffs: micro-benchmarks are precise but narrow. Profilers (dotnet-trace) show where time goes in the real flow but with more noise. Load tests (k6, JMeter, Azure Load Testing) show system behaviour under concurrency. You usually need more than one.\n- When it fails: benchmarking on a laptop on battery, comparing results from different machines, or optimising before a profiler showed the code is on the hot path.\n- Keep a unit test that proves both versions give the same output. A faster wrong answer is a bug.\n","evaluating":"Whether you know why naive timing lies (JIT, warm-up, Debug builds, noise) and know the standard tool. They also check if you separate \"faster in isolation\" from \"faster for the user\".\n","weak":["Trusting one Stopwatch run, or timing a Debug build.","Looking only at time and ignoring allocations and GC.","Claiming the whole application is faster because one micro-benchmark improved."],"levelUp":"A senior developer writes a correct BenchmarkDotNet test and reads the numbers. A lead or architect also asks whether the method is on the hot path at all, ties the result to an endpoint-level target such as p95, and makes benchmarks part of the team's workflow for performance-sensitive code so claims are backed by data in PRs.\n","followUp":{"question":"What does the 'Allocated' column tell you, and why would you care about it in an API?","answer":"It shows how many bytes the method allocates on the managed heap per operation. In an API, that number is multiplied by every request. High allocation means more Gen0 collections, more CPU spent in GC, and sometimes longer pauses that hurt p99. If a single operation allocates large arrays or strings over about 85 KB, they go to the Large Object Heap, which is only collected with Gen2. So reducing allocations often improves tail latency more than micro-optimising the logic.\n"},"qid":"D012-Q1"},{"id":"Q2","kind":"scenario","question":"After a release, the average latency of an important API looks almost the same, but p99 latency has doubled. How do you investigate?","answer":"First, I take it seriously even if the average looks fine. p99 doubling means real users are waiting much longer, and often it gets worse under peak load.\n\nI start by scoping it. Which endpoints? All tenants or some? All servers or one? I compare the dashboards before and after the release, and I check what changed in that release: code, packages, configuration, database migrations.\n\nThen I look at the shape of the problem. With dotnet-counters on one instance, I check GC pause time and Gen2 count, allocation rate, thread-pool queue length and CPU. Tail latency often comes from GC pauses, lock contention, thread-pool starvation, or a slow path that only some requests take, like a big tenant or a cache miss.\n\nNext, I look at distributed traces for the slowest requests only. They usually show if the time is in SQL, an external call, or our own code. If it is our code, I collect a dotnet-trace during the slow period.\n\nIf the impact is serious, I would roll back or switch off the feature flag first, and investigate on staging with a load test. After the fix, I add a p99 alert for that endpoint.\n","deeper":"- Typical causes of tail latency (not average): GC pauses from large or many allocations (LOH, big buffers), lock or `SemaphoreSlim` contention, thread-pool starvation from sync-over-async, retries on a flaky dependency, a new N+1 query that only big records trigger, cold caches after deployment, or a changed logging level.\n- Evidence by tool:\n  - `dotnet-counters monitor -n <process>` for GC, allocation rate, thread-pool queue, exceptions.\n  - Slowest-request traces in Application Insights or an OpenTelemetry backend (on-prem: Jaeger, Grafana Tempo, Elastic APM).\n  - `dotnet-trace collect -p <pid>` during the bad period; SQL Server Query Store for plan regressions.\n- Rollback vs fix forward: if you cannot isolate the cause quickly and the impact is real, rolling back is the safe, boring choice. Then compare the two builds under the same load test.\n- Prevention: performance budgets per endpoint, a load test in the pipeline for critical paths, and alerts on p95/p99 — not only on average or error rate.\n","evaluating":"Whether you understand percentiles and what causes tail latency, follow a structured investigation, and balance user impact (rollback) with finding the root cause. They also check your tool knowledge in production, not only in development.\n","weak":["Ignoring it because the average is fine.","Jumping straight to code changes or adding servers without evidence.","Only checking the database, without considering GC, contention or thread-pool starvation."],"levelUp":"A senior developer finds the cause with the right tools. A lead or architect also manages the release risk (rollback or flag decision), communicates impact in user terms, and adds guardrails — percentile alerts, performance budgets and a load test for critical endpoints — so regressions are caught before production next time.\n","followUp":{"question":"The investigation shows many Gen2 collections after the release. What would you look for in the code?","answer":"I would look for new large allocations: reading a whole file or response into one byte array or string, building big lists in memory, or `ToList()` on large query results. Anything over about 85 KB goes to the Large Object Heap. I would also check new caches that grow without limits, because long-lived objects get promoted to Gen2. Fixes are usually streaming instead of buffering, `ArrayPool` for big buffers, and size limits on caches. Then I confirm the fix with a gcdump or counters.\n"},"qid":"D012-Q2"},{"id":"Q3","kind":"leadership","question":"Your product manager wants only new features this quarter, but you believe the system has performance problems that will hurt users soon. How do you convince them to give time for performance work?","answer":"I would not argue with opinions. I would bring data and translate it into user and business impact.\n\nFirst, I collect evidence: p95 and p99 for the most important user journeys, the trend over the last months, and a simple projection, for example \"at the current growth, search will pass three seconds at peak within two months\". If we have support tickets or timeouts linked to slowness, I include them.\n\nThen I explain it in the product manager's language. Not \"we have Gen2 pressure\", but \"one in twenty searches takes more than three seconds, and the ministry plans to onboard two more departments in [month]\".\n\nNext, I make the request small and specific. Instead of \"we need a performance sprint\", I propose two or three targeted items with expected gains, and maybe 15 or 20 percent of capacity for two sprints. I also offer to measure the result, so they see the return.\n\nFinally, I suggest we agree a performance target as a requirement, like \"p95 under 500 milliseconds for search\". Then future performance work is not a debate. It is keeping a promise to users.\n","deeper":"- Structure that works with product people: **evidence → impact → small specific ask → measurable outcome**.\n- Make performance a non-functional requirement with a number (latency at a percentile, at a load level). Then it enters the backlog like any other requirement.\n- Options with tradeoffs:\n  - Dedicated capacity (for example 15–20% per sprint) — steady, but can be cut when deadlines press.\n  - Attach performance work to related features — easy to accept, but slower.\n  - A short focused effort after a visible incident — strong momentum, but reactive.\n- When it fails: vague claims (\"the code is slow\"), asking for a big rewrite, or not measuring the result afterwards, which kills trust for the next request.\n- Government context: peak periods (annual reports, survey deadlines) are a strong argument, because failure is very visible.\n","evaluating":"Whether you influence with evidence and business language instead of technical complaints, and whether you can negotiate a realistic plan. They want a partner to product, not someone who fights for \"engineering time\" without a case.\n","weak":["'Performance is important, so they must accept it' — no data, no business impact.","Asking for a full rewrite or an open-ended refactoring sprint.","Doing the work secretly inside feature estimates without telling anyone."],"levelUp":"A senior developer says the system is slow and shows a profiler screenshot. A lead turns it into a measurable requirement, quantifies the user and business risk, proposes a small time-boxed plan, and reports the result afterwards — which makes the next negotiation much easier.\n","followUp":{"question":"The product manager still says no. What do you do?","answer":"I accept the decision but make the risk visible. I would write a short note: the current numbers, the expected trend, and what we will do if a threshold is crossed. I would add an alert at that threshold, so we are not surprised. I would also escalate in a calm way if the risk is serious, for example to the architecture or management level, but as shared information, not a complaint. And I keep looking for low-cost improvements inside normal feature work.\n"},"qid":"D012-Q3"}],"exercise":{"title":"Benchmark the text chunker with BenchmarkDotNet","minutes":25,"body":"1. Create a console project next to the solution, for example `benchmarks/Assistant.Benchmarks`, and add the `BenchmarkDotNet` package (`dotnet add package BenchmarkDotNet`).\n2. Paste the starter below. If your project already has a chunker, reference it and use it as the baseline instead of `NaiveChunker`.\n\n```csharp\nusing System.Text;\nusing BenchmarkDotNet.Attributes;\nusing BenchmarkDotNet.Running;\n\nBenchmarkRunner.Run<ChunkerBenchmarks>();\n\n[MemoryDiagnoser]\npublic class ChunkerBenchmarks\n{\n    private string _text = \"\";\n\n    [Params(10_000, 1_000_000)]\n    public int Length;\n\n    [GlobalSetup]\n    public void Setup()\n    {\n        var words = new[] { \"benchmark\", \"policy\", \"indicator\", \"report\", \"the\", \"of\" };\n        var rnd = new Random(42);\n        var sb = new StringBuilder(Length + 16);\n        while (sb.Length < Length) sb.Append(words[rnd.Next(words.Length)]).Append(' ');\n        _text = sb.ToString();\n    }\n\n    [Benchmark(Baseline = true)]\n    public int Naive() => NaiveChunker.Chunk(_text, 1000, 100).Count;\n\n    [Benchmark]\n    public int Improved() => ImprovedChunker.Chunk(_text, 1000, 100).Count;\n}\n\npublic static class NaiveChunker\n{\n    public static List<string> Chunk(string text, int maxChars, int overlap)\n    {\n        var chunks = new List<string>();\n        var current = \"\";\n        foreach (var word in text.Split(' ', StringSplitOptions.RemoveEmptyEntries))\n        {\n            if (current.Length + word.Length + 1 > maxChars)\n            {\n                chunks.Add(current);\n                current = current.Substring(Math.Max(0, current.Length - overlap));\n            }\n            current += word + \" \"; // new string every word\n        }\n        if (current.Length > 0) chunks.Add(current);\n        return chunks;\n    }\n}\n\npublic static class ImprovedChunker\n{\n    public static List<string> Chunk(string text, int maxChars, int overlap)\n    {\n        var chunks = new List<string>(text.Length / (maxChars - overlap) + 1);\n        int start = 0;\n        while (start < text.Length)\n        {\n            int end = Math.Min(start + maxChars, text.Length);\n            if (end < text.Length)\n            {\n                int lastSpace = text.LastIndexOf(' ', end - 1, end - start);\n                if (lastSpace > start) end = lastSpace; // cut on a word boundary\n            }\n            chunks.Add(text.Substring(start, end - start)); // one string per chunk\n            if (end >= text.Length) break;\n            start = Math.Max(end - overlap, start + 1);\n        }\n        return chunks;\n    }\n}\n```\n\n3. Run it in Release without a debugger: `dotnet run -c Release`. Note Mean, Ratio, Gen0 and Allocated for both sizes.\n4. The two chunkers do not cut at exactly the same places. Write one unit test that defines the behaviour you want (no chunk longer than `maxChars`, no lost text, overlap present) and make sure the version you keep passes it.\n5. In the README, add a \"Performance\" section: the table, one sentence on why the improved version allocates less, and one sentence on whether chunking actually matters compared with file parsing or database writes in the upload flow.\n"},"english":{"task":"Answer Q2 aloud in 90 seconds using \"impact → scope → evidence → mitigation → root cause → prevention\". Record it. On the second recording, replace any long technical list with one clear example (\"for example, GC pauses from large buffers\").\n","phrases":["The average looks fine, but the tail tells a different story.","Before changing anything, I want to measure…","My working hypothesis is…, and the evidence I need is…","In business terms, this means…","I don't have the numbers yet, so I would first…","The safest option right now is to roll back; then we investigate."]},"checkpoint":"Your benchmark runs in Release and shows Mean, Ratio and Allocated for both chunkers at two input sizes; a correctness test passes for the version you keep; and you can explain aloud in under 90 seconds why p99 can double while the average stays flat, naming at least three possible causes and the tool you would use for each.\n","project":{"milestone":"Add a BenchmarkDotNet project for the text chunker, a correctness test for chunk boundaries, and a 'Performance' section in the README with the measured results.","evidence":"In an interview you can say: 'Before optimising the chunker I benchmarked it with BenchmarkDotNet, reduced allocations by [X]%, kept a correctness test next to it, and checked whether chunking even mattered in the end-to-end upload time.' Show the results table."},"references":[{"title":"BenchmarkDotNet overview (official documentation)","url":"https://benchmarkdotnet.org/articles/overview.html"},{"title":"dotnet-counters diagnostic tool (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/core/diagnostics/dotnet-counters"},{"title":"dotnet-trace performance analysis utility (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/core/diagnostics/dotnet-trace"},{"title":"Fundamentals of garbage collection (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/fundamentals"},{"title":"The large object heap on Windows systems (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/large-object-heap"}],"id":"D012"},{"day":13,"type":"learn","full":true,"title":"Testing strategy: unit, integration, contract and flaky tests","objective":"Choose the right mix of unit, integration and contract tests for a .NET API, write integration tests with WebApplicationFactory, and lead a team out of flaky or missing tests.","task":"Project: write WebApplicationFactory integration tests for the upload endpoint covering the happy path, an empty file and a disallowed file type, with storage replaced by a test double.","topics":["aspnet","delivery"],"roles":["lead","architect"],"difficulty":2,"explanation":"A test strategy answers one question: **what evidence do we need before we ship, and what is the cheapest reliable way to get it?** There is no single correct pyramid. The right mix depends on where the risk is.\n\n- **Unit tests** check one piece of logic in memory: a chunker, a validation rule, a price calculation. They are fast and precise, but they cannot tell you that routing, model binding, middleware, DI registration or SQL actually work together.\n- **Integration tests** run real parts together. In ASP.NET Core, `WebApplicationFactory<Program>` starts the whole app in memory with `TestServer` and gives you an `HttpClient`. The request goes through the real pipeline: middleware, authentication, binding, filters, your endpoint, and DI. You can replace selected services with `ConfigureTestServices`.\n- **Real dependencies**: for the database, **Testcontainers** starts a real SQL Server (or PostgreSQL) in Docker for the test run. This catches SQL translation, constraint and migration problems that the EF Core in-memory provider hides — Microsoft's guidance discourages the in-memory provider for testing database behaviour. If build agents cannot run Docker (common on-premises), a dedicated test database or LocalDB is the fallback.\n- **Contract tests** check that two services agree on an API shape (for example with Pact or a shared OpenAPI check). They matter when different teams deploy independently.\n- **End-to-end UI tests** (Playwright) are valuable for a few critical journeys, but they are slow and fragile, so keep them few.\n\n```csharp\npublic class AssistantApiFactory : WebApplicationFactory<Program>\n{\n    protected override void ConfigureWebHost(IWebHostBuilder builder)\n    {\n        builder.UseEnvironment(\"Testing\");\n        builder.ConfigureTestServices(services =>\n        {\n            services.RemoveAll<IDocumentStorage>();\n            services.AddSingleton<IDocumentStorage, InMemoryDocumentStorage>();\n        });\n    }\n}\n```\n\n**Flaky tests** pass and fail without code changes. Typical causes: shared state between tests, test order dependencies, real time (`DateTime.Now`, `Task.Delay`), random data without a seed, parallel tests using the same database rows, and external services. A flaky test is worse than no test, because it teaches people to ignore red builds.\n\nGood tests check **behaviour**, not implementation. A test that breaks every time you rename a private method makes refactoring harder, which is the opposite of its purpose. A useful rule: unit tests for logic with many cases, integration tests for every endpoint's main behaviour and its important failure paths, and very few end-to-end tests.\n","questions":[{"id":"Q1","kind":"technical","question":"For an ASP.NET Core API, how do you decide what to cover with unit tests and what with integration tests? Where does WebApplicationFactory fit?","answer":"I decide by risk. I ask: where can this break, and what is the cheapest test that would catch it?\n\nUnit tests are for logic with many cases and no infrastructure. For example, a text chunker, a validation rule, or a permission calculation. They are fast, so I can test edge cases cheaply.\n\nBut many real bugs in an API are not in the logic. They are in the wiring: a wrong route, a model binding problem, middleware order, a missing DI registration, an authorization policy, or a SQL query that EF cannot translate. Unit tests with mocks do not see these. That is where I use integration tests.\n\nWebApplicationFactory starts the real application in memory and gives me an HttpClient. The request goes through the full pipeline. I can replace only the parts I need with ConfigureTestServices, for example a fake file storage. For the database, I prefer a real SQL Server in a container with Testcontainers, because the in-memory provider behaves differently.\n\nSo my default for an API is: integration tests for each endpoint's main behaviour and key error cases, plus unit tests for complex logic. The tradeoff is that integration tests are slower, so I keep them focused and share the app instance between tests.\n","deeper":"- `WebApplicationFactory<TEntryPoint>` (package `Microsoft.AspNetCore.Mvc.Testing`) uses the app's real `Program`, configuration and DI, then hosts it on `TestServer` — no network port, no Kestrel. Kestrel-specific limits are therefore not exercised.\n- With top-level statements, the test project needs access to `Program`. The classic approach is `public partial class Program { }` at the end of Program.cs (newer SDKs may generate this for you — verify against current docs).\n- Share the factory with `IClassFixture<T>` (or a collection fixture) to avoid starting the app per test; then make each test independent of data created by others.\n- Over-mocking risk: if a unit test mocks the repository, the DbContext and the HTTP client, it mostly tests the mocks. Prefer fakes at real boundaries (storage, clock, external APIs) and real code inside.\n- Alternatives: Alba (a wrapper around TestServer), contract tests between services, Playwright for UI journeys.\n- When it fails: integration tests that depend on a shared dev database, test order, or real external services become slow and flaky.\n","evaluating":"Whether you have a reasoned strategy based on risk rather than \"100% coverage\", know what WebApplicationFactory actually exercises, and understand the limits of mocks and the EF Core in-memory provider.\n","weak":["'We aim for 100% code coverage' as the whole strategy.","Mocking everything, including the database, and calling those integration tests.","Not knowing how to replace a service in WebApplicationFactory, or using the in-memory provider to test SQL behaviour."],"levelUp":"A senior developer writes good unit and integration tests. A lead or architect defines the strategy for the team — what each test level is for, which dependencies are real or faked, how long the pipeline may take — and makes it a shared standard so tests stay fast, trusted and consistent across modules.\n","followUp":{"question":"How do you test endpoints that require authentication with WebApplicationFactory?","answer":"I register a test authentication handler in ConfigureTestServices. It creates a ClaimsPrincipal from a header or fixed values, so each test can say \"this request is user A with role Analyst\". That way the real authorization policies still run, and I can write negative tests too, like \"user B cannot read user A's document\". I do not disable authorization in tests, because then the most important security rules are never tested.\n"},"qid":"D013-Q1"},{"id":"Q2","kind":"scenario","question":"Your CI pipeline fails about one run in five because of flaky tests. Developers re-run the build until it is green, and some now ignore failures. What do you do?","answer":"I treat this as a real problem, not an annoyance. When people re-run until green, the pipeline no longer protects us, and a real bug can pass as \"just flaky\".\n\nFirst, I make it visible. I collect data from the pipeline: which tests failed in the last few weeks, and how often. Usually a small number of tests cause most of the failures.\n\nSecond, I stop the damage quickly. I move the known flaky tests into a quarantine category with a ticket and an owner. The main build stays strict and trusted. Quarantine is not deletion, and it has a time limit.\n\nThird, we fix the causes. The usual ones are shared state between tests, tests depending on order, real time and Task.Delay, parallel tests writing the same database rows, and calls to real external services. The fixes are things like a fake clock, unique test data per test, resetting the database, and waiting for a condition instead of a fixed delay.\n\nFinally, I add a rule: a new flaky test is a bug with high priority, and we track the flaky rate as a team metric.\n","deeper":"- Find them: Azure DevOps test analytics and test history per test (on-prem Azure DevOps Server has test results history too), or simply re-run the suite several times on a branch and compare.\n- Common causes and fixes:\n  - Time: inject `TimeProvider` (.NET 8+) and use `FakeTimeProvider` from `Microsoft.Extensions.TimeProvider.Testing` instead of `DateTime.Now` and sleeps.\n  - Shared data: unique IDs per test, transaction rollback, or a reset tool such as Respawn between tests.\n  - Parallelism: xUnit runs test classes in parallel by default; tests sharing a database need a collection or isolated data.\n  - Async: wait for a condition with a timeout rather than `Task.Delay(500)`.\n  - External services: replace with fakes or a container; keep real-service checks as separate smoke tests
