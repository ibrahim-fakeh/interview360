<title>360-Day Interview Preparation</title>
<style>
:root{
  --dark:#3A2E12; --dark2:#2E240E; --dark3:#55431A; --primary:#6F5716; --bronze:#8B6F1F; --accent:#E0CB72;
  --cream:#F4F1E6; --tint:#EFE9D8; --tint2:#F0E6C8; --line:#E3DAC0; --ink:#2B2210; --ink2:#4C3E1C; --muted:#6B5C3A;
  --card:#FFFFFF; --ok:#2F6B3A; --okbg:#E4F0E2; --warn:#8A4B12; --warnbg:#FBEBD6; --info:#24506E; --infobg:#E2EDF5;
  --focus:#1B5FA8; --shadow:0 1px 2px rgba(58,46,18,.06),0 4px 14px rgba(58,46,18,.07);
  --radius:12px; --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Cascadia Mono","SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --cream:#17140C; --tint:#221D11; --tint2:#2A2414; --line:#3B3320; --ink:#F1EBDA; --ink2:#E2D8BE; --muted:#B9AC8A;
  --card:#1E1A0F; --primary:#D9C27A; --bronze:#C8A84E; --ok:#8FD19B; --okbg:#1C2E1F; --warn:#F2B46B; --warnbg:#33240F;
  --info:#8EC3EA; --infobg:#132433; --focus:#7DB7FF; --shadow:0 1px 2px rgba(0,0,0,.4);
;color-scheme:dark}}
:root[data-theme="dark"]{
  --cream:#17140C; --tint:#221D11; --tint2:#2A2414; --line:#3B3320; --ink:#F1EBDA; --ink2:#E2D8BE; --muted:#B9AC8A;
  --card:#1E1A0F; --primary:#D9C27A; --bronze:#C8A84E; --ok:#8FD19B; --okbg:#1C2E1F; --warn:#F2B46B; --warnbg:#33240F;
  --info:#8EC3EA; --infobg:#132433; --focus:#7DB7FF; --shadow:0 1px 2px rgba(0,0,0,.4);
;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 var(--font)}
a{color:var(--primary)} a:hover{color:var(--bronze)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-9999px;top:0;background:#fff;color:#000;padding:8px 12px;z-index:100}
.skip:focus{left:12px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:linear-gradient(100deg,var(--dark2),#3A2E12 60%,#55431A);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.top-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;color:#fff;text-decoration:none;white-space:nowrap}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--dark);display:grid;place-items:center;font-weight:800;font-size:13px}
.brand small{display:block;font-weight:400;color:#E9DDB0;font-size:12px;letter-spacing:0}
nav.main{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:thin}
nav.main a{color:#F3EBD0;text-decoration:none;padding:7px 12px;border-radius:8px;font-size:14px;white-space:nowrap}
nav.main a:hover{background:rgba(255,255,255,.1);color:#fff}
nav.main a[aria-current="page"]{background:var(--accent);color:var(--dark);font-weight:700}
.top-tools{display:flex;gap:6px;align-items:center}
.iconbtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px}
.iconbtn:hover{background:rgba(255,255,255,.2)}
main{max-width:1280px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3,h4{color:var(--ink);line-height:1.25;margin:0 0 .5em}
h1{font-size:clamp(22px,3vw,30px)} h2{font-size:21px} h3{font-size:17px} h4{font-size:15px}
p{margin:.4em 0 .8em}
.muted{color:var(--muted)} .small{font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card.tinted{background:var(--tint)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.hero{background:linear-gradient(110deg,var(--dark2),#3A2E12 55%,#55431A);color:#fff;border-radius:16px;padding:22px;margin-bottom:16px}
.hero h1,.hero h2,.hero h3{color:#fff}
.hero .kicker{color:var(--accent);text-transform:uppercase;font-size:12px;letter-spacing:1.2px;font-weight:700}
.hero p{color:#EDE3C4}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .v{font-size:28px;font-weight:800;color:var(--primary);line-height:1.1}
.stat .l{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--primary);color:#fff;border:1px solid var(--primary);border-radius:9px;padding:8px 14px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.3}
:root[data-theme="dark"] .btn{color:#17140C}
.btn:hover{filter:brightness(1.08);color:#fff}
:root[data-theme="dark"] .btn:hover{color:#17140C}
.btn.secondary{background:transparent;color:var(--primary);border-color:var(--bronze)}
.btn.secondary:hover{background:var(--tint)}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line)}
.btn.ghost:hover{background:var(--tint);color:var(--ink)}
.btn.gold{background:var(--accent);color:var(--dark);border-color:var(--accent)}
.btn.danger{background:transparent;color:#9B2C1F;border-color:#C9897F}
:root[data-theme="dark"] .btn.danger{color:#F3A196}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--tint2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.chip.full{background:var(--okbg);color:var(--ok);border-color:transparent}
.chip.road{background:var(--warnbg);color:var(--warn);border-color:transparent}
.chip.type-review,.chip.type-assessment{background:var(--infobg);color:var(--info);border-color:transparent}
.chip.type-simulation{background:#3A2E12;color:var(--accent);border-color:transparent}
.chip.done{background:var(--primary);color:#fff;border-color:transparent}
.banner{border-radius:10px;padding:12px 14px;margin:0 0 16px;border:1px solid transparent}
.banner.full{background:var(--okbg);color:var(--ok)}
.banner.road{background:var(--warnbg);color:var(--warn);border-color:#E9C89A}
.banner.info{background:var(--infobg);color:var(--info)}
.bar{height:10px;background:var(--tint);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--bronze),var(--accent))}
label{font-weight:600;font-size:14px;color:var(--ink2)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid #CDBF98;border-radius:8px;padding:7px 10px}
textarea{width:100%;min-height:120px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:140px;flex:1}
.filters{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.daylist{list-style:none;margin:0;padding:0}
.daylist li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line)}
.daylist li:hover{background:var(--tint)}
.daylist .dn{font-weight:800;color:var(--primary);min-width:54px;font-variant-numeric:tabular-nums}
.daylist .dt{font-size:12.5px;color:var(--muted)}
.daylist a.t{color:var(--ink);text-decoration:none;font-weight:600}
.daylist a.t:hover{text-decoration:underline}
.daylist .chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.weekhead{background:var(--tint2);font-weight:700;color:var(--ink2);padding:6px 10px;font-size:13.5px;border-bottom:1px solid var(--line)}
.phasehead{margin:22px 0 6px}
.yearmap{display:grid;grid-template-columns:110px repeat(30,1fr);gap:3px;align-items:center}
.yearmap .pl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{aspect-ratio:1;border-radius:3px;background:var(--tint);border:1px solid var(--line);display:block;min-width:6px}
.cell.full{background:#E8DDB8} .cell.rev{background:#D6E4EE}
:root[data-theme="dark"] .cell.full{background:#4A3F22} :root[data-theme="dark"] .cell.rev{background:#20364A}
.cell.done{background:var(--bronze);border-color:var(--bronze)}
.cell.today{outline:2px solid var(--focus);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.q{border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0;background:var(--card)}
.q .qhead{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.q .qtext{font-size:17px;font-weight:700;color:var(--ink)}
.reveal{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.reveal[hidden]{display:none}
.sect{margin:14px 0}
.sect h4{color:var(--primary);text-transform:uppercase;font-size:12.5px;letter-spacing:.8px;margin-bottom:4px}
.levelup{background:var(--tint);border-radius:10px;padding:10px 12px}
.answer-box{background:var(--tint2);border-left:4px solid var(--bronze);border-radius:6px;padding:10px 14px}
pre{max-width:100%;background:#1F1A0E;color:#F4ECD3;padding:12px 14px;border-radius:8px;overflow-x:auto;font:13.5px/1.5 var(--mono)}
code{font-family:var(--mono);font-size:.92em;background:var(--tint);padding:1px 5px;border-radius:4px}
pre code{background:none;padding:0;color:inherit}
ul,ol{padding-left:22px;margin:.3em 0 .8em}
li{margin:.15em 0}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;font-size:14.5px;vertical-align:top}
th{background:var(--tint);color:var(--ink2)}
.timer{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--primary);letter-spacing:1px}
.timer.over{color:#B3261E}
.rubric td{min-width:90px}
.rubric input{margin-right:4px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:90;font-size:14px;max-width:90vw}
.toast[hidden]{display:none}
.kbd{font-family:var(--mono);background:var(--tint);border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:13px}
.diag td{text-align:center} .diag td:first-child,.diag td:nth-child(2){text-align:left}
.prompt{font-family:var(--mono);font-size:12.5px;min-height:260px}
.weekstrip{display:flex;gap:6px;flex-wrap:wrap}
.weekstrip a{padding:4px 10px;border-radius:8px;border:1px solid var(--line);text-decoration:none;color:var(--ink2);font-size:13px;background:var(--card)}
.weekstrip a[aria-current="page"]{background:var(--primary);color:#fff;border-color:var(--primary)}
.weekstrip a.done{border-color:var(--bronze);background:var(--tint2)}
.weekstrip a[aria-current="page"]{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700}
:root[data-theme="dark"] .weekstrip a[aria-current="page"]{color:#17140C}
.hero .btn.ghost{color:#F3EBD0;border-color:rgba(224,203,114,.6)}
.hero .btn.ghost:hover{background:rgba(255,255,255,.12);color:#fff}
.empty{padding:30px;text-align:center;color:var(--muted)}
nav.tabbar{display:none}
.morelist{list-style:none;margin:0;padding:0}
.morelist li a,.morelist li button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:16px;text-decoration:none;cursor:pointer;text-align:left}
.morelist li span.sub{display:block;font-size:13px;color:var(--muted)}
.install{border:1px dashed var(--bronze)}
.hide{display:none!important}
.card,.q,.reveal,.sect,.md,.answer-box,.levelup{min-width:0;max-width:100%}
.md p,.md li,.qtext{overflow-wrap:anywhere}
@media (max-width:720px){
  .daylist li{grid-template-columns:auto 1fr}
  .daylist .chips{grid-column:1/-1;justify-content:flex-start}
  .yearmap{grid-template-columns:repeat(30,1fr)} .yearmap .pl{grid-column:1/-1}
  .timer{font-size:36px}
  nav.main{display:none}
  .top-tools .iconbtn{padding:5px 9px}
  nav.tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--dark);border-top:1px solid #55431A;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  nav.tabbar a{display:flex;flex-direction:column;align-items:center;gap:1px;color:#E9DDB0;text-decoration:none;font-size:11px;padding:5px 0;border-radius:10px;min-height:48px;justify-content:center}
  nav.tabbar a .ti{font-size:19px;line-height:1}
  nav.tabbar a[aria-current="page"]{color:var(--dark);background:var(--accent);font-weight:700}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .btn{min-height:40px}
  .hero{padding:18px}
  .top-inner{gap:8px;flex-wrap:nowrap;justify-content:space-between}
}
@media print{
  nav.tabbar,header.top,.noprint,.toast,.skip,nav,.btn,button{display:none!important}
  body{background:#fff;color:#000;font-size:11.5pt}
  main{max-width:none;padding:0}
  .card,.q{box-shadow:none;break-inside:avoid-page;border-color:#bbb}
  .reveal[hidden]{display:block!important}
  .reveal{border-top:1px dashed #999}
  pre{background:#f3f3f3;color:#000;white-space:pre-wrap}
  a{color:#000;text-decoration:underline}
  .hero{background:#fff!important;color:#000;border:1px solid #bbb}
  .hero h1,.hero h2,.hero p{color:#000!important}
}
</style>
</head>

<script id="curriculum" type="application/json">{"format":"360-day-prep-content","schemaVersion":1,"contentVersion":"2026-10-10.b1","title":"360-Day .NET Lead, Architect & Agentic AI Interview Preparation","generatedThrough":14,"phases":[{"id":"P01","number":1,"title":"Diagnostic and advanced C# / .NET runtime","days":[1,30],"goals":["Establish a baseline with a short diagnostic and a personal gap profile.","Explain async/await, cancellation, concurrency, DI lifetimes, GC and memory with confidence and precision.","Diagnose runtime problems (deadlocks, leaks, races, slow code) with real tools instead of guessing.","Build a clear 60–90 second spoken answer structure that you can reuse in every interview."],"prerequisites":["Working C# and ASP.NET experience (you have this).",".NET 10 SDK installed (current LTS), Visual Studio or Rider, SQL Server Developer or LocalDB, Git."],"weeklyFocus":[{"days":"1–7","focus":"Diagnostic, answer framework, async/await, cancellation, streaming, concurrency, project kickoff."},{"days":"8–14","focus":"DI lifetimes, GC and memory, LINQ and collections, exceptions, profiling, testing strategy."},{"days":"15–21","focus":"Modern C# features in practice, generics and nullability, records, pattern matching, source generators, Span and pooling."},{"days":"22–30","focus":"Channels and background pipelines, structured logging foundations, legacy .NET Framework modernization paths, first monthly assessment."}],"milestone":"Solution skeleton for the Research and Benchmarking Assistant: document upload endpoint, in-process ingestion queue (Channel), correct DI lifetimes, global error handling, first integration tests, and ADR-001 (solution structure).","evidence":"You can say: 'I designed the solution structure, wrote the first ADR, and built an upload pipeline with cancellation and back-pressure.' Show the repo, the ADR and the tests.","competencies":["Precise runtime knowledge (senior baseline).","Troubleshooting narrative (symptom → hypothesis → evidence → fix → prevention).","Setting team standards for async and error handling."],"completion":["Diagnostic completed and gap profile saved.","Can answer 8 of 10 random Phase 1 questions aloud in under 90 seconds each with a clear structure.","Repo has upload endpoint, Channel-based worker, 5+ passing integration tests, ADR-001.","Monthly assessment score of 3/4 or higher on at least 4 of 5 rubric dimensions."]},{"id":"P02","number":2,"title":"ASP.NET Core in production","days":[31,60],"goals":["Design APIs that are secure, observable, resilient and easy to operate.","Master middleware, validation, authentication (OIDC/JWT), policy-based authorization, rate limiting, caching, health checks.","Run background processing safely (hosted services, queues) and troubleshoot production APIs."],"prerequisites":["Phase 1 runtime concepts, especially async, cancellation and DI lifetimes."],"weeklyFocus":[{"days":"31–37","focus":"Request pipeline, middleware order, minimal APIs vs controllers, API versioning, ProblemDetails."},{"days":"38–44","focus":"Validation, authentication with OIDC/JWT, Entra ID concepts, policy and resource-based authorization."},{"days":"45–51","focus":"Background services, output and distributed caching, HybridCache, rate limiting, health checks."},{"days":"52–60","focus":"OpenTelemetry logs/metrics/traces, production troubleshooting on IIS and Kestrel, assessment."}],"milestone":"Authenticated API with role and document-level authorization stubs, background ingestion worker, rate limiting on expensive endpoints, health checks, OpenTelemetry tracing.","evidence":"A traced request from upload to processed document, with a dashboard screenshot and a short incident-style write-up of one bug you found.","competencies":["API design judgement.","Security-by-default thinking.","Operability — logs, metrics, traces, health."],"completion":["Can draw the ASP.NET Core request pipeline from memory and explain order-sensitive middleware.","Authorization policies covered by tests, including a negative test for cross-user document access.","One end-to-end trace captured and explained aloud in 90 seconds.","Monthly assessment ≥ 3/4 on 4 of 5 dimensions."]},{"id":"P03","number":3,"title":"Data: EF Core and SQL Server performance","days":[61,90],"goals":["Model data for correctness and performance; know when EF Core helps and when to drop to SQL.","Read execution plans, design indexes, fix N+1 queries, paginate correctly, handle concurrency.","Plan safe schema migrations for zero or low downtime, including legacy NHibernate/EF6 coexistence."],"prerequisites":["Phase 2 API and background-processing skeleton."],"weeklyFocus":[{"days":"61–67","focus":"Tracking vs no-tracking, change tracker cost, projections, split queries, N+1 detection."},{"days":"68–74","focus":"Indexes, execution plans, parameter sniffing, statistics, keyset pagination."},{"days":"75–81","focus":"Transactions, isolation levels, optimistic concurrency with rowversion, deadlocks."},{"days":"82–90","focus":"Migrations strategy (expand/contract), bulk operations, legacy ORM coexistence, assessment."}],"milestone":"Data model for documents, chunks, permissions and audit; rowversion concurrency; keyset pagination; migration scripts reviewed; a before/after performance note with execution plans.","evidence":"A one-page performance investigation: query, plan, index change, measured result. This is a strong interview story.","competencies":["Data-access judgement and performance troubleshooting.","Safe change management for databases."],"completion":["Explain an execution plan aloud — seeks vs scans, key lookups, estimated vs actual rows.","Demonstrate an N+1 fix with measured query count before/after.","Expand/contract migration plan written for one breaking change.","Monthly assessment ≥ 3/4 on 4 of 5 dimensions."]},{"id":"P04","number":4,"title":"Software architecture foundations","days":[91,120],"goals":["Turn requirements into quality attributes and architecture decisions.","Apply SOLID and patterns with judgement, not as rules; know when they hurt.","Design a modular monolith with bounded contexts; write ADRs and C4 diagrams.","Explain the difference between a senior developer answer and an architect answer."],"prerequisites":["Phases 1–3. Comfortable with the project's current code."],"weeklyFocus":[{"days":"91–97","focus":"Requirements, quality attributes, utility trees, constraints, architecture styles overview."},{"days":"98–104","focus":"SOLID with judgement, key design patterns, coupling and cohesion, dependency direction."},{"days":"105–111","focus":"DDD strategic design: bounded contexts, context maps, aggregates, domain events."},{"days":"112–120","focus":"Modular monolith, C4 diagrams, ADRs, architecture reviews, assessment."}],"milestone":"Refactor the project into a modular monolith (Documents, Search, Research, Identity modules) with enforced boundaries (architecture tests), C4 context and container diagrams, ADR-002 to ADR-004.","evidence":"Diagrams plus ADRs you can walk through in 5 minutes: context, decision, alternatives, consequences.","competencies":["Architecture reasoning from quality attributes.","Written and visual architecture communication."],"completion":["Produce a utility tree with 6+ prioritized quality-attribute scenarios.","Architecture tests fail when a module boundary is violated.","Explain why the system is not (yet) microservices, in 90 seconds.","Monthly assessment ≥ 3/4 on 4 of 5 dimensions."]},{"id":"P05","number":5,"title":"Distributed systems and integration","days":[121,150],"goals":["Design reliable messaging — idempotency, retries, timeouts, circuit breakers, outbox, sagas.","Choose between REST, gRPC and messaging; understand API gateways and consistency models.","Use CQRS and event sourcing only where they pay off; scale with caching and partitioning."],"prerequisites":["Phase 4 module boundaries and domain events."],"weeklyFocus":[{"days":"121–127","focus":"Failure modes, timeouts, retries with jitter, circuit breakers (Polly / Microsoft.Extensions.Http.Resilience)."},{"days":"128–134","focus":"Messaging semantics, at-least-once delivery, idempotent consumers, transactional outbox."},{"days":"135–141","focus":"Sagas and process managers, consistency, CQRS, event sourcing tradeoffs."},{"days":"142–150","focus":"REST vs gRPC, API gateway/BFF, caching and scalability, capacity estimation, assessment."}],"milestone":"Ingestion pipeline moved to a message queue with transactional outbox, idempotent consumers, dead-letter handling and resilience policies on external calls; capacity estimate for 1M documents.","evidence":"A failure-injection demo: kill the worker mid-processing and show no lost or duplicated documents.","competencies":["Distributed systems reasoning.","Capacity estimation and scalability tradeoffs."],"completion":["Explain outbox + idempotent consumer with a diagram in under 2 minutes.","Failure-injection test passes.","Capacity estimate written with assumptions stated.","Monthly assessment ≥ 3/4 on 4 of 5 dimensions."]},{"id":"P06","number":6,"title":"Technical leadership and people","days":[151,180],"goals":["Lead through delegation, mentoring, code review and standards, not control.","Handle conflict, underperformance, disagreement with managers and hiring decisions.","Build a library of honest STAR stories from your own experience."],"prerequisites":["Your real work history — list 10–15 situations (incidents, conflicts, deliveries, decisions) before Day 151."],"weeklyFocus":[{"days":"151–157","focus":"Role of a tech lead, delegation levels, leading without micromanaging, STAR story bank."},{"days":"158–164","focus":"Code review culture, engineering standards, technical debt management."},{"days":"165–171","focus":"Conflict resolution, underperformance, feedback conversations, disagreeing with managers."},{"days":"172–180","focus":"Hiring, onboarding, production incidents and blameless reviews, assessment."}],"milestone":"Engineering handbook for the project: PR template, review checklist, Definition of Done, coding standards, onboarding guide, incident template; plus 12 STAR stories drafted from your real experience.","evidence":"The handbook is a concrete artifact you can show; the STAR bank is your behavioral interview preparation.","competencies":["Leadership judgement and people skills.","Behavioral interview storytelling."],"completion":["12 STAR stories written, each told aloud in under 2 minutes.","Handbook reviewed against a checklist.","Mock behavioral interview ≥ 3/4 on ownership, clarity and reflection.","Monthly assessment ≥ 3/4 on 4 of 5 dimensions."]},{"id":"P07","number":7,"title":"Delivery, Agile and Azure DevOps","days":[181,210],"goals":["Run Scrum or Kanban pragmatically; refine, estimate, plan and report honestly.","Manage risks, dependencies and scope change with stakeholders.","Use delivery metrics wisely (DORA, flow metrics) and know their limits.","Set up branch policies, PR workflow, CI/CD and self-hosted agents in Azure DevOps."],"prerequisites":["Phase 6 handbook (DoD, PR template)."],"weeklyFocus":[{"days":"181–187","focus":"Scrum vs Kanban, backlog refinement, acceptance criteria, Definition of Done."},{"days":"188–194","focus":"Estimation, sprint and release planning, dependencies, risk registers."},{"days":"195–201","focus":"Stakeholder reporting, scope changes, delivery metrics and their limits, retrospectives."},{"days":"202–210","focus":"Azure DevOps boards, branch policies, YAML pipelines, self-hosted agents, release strategies, assessment."}],"milestone":"Azure DevOps project for the assistant: backlog with epics/features/stories, acceptance criteria, branch policies, YAML CI pipeline with tests, CD to a staging environment, release plan.","evidence":"Pipeline run history and a one-page release plan with risks: shows you can deliver, not just design.","competencies":["Delivery leadership and stakeholder management.","DevOps practice."],"completion":["CI pipeline blocks merge on failing tests via branch policy.","Release plan with 5+ risks and mitigations.","Explain two delivery metrics and how each can be gamed.","Monthly assessment (combined with weekly review) ≥ 3/4 on 4 of 5 dimensions."]},{"id":"P08","number":8,"title":"Azure cloud architecture and hybrid","days":[211,240],"goals":["Choose Azure hosting (App Service, Functions, Container Apps, AKS) with clear justification.","Design data, messaging, identity and secrets (Azure SQL, Storage, Service Bus, Key Vault, managed identities).","Design networking, monitoring, availability, backup/DR and cost management.","Provide an on-premises or hybrid alternative for government constraints."],"prerequisites":["Phase 5 messaging design; Phase 7 pipelines."],"weeklyFocus":[{"days":"211–217","focus":"Hosting choices, App Service, Functions, Container Apps, when AKS is justified."},{"days":"218–224","focus":"Azure SQL, Storage, Service Bus, Key Vault, managed identities, Entra ID."},{"days":"225–231","focus":"Networking (VNet, private endpoints), monitoring (Azure Monitor, App Insights), availability, backups, DR."},{"days":"232–240","focus":"Bicep IaC, deployment strategies and rollback, cost management, hybrid/on-prem alternative, assessment."}],"milestone":"Azure reference architecture for the assistant (diagram + Bicep for core resources), managed identities instead of secrets, DR plan with RTO/RPO, cost estimate, and an on-premises alternative (IIS/Windows services/SQL Server/RabbitMQ or similar).","evidence":"Two architectures for the same system with a comparison table: the exact discussion government interviewers expect.","competencies":["Cloud architecture and cost judgement.","Hybrid and on-premises pragmatism."],"completion":["Bicep deploys core resources to a dev subscription (or validates with what-if if no subscription).","DR plan states RTO/RPO and how they are tested.","Cost estimate with 3 cost-reduction options.","Monthly assessment ≥ 3/4 on 4 of 5 dimensions."]},{"id":"P09","number":9,"title":"LLM fundamentals and RAG","days":[241,270],"goals":["Understand tokens, context windows, sampling, structured outputs and tool calling well enough to design with them.","Build a RAG pipeline — parsing, chunking, embeddings, metadata, vector and hybrid search, reranking, citations.","Enforce document-level permissions in retrieval, not only in the UI."],"prerequisites":["Phases 1–5 project (ingestion pipeline, permissions model)."],"weeklyFocus":[{"days":"241–247","focus":"LLM fundamentals, tokens and cost, structured outputs, Microsoft.Extensions.AI abstractions in .NET."},{"days":"248–254","focus":"Document parsing, chunking strategies, embeddings, metadata design."},{"days":"255–261","focus":"Vector search, hybrid search, reranking, permission-trimmed retrieval."},{"days":"262–270","focus":"Grounded answers with citations, streaming, first retrieval evaluation set, assessment."}],"milestone":"RAG search with cited answers over uploaded reports, permission-filtered retrieval, streaming responses with cancellation, and a 30-question retrieval evaluation set.","evidence":"Show a cited answer, then show the same question as a user without access returning no leaked content. Show recall@k numbers.","competencies":["AI system design grounded in engineering fundamentals.","Knowing when RAG is and is not the right tool."],"completion":["Retrieval eval set with recall@5 measured and recorded.","Permission leak test passes.","Explain chunking and hybrid search tradeoffs in 90 seconds each.","Monthly assessment ≥ 3/4 on 4 of 5 dimensions."]},{"id":"P10","number":10,"title":"Agentic AI: workflows, agents and control","days":[271,300],"goals":["Decide between deterministic workflows, single agents and multi-agent designs.","Implement controlled tools, state, memory, durable execution, human approval and recovery.","Defend against prompt injection, data leakage and excessive tool permissions."],"prerequisites":["Phase 9 RAG pipeline."],"weeklyFocus":[{"days":"271–277","focus":"Workflows vs agents, tool calling design, tool permissions and schemas."},{"days":"278–284","focus":"State, memory, durable execution, checkpoints, human-in-the-loop approval."},{"days":"285–291","focus":"Single vs multi-agent, orchestration patterns, Microsoft Agent Framework in .NET."},{"days":"292–300","focus":"Prompt injection, data leakage, tenant isolation, auditability, recovery, assessment."}],"milestone":"Research workflow: plan → retrieve → compare benchmarks → draft report, with allow-listed tools, a human approval step before publishing, resumable state after crash, and a full audit trail.","evidence":"Demo the approval gate and a crash/resume. Explain why you chose a workflow (or agent) for each step.","competencies":["Agentic system design with safety and control.","Explaining AI risk to non-technical stakeholders."],"completion":["Workflow resumes correctly after a forced crash.","Injection test document does not trigger an unauthorized tool call.","Written decision record — workflow vs agent for each step.","Monthly assessment ≥ 3/4 on 4 of 5 dimensions."]},{"id":"P11","number":11,"title":"AI in production and architecture synthesis","days":[301,330],"goals":["Evaluate answer quality and prevent regressions; observe latency, cost and failures.","Choose models, caching and cloud vs self-hosted deployment with clear tradeoffs.","Complete security architecture, threat model, DR and executive communication for the whole system."],"prerequisites":["Phases 8–10."],"weeklyFocus":[{"days":"301–307","focus":"Evaluation datasets, LLM-as-judge limits, regression testing in CI."},{"days":"308–314","focus":"AI observability, latency, cost tracking, caching, model selection, self-hosted vs cloud."},{"days":"315–321","focus":"Security architecture and threat modeling (STRIDE) for the whole system, audit logs."},{"days":"322–330","focus":"Modernization strategy, executive communication, architecture portfolio pack, assessment."}],"milestone":"Evaluation harness in CI, per-request cost and latency dashboard, audit log review, STRIDE threat model, and a 10-slide architecture pack for executives.","evidence":"The architecture pack is your portfolio for architect interviews: decisions, numbers and risks in one place.","competencies":["Production AI operations.","Executive-level architecture communication."],"completion":["CI fails when answer-quality score drops below threshold.","Cost per answer measured and reported.","Threat model with 10+ threats and mitigations.","Monthly assessment ≥ 3/4 on 4 of 5 dimensions."]},{"id":"P12","number":12,"title":"Intensive interview simulation","days":[331,360],"goals":["Perform under realistic interview conditions for tech lead, architect and AI architect roles.","Close the remaining gaps found in assessments.","Tell your project and career story clearly and honestly."],"prerequisites":["All previous phases; STAR bank; architecture pack."],"weeklyFocus":[{"days":"331–337","focus":"Full technical loops: .NET deep dive, debugging, code review interview."},{"days":"338–344","focus":"System design loops: classic and AI systems, whiteboard timing."},{"days":"345–351","focus":"Leadership and delivery loops, hiring-manager and executive interviews."},{"days":"352–360","focus":"Full-day simulations, salary/offer conversations prep, final assessment and maintenance plan."}],"milestone":"Portfolio ready: repo, ADRs, diagrams, eval results, handbook, architecture pack, and a 3-minute project walkthrough.","evidence":"You can present the full project in 3, 10 and 30 minute versions.","competencies":["Interview performance under time pressure.","Confident, simple spoken English for technical judgement."],"completion":["Three full mock loops completed with average rubric ≥ 3.2/4.","Every weak area from assessments has a recorded re-test ≥ 3/4.","3/10/30-minute project walkthroughs recorded."]}],"days":[{"day":1,"type":"learn","full":true,"title":"Diagnostic and the 90-second answer framework","objective":"Measure your starting level across all seven tracks and learn one reusable structure for clear 60–90 second spoken answers.","task":"Complete the 21-item diagnostic below, answer the three questions aloud using the framework, and save your two weakest tracks in Notes.","topics":["english","csharp","leadership"],"roles":["lead","architect","ai"],"difficulty":1,"diagnostic":[{"area":"C# and .NET","item":"I can explain how async/await, the thread pool and cancellation work, and diagnose a deadlock or thread-pool starvation."},{"area":"C# and .NET","item":"I can choose correct DI lifetimes and explain GC generations, memory leaks and how I would find them with tools."},{"area":"C# and .NET","item":"I can find and fix EF Core / SQL performance problems using execution plans, indexes and query counts."},{"area":"Architecture","item":"I can turn vague requirements into quality attributes (performance, availability, security…) and explain tradeoffs."},{"area":"Architecture","item":"I can explain when a modular monolith is better than microservices, and what bounded contexts are."},{"area":"Architecture","item":"I can design reliable messaging with retries, idempotency and the outbox pattern, and draw it on a whiteboard."},{"area":"Leadership","item":"I have clear, honest STAR stories ready about conflict, an incident, a hard deadline and mentoring."},{"area":"Leadership","item":"I can describe how I delegate, review code and handle underperformance without micromanaging."},{"area":"Leadership","item":"I can disagree with a manager or stakeholder respectfully and explain how the decision was made."},{"area":"Delivery and Agile","item":"I can explain how I estimate, plan a release, manage risks and handle scope changes with stakeholders."},{"area":"Delivery and Agile","item":"I know useful delivery metrics (e.g. DORA, cycle time) and how each one can be misused."},{"area":"Delivery and Agile","item":"I can set up branch policies, PR rules and YAML CI/CD pipelines with self-hosted agents in Azure DevOps."},{"area":"Azure and DevOps","item":"I can choose between App Service, Functions, Container Apps and AKS and justify the choice."},{"area":"Azure and DevOps","item":"I can design identity and secrets with Entra ID, managed identities and Key Vault, plus private networking."},{"area":"Azure and DevOps","item":"I can define RTO/RPO, backups, monitoring and cost controls, and an on-premises alternative."},{"area":"Agentic AI and RAG","item":"I can explain tokens, context windows, structured outputs and tool calling, and their cost/latency effects."},{"area":"Agentic AI and RAG","item":"I can design a RAG pipeline (chunking, embeddings, hybrid search, reranking, citations, permissions) and evaluate it."},{"area":"Agentic AI and RAG","item":"I can explain when to use a workflow vs an agent, and how to secure tools against prompt injection."},{"area":"Spoken English","item":"I can answer a technical question aloud in 60–90 seconds without long pauses or restarting sentences."},{"area":"Spoken English","item":"I have ready phrases for explaining tradeoffs, asking for clarification and saying 'I don't know' professionally."},{"area":"Spoken English","item":"I can summarise a technical decision for a non-technical manager in three sentences."}],"explanation":"Today has two goals: find your gaps, and learn the structure you will use for every answer this year.\n\n**The diagnostic.** Rate each statement honestly: 0 = cannot do it, 1 = partly, 2 = mostly, 3 = confidently, in an interview. The workbook saves your scores and shows a gap profile on the Dashboard. Retake it at Day 180 and Day 330 to see progress. Low scores are useful — they tell you where to spend extra review time.\n\n**The 90-second answer framework (PREP-T).** Interviewers for lead and architect roles listen for *judgement*, not only knowledge. A simple structure helps you speak clearly even when the words come slowly:\n\n1. **Point** — answer the question directly in one sentence.\n2. **Reason / How** — explain how it works or what you would do, in 2–4 short steps.\n3. **Example** — a short concrete example from a system you know (never invented).\n4. **Tradeoff** — when this approach fails or what the alternative is.\n5. **Close** — one sentence: your recommendation or what you would check next.\n\nShort sentences are a strength, not a weakness. \"First… Then… The risk is… So I would…\" sounds senior and calm.\n\n**Senior vs lead vs architect.** The same question can be answered at three levels:\n\n- A **senior developer** explains *how* to solve the technical problem correctly.\n- A **tech lead** adds *people and delivery*: how the team avoids the problem, standards, communication, risk.\n- An **architect** adds *system and business*: quality attributes, cost, long-term consequences, alternatives considered, and how the decision is recorded.\n\nEvery question in this workbook shows the difference in a \"Senior vs Lead/Architect\" note.\n\n**For behavioral questions**, use STAR (Situation, Task, Action, Result) plus a final **L** for Learning. Only use real stories from your own work. This workbook gives templates with [placeholders] — fill them with your facts.\n","questions":[{"id":"Q1","kind":"technical","question":"Walk me through what happens when an HTTP request reaches an ASP.NET Core API, from the server to the database and back.","answer":"Sure. The request first reaches the server — Kestrel, sometimes behind IIS or a reverse proxy, which can handle TLS and forwarding.\n\nKestrel creates an HttpContext and passes it through the middleware pipeline. Order matters here: exception handling first, then things like HTTPS redirection, routing, authentication, authorization, rate limiting, and finally the endpoint.\n\nRouting selects the endpoint, for example a controller action or a minimal API handler. Model binding reads the route, query and body, and validation runs.\n\nThe handler gets its services from dependency injection, usually scoped per request — for example a DbContext. It calls the database asynchronously, so the thread is released while SQL Server works.\n\nThe result is serialized to JSON and goes back through the middleware in reverse order, so logging and exception handling can see the response.\n\nIf I am troubleshooting, I would follow the same path with tracing — to see where the time goes: middleware, database, or an external call.\n","deeper":"- IIS can host ASP.NET Core in-process (inside w3wp, fastest on IIS) or out-of-process (IIS as reverse proxy to Kestrel). This matters in government on-prem environments.\n- Middleware order is a common source of bugs: authentication must run before authorization; exception handling must be early to catch everything; CORS and static files have specific positions.\n- Scoped services live for one request. Capturing them in singletons causes bugs (Day 8).\n- Tradeoff for minimal APIs vs controllers: minimal APIs are lighter and fast to write; controllers give filters and conventions that large teams sometimes prefer. Both run on the same routing and endpoint system.\n- The trace view (OpenTelemetry) is how a lead turns this knowledge into faster incident resolution.\n","evaluating":"This is a baseline question. The interviewer checks if your mental model is complete and ordered, and whether you connect it to troubleshooting rather than reciting a list.\n","weak":["Jumping straight to the controller and ignoring the server and middleware.","Saying the order of middleware does not matter.","Long, unstructured answer with no ending."],"levelUp":"A senior developer describes the pipeline correctly. A lead/architect also says where things typically go wrong (middleware order, blocking calls, scoped services), how they would observe it (tracing, metrics), and which hosting choice (IIS in-process, containers) fits the environment.\n","followUp":{"question":"Where would you put a global exception handler in the pipeline, and why?","answer":"Very early — one of the first middleware components. The pipeline works like nested layers: a middleware can only catch exceptions from components that run after it. If I put it early, it catches errors from routing, authentication and the endpoint. In .NET 8 and later I use UseExceptionHandler with an IExceptionHandler implementation and return ProblemDetails, so clients get a consistent error format and we log the error once with a trace ID.\n"},"qid":"D001-Q1"},{"id":"Q2","kind":"scenario","question":"A page in a production system was fast last month, and now users say it is very slow. How do you investigate?","answer":"First I would clarify the problem: which page, since when, for all users or some, and how slow. \"Slow\" can mean many things, so I want numbers — for example, p95 went from 1 second to 8 seconds.\n\nThen I check what changed around that time: a deployment, a data growth, a configuration change, or a change in another system we call.\n\nNext I look for evidence instead of guessing. I check monitoring or logs for the request duration, and I try to find where the time is spent: application code, database, or an external service. If it is the database, I look at the slow query and its execution plan — maybe the data grew and an index is missing, or the plan changed.\n\nWhen I find the cause, I fix it with the smallest safe change, measure again, and confirm with users.\n\nFinally I think about prevention: an alert on latency, or a performance test for this page, so we see it before users do.\n","deeper":"- Structure: clarify → timeline of changes → measure → isolate the layer → hypothesis → test → fix → verify → prevent. This structure is reusable for almost every troubleshooting question.\n- Common causes: data growth without indexes, parameter sniffing, N+1 queries after a code change, a slow external dependency without timeouts, thread-pool starvation, memory pressure and GC.\n- Tradeoff: a quick fix (add an index, add a cache) may solve today's symptom but hide the cause. Caching can also introduce stale data. Always measure after the change.\n- In environments without APM tools (common on-prem), use IIS logs (time-taken field), SQL Server Query Store, and dotnet-counters.\n","evaluating":"A systematic approach, data-driven thinking, and communication with users. They want to see that you do not jump to a solution.\n","weak":["'I would add caching' as the first answer.","Not asking any clarifying question.","No verification after the fix, no prevention."],"levelUp":"A senior developer finds the slow query. A lead also manages communication with users and stakeholders during the investigation and adds monitoring so the team detects regressions. An architect asks whether this is a symptom of a bigger design issue — like a reporting workload on the transactional database — and proposes a structural fix with its cost.\n","followUp":{"question":"What if you cannot reproduce the problem in the test environment?","answer":"That is common, because production has different data volume and traffic. I would collect evidence in production safely: logs with timings, Query Store in SQL Server, and if needed a short trace or memory dump. I would also try to reproduce with a copy of production-sized data, anonymised if it is sensitive. And I would be honest with stakeholders about what we know and what we are still testing.\n"},"qid":"D001-Q2"},{"id":"Q3","kind":"leadership","question":"Tell me about yourself, and why you want to move into a team lead or architect role.","answer":"**Example answer — adapt to your real experience.**\n\nI'm a senior .NET developer and software architect with [number] years of experience, mostly in enterprise and government systems. I've worked across the full stack — C#, ASP.NET Core and older .NET Framework applications, Angular, and SQL Server — and a lot of integration work between systems.\n\nIn my current role at [organization], I [one concrete responsibility, e.g. design the architecture for X system / lead the migration of Y]. One thing I'm proud of is [one real, specific result — with a number if you have one].\n\nOver time I noticed that the problems I enjoy most are not only technical. They are about helping the team make good decisions, keeping quality high under deadlines, and explaining technical choices to managers.\n\nThat's why I want to move into a [lead / architect] role. I want to have a bigger impact through the team and the system design, not only through my own code. Recently I've also been building practical experience with AI and RAG systems in .NET, because I see many organizations need someone who can use AI safely and pragmatically.\n","deeper":"- Structure: present (who you are) → past (evidence, 1–2 highlights) → future (why this role, why now). Keep it under 90 seconds.\n- Pick highlights that match the job: for a lead role, team and delivery examples; for an architect role, design decisions and tradeoffs; for an AI role, your project work.\n- Avoid reading your CV. The interviewer has it. Give them the story and the motivation.\n- Honesty matters: never claim a title, team size or result you did not have. If your lead experience is informal, say so — \"I often acted as the technical lead for…\" is honest and still strong.\n","evaluating":"Clarity, self-awareness, motivation that fits the role, and whether you can communicate concisely. It also sets the topics for later questions, so choose highlights you are happy to discuss in depth.\n","weak":["Repeating the CV line by line for five minutes.","Only technical skills, no motivation for leadership.","Vague claims with no example ('I'm a hard worker and team player')."],"levelUp":"A senior developer lists skills and projects. A strong lead/architect candidate shows impact through others and through decisions, and links their motivation to the organization's needs.\n","followUp":{"question":"What is your biggest weakness as a future team lead?","answer":"**Example answer — adapt to your real experience.** Choose a real weakness that is not critical for the role, and show what you are doing about it. For example: \"Sometimes I take a difficult task myself instead of delegating it, because it feels faster. I've learned this doesn't scale and it limits the team's growth. Now I [real action — e.g. pair with a developer on hard tasks, agree checkpoints instead of doing it myself].\"\n"},"qid":"D001-Q3"}],"exercise":{"title":"Diagnostic + story inventory","minutes":25,"body":"1. Complete the diagnostic on this page (about 8 minutes). Be honest — nobody else sees it.\n2. Write down your two lowest-scoring tracks in Notes, with one sentence on why.\n3. Start a story inventory: list 10 real situations from your career with one line each — an incident, a deadline, a conflict, a design decision, a mentoring moment, a failure, a migration, a stakeholder disagreement, an integration problem, a quality improvement. You will turn these into STAR stories later (Phase 6).\n4. Draft your own \"Tell me about yourself\" using the template in Q3 with your real facts.\n"},"english":{"task":"Record yourself answering Q1 and Q3 aloud. Time each answer. Target 60–90 seconds. Listen once and count how many times you restarted a sentence. Record again using the PREP-T structure and the phrases below.\n","phrases":["Let me answer that in three parts.","The short answer is… The reason is…","Just to make sure I understand — do you mean…?","The tradeoff here is…","To summarise, I would…"]},"checkpoint":"Diagnostic saved (all 21 items rated) and your \"Tell me about yourself\" answer recorded in under 90 seconds using real facts only.\n","project":{"milestone":"Create a private Git repository named ResearchAssistant with a README that states the project goal and your two weakest tracks as learning goals.","evidence":"Shows from Day 1 that the project is planned deliberately — useful when you later walk an interviewer through your repository history."},"references":[{"title":"ASP.NET Core fundamentals overview (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/aspnet/core/fundamentals/"},{"title":"ASP.NET Core middleware (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/aspnet/core/fundamentals/middleware/"},{"title":".NET support policy","url":"https://dotnet.microsoft.com/en-us/platform/support/policy/dotnet-core"}],"id":"D001"},{"day":2,"type":"learn","full":true,"title":"async/await mechanics and sync-over-async deadlocks","objective":"Explain what await really does, why blocking on async code deadlocks legacy ASP.NET, and how to set a safe async standard for a team.","task":"Reproduce a sync-over-async deadlock in a small .NET Framework-style context, then fix it and write a 5-line team rule.","topics":["csharp"],"roles":["lead","architect"],"difficulty":2,"explanation":"`async` and `await` do not create threads. The compiler turns an async method into a **state machine**. When the code reaches `await` on a task that is not finished yet, the method registers a continuation and **returns to its caller**. The thread is free to do other work. When the awaited operation completes, the rest of the method runs as a continuation.\n\nWhere does the continuation run? By default, `await` captures the current **SynchronizationContext** (or TaskScheduler). In classic ASP.NET (.NET Framework) and in UI apps, that context allows only one thread at a time to run code for that request or UI. ASP.NET Core has **no** SynchronizationContext, so continuations run on any thread-pool thread.\n\nThis explains the classic deadlock in legacy ASP.NET MVC:\n\n```csharp\npublic ActionResult Index()\n{\n    var data = _client.GetDataAsync().Result; // blocks the request thread\n    return View(data);\n}\n```\n\n1. `.Result` blocks the request thread, which holds the request context.\n2. `GetDataAsync` awaits an HTTP call and captured that same context.\n3. When the HTTP call completes, the continuation needs the context — but the blocked thread holds it. Nobody can move. Deadlock.\n\nIn ASP.NET Core the same code usually does not deadlock, but it still **blocks a thread-pool thread**. Under load this causes **thread-pool starvation**: requests queue, latency jumps, and the pool injects new threads slowly. So \"it works on Core\" is not a reason to block.\n\nPractical rules:\n\n- Async all the way: from controller to database call.\n- Avoid `.Result`, `.Wait()`, `GetAwaiter().GetResult()` in request paths.\n- In **library** code, `ConfigureAwait(false)` avoids capturing a context; in ASP.NET Core application code it is usually unnecessary.\n- Use async for **I/O-bound** work. For CPU-bound work, async does not make it faster; `Task.Run` in a web request just moves the work to another pool thread.\n- Avoid `async void` except for event handlers — exceptions cannot be awaited or caught by the caller.\n","questions":[{"id":"Q1","kind":"technical","question":"What actually happens when a C# method hits an await?","answer":"When the method reaches an await, it first checks if the task is already complete. If it is, the code just continues, no thread switch.\n\nIf the task is not complete, the method saves its state — local variables and where it stopped — in a state machine that the compiler generated. Then it registers a continuation on the task and returns an incomplete task to its caller. The important point is that the thread is released. It does not wait.\n\nWhen the I/O operation finishes, for example a database call, the continuation is scheduled. If a synchronization context was captured, like in classic ASP.NET or WPF, it runs on that context. In ASP.NET Core there is no synchronization context, so it runs on a thread-pool thread.\n\nSo async is not about creating threads. It is about not holding a thread while we wait for I/O. That is why it improves scalability for web servers. It does not make a single CPU-bound operation faster.\n","deeper":"- The compiler generates a struct state machine implementing `IAsyncStateMachine`; `MoveNext` runs each segment between awaits.\n- \"Hot path\" optimisation: if the awaited task is already completed, there is no continuation and almost no overhead. This is why `ValueTask` exists for methods that often complete synchronously.\n- Exceptions are captured in the returned task and re-thrown at the `await`. With `Task.WhenAll`, `await` re-throws the first exception; inspect `task.Exception` for all.\n- Tradeoff: async adds small allocation and complexity costs. For tiny CPU-only methods it is pure overhead. For I/O-bound server code it is almost always right.\n- When it fails: mixing blocking calls with async code (deadlocks, starvation), `async void`, fire-and-forget tasks whose exceptions are lost, and forgetting to pass cancellation tokens.\n","evaluating":"Whether you understand the mechanism (state machine, continuation, context) rather than repeating \"it runs in the background\". They also check if you can connect it to scalability and thread-pool behaviour.\n","weak":["Saying await starts a new thread.","Saying async makes code faster, without separating I/O-bound from CPU-bound work.","Not mentioning SynchronizationContext or the difference between classic ASP.NET and ASP.NET Core."],"levelUp":"A senior developer explains the mechanism correctly. A tech lead or architect also connects it to system behaviour — thread-pool starvation under load, how it shows in metrics (queued requests, rising latency), and what standard the team should follow so the problem does not appear in the first place.\n","followUp":{"question":"When would you use ValueTask instead of Task?","answer":"When a method very often completes synchronously, for example a cache hit, and it is on a hot path where allocations matter. ValueTask can avoid allocating a Task in that case. But it has rules: you should await it only once and not store it. For most application code I keep Task because it is simpler and safer. I only switch to ValueTask when profiling shows the allocation matters.\n"},"qid":"D002-Q1"},{"id":"Q2","kind":"scenario","question":"A legacy ASP.NET MVC application on IIS started hanging after a developer added a call to a new async HTTP client. Some requests never return. How would you investigate and fix it?","answer":"My first suspicion is a sync-over-async deadlock, because the symptom appeared right after adding an async call into an old synchronous code path.\n\nI would check the code first: is someone calling .Result or .Wait() on the async method inside a controller action? In classic ASP.NET the await inside the HTTP client captures the request context, the request thread is blocked waiting, and the continuation can never run.\n\nTo confirm it in production, I would take a memory dump of the w3wp process while requests are hanging, and look at the thread stacks. I expect to see request threads blocked in Task.Wait or get_Result.\n\nFor the fix, the correct solution is to make the call chain async: async controller action, await all the way down. If that is too big for an urgent fix, a short-term option is ConfigureAwait(false) inside the library method, so the continuation does not need the request context. But I would treat that as a temporary fix and create a task to remove the blocking call.\n\nThen I would add a code review rule and an analyzer so .Result in request paths is flagged.\n","deeper":"- Evidence first: a dump (DebugDiag, ProcDump, or Visual Studio) shows blocked threads; IIS \"Worker Processes\" shows long-running requests.\n- Fix options and tradeoffs:\n  - **Async all the way** — correct and scalable, but may touch many layers.\n  - **ConfigureAwait(false) in the library** — removes the deadlock if every await in the chain uses it; fragile because one missed await brings it back.\n  - **Task.Run(() => ...).Result** — avoids the context but still blocks a thread and wastes a second one; acceptable only as an emergency patch.\n  - **Use a synchronous API** if one exists — honest and simple for legacy code.\n- Prevention: analyzers (for example Microsoft.VisualStudio.Threading.Analyzers flag blocking waits), review checklists, and load tests that would catch starvation.\n- On ASP.NET Core the same code usually becomes thread-pool starvation instead of a deadlock: watch `dotnet-counters` for thread-pool queue length.\n","evaluating":"Your troubleshooting structure (hypothesis, evidence, fix, prevention), knowledge of legacy ASP.NET, and whether you separate a safe emergency fix from the proper long-term fix.\n","weak":["Restarting the app pool and calling it fixed.","Wrapping everything in Task.Run without understanding why.","Proposing a full rewrite to .NET Core as the immediate fix."],"levelUp":"A senior developer finds and fixes the blocking call. A lead also manages the incident: communicates impact, chooses a low-risk hotfix first, schedules the proper refactor, and adds prevention (analyzer, review rule, load test) so the team does not repeat it.\n","followUp":{"question":"Why does the same code often not deadlock in ASP.NET Core?","answer":"Because ASP.NET Core does not have a SynchronizationContext. The continuation does not need to come back to a specific request thread; any thread-pool thread can run it. So the blocked thread does not stop the continuation. But we are still blocking a thread. Under load this causes thread-pool starvation, which looks like slow requests and timeouts instead of a clean hang. So the rule is the same: don't block on async code.\n"},"qid":"D002-Q2"},{"id":"Q3","kind":"leadership","question":"Your team has a mix of synchronous and asynchronous code, and people keep adding .Result calls. How would you set a standard and move the codebase in the right direction without stopping delivery?","answer":"I would start by explaining the why, not just the rule. I would show the team a small demo of the deadlock and a load test showing thread-pool starvation. When people see it, they accept the rule much more easily.\n\nThen I would agree a short standard with the team, maybe five lines: async all the way for I/O, no blocking calls in request paths, pass cancellation tokens, no async void, ConfigureAwait(false) in shared libraries.\n\nFor enforcement, I prefer tools over policing. We can enable analyzers that flag blocking calls, first as warnings, and add the rule to the pull request checklist.\n\nFor the existing code, I would not stop feature work for a big rewrite. We would fix the risky paths first — the ones with highest traffic or known incidents — and use a \"boy scout\" rule: when you touch a method, you make its chain async.\n\nFinally I would track progress, for example the number of analyzer warnings, and review it in the retrospective every few sprints.\n","deeper":"- Leading change works best as: explain → agree → automate → measure. Rules imposed without context get bypassed.\n- Tradeoff: turning analyzers into errors immediately can block delivery; start with warnings on new code (or a baseline file) and tighten over time.\n- Prioritise by risk: hot endpoints, background jobs that share the pool, and places with past incidents.\n- Risky alternative: a \"big bang\" async migration branch. It conflicts with ongoing work and is hard to review. Incremental migration is usually safer.\n- Make it visible to managers in business terms: fewer timeouts, ability to handle peak load without more servers.\n","evaluating":"Whether you can lead technical change through people and tooling, balance quality with delivery, and avoid both extremes: doing nothing, or forcing a disruptive rewrite.\n","weak":["'I would tell them not to do it' — no explanation, no enforcement.","Proposing to stop all feature work to rewrite everything as async.","Fixing everyone's code yourself instead of growing the team."],"levelUp":"A senior developer writes the correct code and comments on PRs. A lead creates a shared standard with the team, automates enforcement, prioritises migration by risk, and reports progress in terms stakeholders understand.\n","followUp":{"question":"A senior developer on the team disagrees and says the .Result calls have worked fine for years. What do you do?","answer":"I would take the concern seriously — maybe in their area it really is low risk. I would ask what traffic and context that code runs in. Then I would share evidence: the incident we had, or a quick load test on their endpoint. If the risk is real, I would ask them to help write the standard, because their experience is valuable. If the risk is low, we can accept it and focus on the risky paths first. The goal is agreement on risk, not winning the argument.\n"},"qid":"D002-Q3"}],"exercise":{"title":"Reproduce and fix a sync-over-async deadlock","minutes":25,"body":"1. Create a small console app. Install a single-threaded SynchronizationContext to simulate classic ASP.NET (search \"AsyncContext\" or write a minimal one that queues work to one thread).\n2. Inside that context, call this method with `.Result` and observe the hang:\n\n```csharp\nstatic async Task<string> GetAsync()\n{\n    await Task.Delay(100); // captures the context\n    return \"done\";\n}\n```\n\n3. Fix it three ways and note the tradeoff of each in one line: (a) `await` all the way, (b) `ConfigureAwait(false)` inside `GetAsync`, (c) `Task.Run(...).Result`.\n4. Write a 5-line async standard for your team in the project README.\n"},"english":{"task":"Explain the deadlock in Q2 aloud in 90 seconds, using the structure \"symptom → cause → evidence → fix → prevention\". Record yourself once, listen, and record again with shorter sentences.\n","phrases":["My first hypothesis is… because…","To confirm it, I would look at…","The quick fix is…, but the proper fix is…","The tradeoff is that…","To prevent this from happening again, we…"]},"checkpoint":"You can explain, without notes and in under 90 seconds, why `.Result` deadlocks in classic ASP.NET but causes starvation in ASP.NET Core — and your exercise shows the deadlock and at least two working fixes.\n","project":{"milestone":"Add an 'Async standard' section to the project README (5 rules) and enable a threading analyzer package in the solution.","evidence":"In an interview you can say: 'I set an async standard for the project and enforced it with analyzers, after demonstrating the deadlock and starvation risk.'"},"references":[{"title":"Asynchronous programming with async and await (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/"},{"title":"ConfigureAwait FAQ (.NET Blog)","url":"https://devblogs.microsoft.com/dotnet/configureawait-faq/"},{"title":"Task-based asynchronous pattern (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/standard/asynchronous-programming-patterns/task-based-asynchronous-pattern-tap"}],"id":"D002"},{"day":3,"type":"learn","full":true,"title":"Cancellation, timeouts and timeout budgets","objective":"Pass cancellation correctly from the HTTP request down to the database, combine tokens and timeouts, and explain how timeout budgets protect a system under load.","task":"Project: add CancellationToken support through the upload endpoint and the processing service, then prove with a test that a cancelled request stops the work.","topics":["csharp","aspnet"],"roles":["lead","architect"],"difficulty":2,"explanation":"Cancellation in .NET is **cooperative**. Nobody kills your code. A `CancellationTokenSource` (CTS) owns the signal; it hands out a `CancellationToken` that code can check. Your code, and the libraries you call, decide when to stop. Most I/O APIs (HttpClient, EF Core, SqlClient, streams) accept a token and stop the operation when it is cancelled, usually by throwing `OperationCanceledException` (or its subclass `TaskCanceledException`).\n\nThree tools cover most real cases:\n\n- **Request cancellation.** In ASP.NET Core, `HttpContext.RequestAborted` fires when the client disconnects. If an action or minimal API handler has a `CancellationToken` parameter, it is bound to this token automatically.\n- **Timeouts.** `cts.CancelAfter(TimeSpan)` turns a token into a timeout. Since .NET 8 there is also request timeouts middleware (`AddRequestTimeouts`) for per-endpoint limits.\n- **Linked tokens.** `CancellationTokenSource.CreateLinkedTokenSource(a, b)` cancels when **either** source cancels — for example \"user left\" or \"this step took too long\".\n\n```csharp\npublic async Task<Report> BuildAsync(int id, CancellationToken requestToken)\n{\n    using var cts = CancellationTokenSource.CreateLinkedTokenSource(requestToken);\n    cts.CancelAfter(TimeSpan.FromSeconds(20)); // this step's budget\n\n    var rows = await _db.Sales\n        .Where(s => s.RegionId == id)\n        .ToListAsync(cts.Token); // SqlClient asks SQL Server to stop the query\n    return Summarise(rows);\n}\n```\n\nPractical rules:\n\n1. Accept a `CancellationToken` as the **last parameter** of every async method that does I/O, and pass it down. A token that is not passed down does nothing.\n2. Dispose linked and timeout sources (`using`), otherwise their timers and registrations live longer than needed.\n3. Treat `OperationCanceledException` caused by your token as **expected**: log it at a low level, do not return 500.\n4. Do not cancel in the middle of a step that must be atomic. Check the token **before** you commit, not between two writes that must both happen.\n\n**Timeout budgets.** A request has a total time it is worth waiting for. Each downstream call must fit inside what is left. If the gateway gives up at 30 seconds but your service lets a SQL query run for 60, the server keeps working for a user who is already gone. Inner timeouts should be **shorter** than outer ones, and retries must fit in the same budget.\n\nLegacy note: classic ASP.NET on IIS exposes `Response.ClientDisconnectedToken`; how reliably it fires depends on IIS mode and version (verify against current docs before relying on it).\n","questions":[{"id":"Q1","kind":"technical","question":"How does cancellation work in .NET, and what is the difference between a CancellationToken, a linked token and CancelAfter?","answer":"Cancellation in .NET is cooperative. A CancellationTokenSource owns the signal, and it gives out tokens. The code that receives a token must check it or pass it to APIs that support it. Nothing is aborted by force.\n\nA plain token usually comes from the caller. In ASP.NET Core, the most common one is RequestAborted, which fires when the client disconnects. I just add a CancellationToken parameter to my action and pass it down to EF Core or HttpClient.\n\nCancelAfter turns a source into a timeout. After the time passes, the token is cancelled, and the operation throws OperationCanceledException.\n\nA linked token source combines tokens. It is cancelled when any of the parent tokens is cancelled. I use it when I want \"stop if the user leaves, or if this step takes longer than 20 seconds\". I create a linked source from the request token, call CancelAfter on it, and pass its token down.\n\nThe tradeoff is discipline. If one method in the chain forgets to pass the token, cancellation stops there. And I must dispose the linked source, or its registration stays alive longer than needed.\n","deeper":"- **Who throws:** APIs throw `OperationCanceledException`; `TaskCanceledException` derives from it. Catch the base type, and use a filter like `when (token.IsCancellationRequested)` to separate \"we cancelled\" from \"something else timed out\".\n- **HttpClient trap:** `HttpClient.Timeout` (100 seconds by default) also shows up as `TaskCanceledException`. On modern .NET the inner exception is a `TimeoutException`, which lets you tell a timeout from a caller cancellation.\n- **CPU-bound loops:** call `token.ThrowIfCancellationRequested()` every N iterations; checking on every iteration can cost more than the work.\n- **Registrations:** `token.Register(callback)` lets you cancel non-token APIs (for example closing a socket). Dispose the registration.\n- **Reuse:** a cancelled source cannot be un-cancelled. `TryReset()` (.NET 6+) works only if it was not cancelled.\n- **When it fails:** libraries that ignore tokens, swallowing `OperationCanceledException` and continuing, or cancelling between two writes that should be atomic.\n","evaluating":"Whether you know cancellation is cooperative and must be passed down the whole chain, and whether you can use linked tokens and timeouts in real code — not only define them.\n","weak":["Saying a token 'kills the thread' or aborts the task by force.","Accepting a CancellationToken in the controller but never passing it to EF Core or HttpClient.","Treating every OperationCanceledException as an error and returning HTTP 500."],"levelUp":"A senior developer passes tokens correctly and knows the APIs. A lead or architect also defines the policy: which operations get which timeout, how cancellations are logged and counted separately from errors, and how timeouts align across services so the inner call always gives up first.\n","followUp":{"question":"Should a background job use the request's CancellationToken?","answer":"No. If the work must continue after the user leaves, like processing an uploaded file, it should not be tied to RequestAborted. I would queue the work and let the background service use its own token — the stoppingToken from BackgroundService — so it stops on application shutdown, not when the browser closes. If I passed the request token, the job would be cancelled as soon as the HTTP response finished, which is a common bug.\n"},"qid":"D003-Q1"},{"id":"Q2","kind":"scenario","question":"Users open a heavy report page, wait a bit, then close the tab. The database is overloaded and CPU stays high long after traffic drops. What is happening and how would you fix it?","answer":"My hypothesis is that the report queries keep running after the user has left. The browser closes the connection, but the server code has no cancellation, so SQL Server finishes every expensive query for nobody. When users retry, we get even more copies of the same query.\n\nTo confirm it, I would compare active requests in SQL Server, for example sys.dm_exec_requests, with the number of active users. I would also check the code: does the report endpoint accept a CancellationToken and pass it to the query?\n\nThe first fix is to pass RequestAborted down to EF Core or SqlClient. When the client disconnects, SqlClient asks SQL Server to stop the query. Second, I would add a timeout budget, for example 30 seconds, with a linked token, so even connected users cannot run a query forever.\n\nThen I would fix the root cause. Reports that heavy should not run on demand for every click. Options are caching the result for a few minutes, precomputing it in a background job, or limiting how many run at the same time.\n\nFinally I would add a metric for cancelled requests, so we can see this pattern early next time.\n","deeper":"- **Evidence:** `sys.dm_exec_requests` and `sys.dm_exec_sessions` for long-running queries; app logs showing requests completing after the client already disconnected; a load balancer log with client-closed status codes.\n- **Proxies matter:** behind IIS, a reverse proxy or a load balancer, the disconnect may not reach the app quickly, or at all. Test end to end; do not assume `RequestAborted` fires.\n- **Fix options and tradeoffs:**\n  - **Pass the token** — cheap and correct; does not help users who stay connected.\n  - **Timeout budget** — protects the database; some legitimate big reports will fail, so give them another path.\n  - **Concurrency limit** — rate limiting middleware or a semaphore around report generation; protects the DB but users may wait or get 429.\n  - **Cache or precompute** — best for repeated reports; data becomes slightly stale, which must be acceptable to the business.\n  - **Async export** — queue the report and notify when ready; the best user experience for very heavy reports, but more moving parts.\n- **Database side:** a SQL command timeout is a last safety net, not the main control.\n","evaluating":"Your troubleshooting structure, whether you connect a user behaviour (closing tabs) to server load, and whether you go beyond \"add a token\" to protect the database with budgets, limits and a better design for heavy work.\n","weak":["Immediately asking for a bigger database server.","Only increasing timeouts so the queries 'have time to finish'.","Not checking whether the disconnect actually reaches the application through the proxy."],"levelUp":"A senior developer adds cancellation and a timeout. A lead or architect also changes the design for heavy work (cache, precompute or async export), sets a concurrency limit to protect shared resources, and adds monitoring so the team sees cancelled and timed-out requests as a signal.\n","followUp":{"question":"If you cancel a query in the middle of a transaction, is the data safe?","answer":"For a single transaction, yes. When the query is cancelled, SQL Server stops it and the transaction is rolled back, so we do not get half-written data. The danger is when I have two separate steps without a shared transaction, for example writing to the database and then calling another service. Cancelling between them can leave inconsistent state. For those cases I check the token before starting the critical part, and I use patterns like an outbox instead of relying on cancellation.\n"},"qid":"D003-Q2"},{"id":"Q3","kind":"leadership","question":"Your service calls another team's API. Their calls sometimes take 90 seconds, but your gateway times out at 30 seconds. How would you agree timeout budgets with that team?","answer":"I would start with data, not opinions. I would bring our numbers: p50, p95 and p99 latency of their API from our side, how often we pass 30 seconds, and what the user sees when it happens.\n\nThen I would explain the problem as a shared one. If our gateway gives up at 30 seconds, every call that runs longer is wasted work on their side too. Their servers keep working for a user who already got an error.\n\nI would propose a budget together. For example, the user request has 30 seconds in total. Our own work takes about 5. So their call gets 20 seconds, including any retry, and we keep some margin. We agree that our client will cancel at 20 seconds, and they agree that their service will respect cancellation.\n\nIf some operations really need 90 seconds, we should not force them into a synchronous call. We could agree on an async pattern: we submit a request, they return an ID, and we check the status later.\n\nFinally I would write the agreement down — in the API contract or a short ADR — and add monitoring on both sides.\n","deeper":"- **Budget thinking:** total user budget → minus own processing → minus margin → downstream budget. Retries share the same budget; three attempts of 20 seconds do not fit in 30.\n- **Agreement content:** timeout per operation, retry policy (who retries, how many times, with backoff), idempotency for retried writes, error codes for \"too busy\" (429/503), and the async alternative for long work.\n- **Tradeoff:** strict timeouts protect the system but some slow-but-valid requests fail. A long-running-operation pattern costs more to build but removes the conflict.\n- **Resilience tooling:** `Microsoft.Extensions.Http.Resilience` can enforce total and per-attempt timeouts plus retries in one place; check its default values against current docs rather than assuming them.\n- **Government/hybrid angle:** calls to on-premises systems through VPN or integration layers often add hidden timeouts (firewall idle timeouts, ESB limits). List every hop in the budget.\n- **Escalation:** if the other team cannot change soon, protect your service first (circuit breaker, fallback message) and track the dependency risk visibly.\n","evaluating":"Whether you can handle a cross-team technical dependency with data and collaboration, turn it into a clear written agreement, and suggest a design change when a synchronous call is the wrong shape.\n","weak":["Simply raising our gateway timeout to 120 seconds.","Blaming the other team or escalating to managers before talking with data.","Adding retries without considering that retries multiply load on a slow service."],"levelUp":"A senior developer sets a sensible client timeout and retry. A lead or architect builds a shared timeout budget across all hops, documents it as part of the contract, proposes the async pattern for long work, and makes both teams accountable with monitoring.\n","followUp":{"question":"What do you do when the other team says they cannot support cancellation at all?","answer":"Then cancelling on our side only protects us, not them. I would still enforce our timeout, so our users and threads are not stuck. To protect their system, I would limit how many concurrent calls we send, with a semaphore or a bulkhead, and add a circuit breaker so we stop calling when they are clearly overloaded. I would also record this as a known risk, and suggest the async request pattern for their roadmap.\n"},"qid":"D003-Q3"}],"exercise":{"title":"Pass cancellation through the upload pipeline and prove it works","minutes":25,"body":"1. In the project, make sure the upload endpoint accepts a `CancellationToken` and passes it to every async call it makes (file stream copy, database save, enqueue).\n2. In the processing service, add a linked token with a step budget:\n\n```csharp\nusing var cts = CancellationTokenSource.CreateLinkedTokenSource(stoppingToken);\ncts.CancelAfter(TimeSpan.FromSeconds(30));\nawait _processor.ProcessAsync(documentId, cts.Token);\n```\n\n3. Catch `OperationCanceledException` only where you can separate \"shutdown/our timeout\" from real errors. Log cancellations at Information level, not Error.\n4. Write one test: start a slow fake processing step (`Task.D
