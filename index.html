.\n- Automatic retry of failed tests hides flakiness; acceptable only as a temporary measure with reporting, never as the fix.\n- Tradeoff: quarantine reduces coverage temporarily. That is acceptable only with an owner and a deadline.\n","evaluating":"Whether you see the trust problem behind flaky tests, can find the root causes systematically, and can introduce team process (quarantine, ownership, metrics) without lowering quality.\n","weak":["Adding automatic retries and considering it solved.","Deleting or skipping the flaky tests permanently.","Blaming the CI agents without collecting any data."],"levelUp":"A senior developer fixes the flaky tests they are assigned. A lead restores trust in the pipeline: makes flakiness measurable, quarantines with ownership and deadlines, fixes the common root causes with shared test utilities (fake clock, data reset, factories), and sets a team rule so the problem does not grow back.\n","followUp":{"question":"A test fails only on the build agent, never on developer machines. What do you check?","answer":"I check what is different on the agent. Common differences are time zone and culture, for example date or number parsing; file paths and case sensitivity on Linux agents; CPU count, which changes parallelism and timing; missing tools like Docker; and leftover data from previous runs on a self-hosted agent. I would reproduce with the same container image or agent settings, and add logs to the test. Then I fix the test to not depend on that environment, for example by setting the culture explicitly.\n"},"qid":"D013-Q2"},{"id":"Q3","kind":"leadership","question":"You join a team that maintains a large legacy .NET application with almost no automated tests. How would you introduce testing without stopping delivery?","answer":"My approach is to start where the risk is highest and make testing easy, not to demand coverage everywhere.\n\nFirst, I talk to the team and look at the history. Which areas break most often? Which changes scare people? That is where tests give the most value.\n\nSecond, I make the first step very small. I set up the test project, the pipeline step and one or two example tests, so writing the next test is easy. In legacy code, I often start with characterization tests: tests that record what the code does today, even if it looks strange. They protect us when we refactor. For old ASP.NET MVC code that is hard to unit test, tests at the HTTP or service level are often more practical than mocking everything.\n\nThird, I agree a simple rule with the team: every bug fix comes with a test that reproduces it, and new code comes with tests. Old code gets tests when we touch it.\n\nI also pair with developers on their first tests, and show the results: fewer regressions in the areas we covered. I would not set a coverage percentage target early, because people learn to game it.\n","deeper":"- Characterization tests (from Michael Feathers' *Working Effectively with Legacy Code*) lock current behaviour before refactoring; you fix the behaviour later, deliberately.\n- Seams: in legacy code you often need small refactorings to make code testable — extract an interface around `HttpContext.Current`, static helpers or `DateTime.Now`. Do this in small, reviewed steps.\n- Order of value: bug-fix regression tests → high-risk business rules → main endpoints/workflows → everything else.\n- Pipeline: run tests on every PR early, even if there are only five. Habit matters more than volume at the start.\n- Tradeoffs: a coverage target creates activity but not necessarily protection; \"tests later\" never happens. Time-box the first investment (for example a few days of setup) and show results before asking for more.\n- Government/on-prem: if agents cannot run Docker, start with unit and HTTP-level tests against a dedicated test database.\n","evaluating":"Whether you can change team habits pragmatically: prioritise by risk, lower the barrier, use rules the team agrees with, and protect delivery. They also check legacy-code knowledge (characterization tests, seams).\n","weak":["Demanding 80% coverage from day one.","Proposing to stop features for a 'testing sprint' or a rewrite.","Writing all the tests yourself, so the team never builds the habit."],"levelUp":"A senior developer writes good tests for their own changes. A lead changes the team's behaviour: picks the highest-risk areas, builds the infrastructure that makes tests cheap, agrees simple rules like \"every bug fix gets a test\", coaches people through the first tests, and shows the benefit in terms managers care about — fewer regressions and safer releases.\n","followUp":{"question":"A manager asks how you will measure whether the testing effort is worth it. What do you say?","answer":"I would not use coverage as the main number. I would track outcomes: the number of bugs that reach production or UAT, especially regressions in areas we covered; how often we need hotfixes; and how long it takes to get a change safely to release. I would also track pipeline health, like build time and the flaky rate. I would compare these before and after, over a few months, and be honest that early results take time.\n"},"qid":"D013-Q3"}],"exercise":{"title":"Integration tests for the upload endpoint with WebApplicationFactory","minutes":25,"body":"1. Create a test project (`tests/Assistant.Api.IntegrationTests`), reference the API project, and add `Microsoft.AspNetCore.Mvc.Testing` plus xUnit. If the test project cannot see `Program`, add `public partial class Program { }` at the end of Program.cs (newer SDKs may make this unnecessary — verify against current docs).\n2. Adapt the names below (`IDocumentStorage`, `/api/documents`, the expected status code) to your project.\n\n```csharp\nusing System.Net;\nusing System.Net.Http.Headers;\nusing Microsoft.AspNetCore.Hosting;\nusing Microsoft.AspNetCore.Mvc.Testing;\nusing Microsoft.AspNetCore.TestHost;\nusing Microsoft.Extensions.DependencyInjection;\nusing Microsoft.Extensions.DependencyInjection.Extensions;\n\npublic class AssistantApiFactory : WebApplicationFactory<Program>\n{\n    protected override void ConfigureWebHost(IWebHostBuilder builder)\n    {\n        builder.UseEnvironment(\"Testing\");\n        builder.ConfigureTestServices(services =>\n        {\n            services.RemoveAll<IDocumentStorage>();\n            services.AddSingleton<IDocumentStorage, InMemoryDocumentStorage>();\n        });\n    }\n}\n\npublic class UploadEndpointTests(AssistantApiFactory factory)\n    : IClassFixture<AssistantApiFactory>\n{\n    private readonly HttpClient _client = factory.CreateClient();\n\n    private static MultipartFormDataContent FileContent(byte[] bytes, string fileName, string contentType)\n    {\n        var file = new ByteArrayContent(bytes);\n        file.Headers.ContentType = new MediaTypeHeaderValue(contentType);\n        var form = new MultipartFormDataContent();\n        form.Add(file, \"file\", fileName);\n        return form;\n    }\n\n    [Fact]\n    public async Task Valid_pdf_is_accepted_and_returns_location()\n    {\n        using var form = FileContent(\"%PDF-1.7 test\"u8.ToArray(), \"report.pdf\", \"application/pdf\");\n\n        var response = await _client.PostAsync(\"/api/documents\", form);\n\n        Assert.Equal(HttpStatusCode.Accepted, response.StatusCode); // or Created\n        Assert.NotNull(response.Headers.Location);\n    }\n\n    [Fact]\n    public async Task Empty_file_returns_400()\n    {\n        using var form = FileContent([], \"empty.pdf\", \"application/pdf\");\n\n        var response = await _client.PostAsync(\"/api/documents\", form);\n\n        Assert.Equal(HttpStatusCode.BadRequest, response.StatusCode);\n    }\n\n    // TODO: disallowed type (e.g. .exe) returns 400 or 415 with ProblemDetails\n}\n```\n\n3. Write a simple `InMemoryDocumentStorage` (a `ConcurrentDictionary`). Because the factory is shared, do not assert on \"total documents stored\" — assert on the document your test created.\n4. Complete the TODO test and assert the response body is ProblemDetails (from Day 11).\n5. Note: minimal API endpoints that bind `IFormFile` interact with antiforgery validation in recent ASP.NET Core versions; if your test gets an unexpected 400, check the antiforgery setup for that endpoint (verify against current docs). Also note `TestServer` does not run Kestrel, so Kestrel body-size limits are not tested here.\n"},"english":{"task":"Explain your testing strategy for the project aloud in 90 seconds: \"what each test level is for → what is real and what is faked → what runs in the pipeline → one tradeoff\". Record it, then answer Q2 in 90 seconds using \"impact → data → stop the damage → root causes → prevention\".\n","phrases":["The biggest risk here is…, so the test I care about most is…","Unit tests can't catch this, because the problem is in the wiring.","As a short-term measure we…, but the real fix is…","Could you clarify whether the build agents can run Docker?","I haven't used that tool in production, but my understanding is…","To sum up, my approach has three parts…"]},"checkpoint":"At least three integration tests for the upload endpoint pass locally and in a clean `dotnet test` run, including one happy path and two failure paths with asserted status codes; you can run them three times in a row with the same result; and you can explain in under 90 seconds what WebApplicationFactory exercises that a mocked unit test does not.\n","project":{"milestone":"Add an integration test project using WebApplicationFactory with storage replaced by an in-memory fake, covering the upload endpoint's happy path, empty file and disallowed type; add a short 'Testing strategy' section to the README.","evidence":"In an interview you can say: 'I wrote integration tests that run the real ASP.NET Core pipeline with WebApplicationFactory, faked only the storage boundary, and documented which test level covers which risk.' Show the test project and a green pipeline run."},"references":[{"title":"Integration tests in ASP.NET Core (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/aspnet/core/test/integration-tests"},{"title":"Unit testing best practices for .NET (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/core/testing/unit-testing-best-practices"},{"title":"Choosing a testing strategy for EF Core (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/ef/core/testing/choosing-a-testing-strategy"},{"title":"Testcontainers for .NET (official documentation)","url":"https://dotnet.testcontainers.org/"},{"title":"Eradicating Non-Determinism in Tests (Martin Fowler)","url":"https://martinfowler.com/articles/nonDeterminism.html"},{"title":"The Practical Test Pyramid (martinfowler.com)","url":"https://martinfowler.com/articles/practical-test-pyramid.html"}],"id":"D013"},{"day":14,"type":"review","full":true,"title":"Week 2 review and cumulative mock interview #2","objective":"Retrieve and connect week 2 topics — DI lifetimes and captive dependencies, GC and memory leaks, LINQ and collections, exceptions with IExceptionHandler and ProblemDetails, performance investigation with BenchmarkDotNet, and testing strategy — and combine them with week 1 topics in a cumulative mock.","task":"Time budget: 40–45 minutes. (1) Recall, 12 min: answer the 8 recall questions aloud before revealing; mark green, amber or red. (2) Cumulative mock #2, 20 min: answer the 4 mock questions aloud with a timer, about 2 minutes each, recording yourself; the questions mix this week with async, cancellation, streaming and concurrency from week 1. Compare with the \"look for\" bullets. (3) Reflection, 8 min: compare with your day 7 results and update the re-study list. (4) English, 5 min: the incident-and-unknown task below.\n","topics":["review","csharp","aspnet"],"roles":["lead","architect"],"difficulty":2,"recall":[{"question":"What is a captive dependency, and how does ASP.NET Core help you catch it?","answer":"A captive dependency is a shorter-lived service held by a longer-lived one, for example a scoped DbContext injected into a singleton. The DbContext then lives forever, is shared across requests and threads, and is not thread-safe. Scope validation (`ValidateScopes`, on by default in the Development environment) throws when a scoped service is resolved from the root provider; `ValidateOnBuild` checks registrations at startup.\n"},{"question":"How should a BackgroundService use a scoped service like DbContext?","answer":"Inject `IServiceScopeFactory`, create a scope per unit of work (for example per message or per loop iteration) with `CreateAsyncScope()`, resolve the DbContext from that scope, and dispose the scope after the work. This gives each unit of work a fresh context and change tracker. Also pass the `stoppingToken` into the work so shutdown is clean.\n"},{"question":"What lands on the Large Object Heap, and why does it matter?","answer":"Objects of 85,000 bytes or more, typically large arrays and strings. The LOH is collected only with gen 2 and is not compacted by default, so frequent large allocations cause expensive full GCs and fragmentation. Pooling with `ArrayPool<T>` or streaming instead of buffering whole files reduces this.\n"},{"question":"Name three common causes of managed memory leaks in .NET applications.","answer":"Event handlers on long-lived publishers that keep subscribers alive; static or unbounded caches that only grow; and objects captured by singletons or timers (including captive dependencies). Not disposing resources such as `HttpResponseMessage` or streams adds pressure too. A gcdump comparison over time shows which types keep growing and what roots them.\n"},{"question":"Explain deferred execution and the multiple-enumeration problem with one example.","answer":"A LINQ query is not executed when it is defined, only when it is enumerated. If `var active = users.Where(u => u.IsActive);` is passed to code that calls `Count()` and then `foreach`, the filter runs twice, and if `users` is an `IQueryable`, two database queries run. Materialise once with `ToList()` when you need the results more than once.\n"},{"question":"What does IExceptionHandler do, and how does it relate to ProblemDetails?","answer":"`IExceptionHandler` (.NET 8+) lets you handle unhandled exceptions in a class registered with `AddExceptionHandler<T>()` and run by `UseExceptionHandler()`; `TryHandleAsync` returns true when it has written the response. Together with `AddProblemDetails()`, errors are returned in the standard RFC 7807/9457 ProblemDetails format with a status code and a trace ID, without leaking stack traces. You log the exception once there, not at every layer.\n"},{"question":"What are the main rules for a trustworthy BenchmarkDotNet measurement?","answer":"Run in Release mode without a debugger, benchmark realistic inputs, and add `[MemoryDiagnoser]` to see allocations as well as time. Compare against a baseline method and look at the error and standard deviation, not only the mean. A micro-benchmark proves a method is faster; only production metrics like p95/p99 prove users notice.\n"},{"question":"When do you choose an integration test with WebApplicationFactory and Testcontainers over a unit test?","answer":"When the risk is in the wiring: routing, model binding, DI registrations, middleware, serialization and real SQL behaviour. WebApplicationFactory hosts the app in memory; Testcontainers runs a real database (for example SQL Server) in Docker so the queries are real. Unit tests stay best for pure logic because they are faster and pinpoint failures.\n"}],"mock":{"minutes":20,"questions":[{"kind":"technical","question":"Design the processing loop of a BackgroundService that reads documents from a Channel and saves results with EF Core. Cover lifetimes, cancellation, concurrency and error handling.","lookFor":"- Uses `IServiceScopeFactory` and one scope (and DbContext) per document, not a DbContext held by the service.\n- Reads with `await foreach (... in reader.ReadAllAsync(stoppingToken))`; passes the token to EF Core calls.\n- Controlled parallelism (N consumers or `Parallel.ForEachAsync` with a limit), never one DbContext shared across threads.\n- Catches and logs per-document failures so one bad document does not stop the service; distinguishes `OperationCanceledException` on shutdown.\n- Mentions the durability limit of an in-process Channel and idempotency on retry.\n"},{"kind":"scenario","question":"After Tuesday's release, p99 latency of the document search API doubled and memory on the servers is higher. p50 looks normal. Walk me through your investigation.","lookFor":"- Describes it like an incident: impact, timeline, what changed in the release (diff review).\n- Uses evidence before fixing: `dotnet-counters` (GC heap size, gen 2 count, thread-pool queue length), traces with `dotnet-trace`, a gcdump if memory keeps growing.\n- Considers concrete hypotheses from both weeks: new sync-over-async call (starvation), large allocations hitting the LOH / gen 2 GCs, `AsEnumerable()` or `ToList()` before filtering, a new unbounded cache.\n- Explains why p99 moves while p50 does not (GC pauses, queueing, some requests hitting a slow path).\n- Mitigation (rollback or feature flag) separated from root-cause fix; prevention such as a benchmark or a performance check in the pipeline.\n"},{"kind":"scenario","question":"An export endpoint for 1 million benchmark records returns 500 errors under load. The code calls _db.Records.ToList(), then filters and maps in memory, and catches exceptions to return a generic error. What do you change?","lookFor":"- Moves filtering and projection into the `IQueryable` so SQL does the work; selects only needed columns, `AsNoTracking()`.\n- Streams the result (`AsAsyncEnumerable()` / `IAsyncEnumerable` or writing to the response stream) instead of materialising everything; passes `RequestAborted`.\n- Replaces the swallowed catch with a global `IExceptionHandler` + ProblemDetails and logging once with a trace ID.\n- Mentions memory effects: big lists and strings on the LOH, gen 2 pressure.\n- Proves the change: before/after measurement and an integration test for the endpoint.\n"},{"kind":"leadership","question":"Your team has no automated tests, inconsistent error handling, and the manager wants features, not 'technical work'. How do you improve quality over the next quarter?","lookFor":"- Connects the work to business impact: incidents, time to diagnose, release confidence — with real numbers if available.\n- Small, visible steps: global exception handler + ProblemDetails first (fast win), then integration tests around the riskiest endpoints.\n- Builds testing into the Definition of Done for touched code instead of a separate \"test project\" phase.\n- Uses ADRs or a short team standard for decisions such as exceptions vs Result pattern, agreed with the team.\n- Shows how progress is measured and reported (pipeline test count, escaped defects, mean time to diagnose).\n"}]},"reflection":["Compare today's recall with day 7: which colour went up, and which week 1 topic did you struggle with again in the cumulative mock?","In the p99 scenario, did you collect evidence before proposing a fix, or did you jump to a solution? Write the first tool you named and whether it was the right first step.","Where in your real systems (a legacy ASP.NET MVC app or a .NET 8 service) could a captive dependency, a static cache or a swallowed exception be hiding today?","Which question made you say 'I'm not sure'? Write down what you would check and where (official docs, a quick benchmark, a dump) — this is your re-study item."],"english":{"task":"Retell mock question 2 as a 90-second incident story: impact → timeline → investigation → cause → fix → prevention. Include one honest moment where you say you do not know something yet and how you would find out. Record it, then re-record using past tense consistently and no sentence longer than about 15 words.\n","phrases":["On [day], after the release, we noticed that…","The impact was… for about [time].","Our first step was to stabilise: we…","The root cause turned out to be…","I'm not 100% sure about that detail, but I would check it by…","I haven't used that in production, but my understanding is…, and I would verify it with…"]},"checkpoint":"At least 6 of 8 recall questions marked green and no more than one red; all 4 cumulative mock answers recorded, each under 2.5 minutes, each with at least one tradeoff and, for the two scenarios, a clear evidence-before-fix structure; the incident story recorded in under 90 seconds including one explicit \"I don't know yet, I would check…\" sentence; re-study list updated with every red item from day 7 and day 14.\n","id":"D014"},{"day":15,"type":"learn","title":"Records, immutability and value equality","objective":"Explain when to use record class, record struct or a plain class, how with-expressions and value equality work, and why records are a poor fit for EF Core tracked entities.","task":"Project: model DocumentUploadedEvent and UploadResult as records, write two xUnit tests proving value equality and non-destructive mutation with 'with', and note in the README why the Document entity stays a class.","topics":["csharp"],"roles":["lead","architect"],"difficulty":1,"english":"Practise contrasting two options: 'A record gives us…, but a class is better here because…'","id":"D015","full":false},{"day":16,"type":"learn","title":"Nullable reference types and generic constraints","objective":"Enable nullable reference types in an existing codebase step by step, read the main warnings (CS8602, CS8618), use required members and attributes like NotNullWhen, and choose generic constraints (class, notnull, new(), interface) deliberately.","task":"Turn on <Nullable>enable<\/Nullable> in one legacy-style class library, fix the first 15 warnings without using the null-forgiving operator, then write a generic Result<T> wher ch lead actually does","objective":"Explain how a tech lead's responsibilities differ from a senior developer, an architect and an engineering manager, and where they overlap.","task":"Project: create the STAR bank document, paste your list of 10–15 real situations from your work history, and tag each with the competencies it shows (delegation, conflict, incident, quality, stakeholder).","topics":["leadership"],"roles":["lead"],"difficulty":2,"english":"Practise defining your role: 'As a tech lead, I am accountable for…, but I am not the person who…'","id":"D151","full":false},{"day":152,"type":"learn","title":"Delegation levels and choosing the right one","objective":"Use delegation levels (from 'I decide' to 'you decide and inform me') and match them to task risk and the person's experience.","task":"Take eight real tasks from your current or last team and assign each a delegation level and a check-in rhythm; mark one task you held too tightly and what you would change.","topics":["leadership"],"roles":["lead"],"difficulty":2,"english":"Practise handing over work: 'You own this decision; I only need to know if… changes.'","id":"D152","full":false},{"day":153,"type":"crosstrack","title":"Design kata: ministry document approval workflow","objective":"Keep system design sharp by designing a multi-step document approval workflow with audit, notifications and on-prem constraints in 25 minutes.","task":"Timebox 25 minutes: requirements and constraints (5), high-level components (8), state model and audit (7), failure handling and scaling (5); record the closing summary in 60 seconds.","topics":["architecture","distributed"],"roles":["architect"],"difficulty":3,"english":"Practise managing interview time: 'I will spend a few minutes on requirements first, then…'","id":"D153","full":false},{"day":154,"type":"review","title":"Week 22 review & mock interview","objective":"Consolidate days 148–153: capacity estimation, the failure-injection demo, Phase 5 assessment results, veloper who wants to 'become senior'; then draft STAR story #4 about a real person you helped grow, without inflating the outcome.","topics":["leadership"],"roles":["lead"],"difficulty":2,"english":"Practise open questions: 'What part of this work gives you energy, and what part drains you?'","id":"D157","full":false},{"day":158,"type":"learn","title":"Building a healthy code review culture","objective":"Define the purpose of code review (shared ownership, defects, knowledge spread), set turnaround norms and keep reviews respectful.","task":"Project: write the handbook's PR template (context, change, testing, risk, screenshots) and a code review checklist of 10 items split into 'must block' and 'comment only'.","topics":["leadership","delivery"],"roles":["lead"],"difficulty":2,"english":"Practise a soft review comment: 'Could we consider… here? I am worried that…'","id":"D158","full":false},{"day":159,"type":"learn","title":"Reviewing design, large PRs and pushback","objective":"Review for design and risk rather than style, handle oversized PRs, and respond when a senior colleague rejects your feedback.","task":"Role-play aloud: a senior developer refuses to split a 2,000-line PR before a ministry deadline; then draft STAR story #5 about a real code review disagreement or standard you introduced.","topics":["leadership"],"roles":["lead"],"difficulty":3,"english":"Practise holding a position respectfully: 'I understand the deadline; my concern is still…, so can we agree on…?'","id":"D159","full":false},{"day":160,"type":"crosstrack","title":"AI-assisted code review: help, limits and policy","objective":"Keep AI knowledge warm by explaining where LLM review tools help, where they hallucinate, and what data-protection policy a government team needs before using them.","task":"Write a half-page team policy for AI coding assistants: allowed tools (cloud vs self-hosted), forbidden data (classified code, secrets, personal data), human accountability for merged code, and ho ing after a pause: 'Let me step back for a second… the key point is…'","id":"D166","full":false},{"day":167,"type":"learn","title":"Giving and receiving difficult feedback","objective":"Give specific, timely feedback using a situation-behaviour-impact structure, and receive critical feedback without defending.","task":"Write two SBI feedback statements (one positive, one corrective) for realistic team situations, role-play delivering the corrective one aloud, and note how you would respond if the person became upset.","topics":["leadership","english"],"roles":["lead"],"difficulty":2,"english":"Practise SBI wording: 'In yesterday's release meeting, when you…, the impact was…'","id":"D167","full":false},{"day":168,"type":"review","title":"Week 24 review & mock interview","objective":"Consolidate days 162–167: coding standards and Definition of Done, technical debt registers, delivery vs quality, conflict mediation, outbox re-test and SBI feedback.","task":"Tell STAR stories #6 and #7 aloud and recite your DoD from memory, then do a 15-minute mock ('how do you handle tech debt?', 'two seniors disagree', 'give me feedback you gave someone') and note one filler word to remove.","topics":["review","leadership"],"roles":["lead"],"difficulty":2,"english":"Practise removing fillers: pause silently instead of saying 'actually' or 'basically'.","id":"D168","full":false},{"day":169,"type":"learn","title":"Handling underperformance fairly","objective":"Diagnose underperformance (skill, will, clarity, personal circumstances), agree a written improvement plan and know when to involve the manager or HR.","task":"Role-play aloud the first conversation with a developer whose PRs keep missing deadlines; draft a two-week support plan with measurable goals. Then draft STAR story #9 from a real case, or an honest approach answer if you have none.","topics":["leadership"],"roles":["lead"],"difficulty":3,"english":"Practise empathetic directness: 'I want to help you succeed, and I also nee /* ===================== Dates ===================== */

}

    if (/^\s*-\s+/.test(line)) { const ul = el('ul'); let cur = null; while (i < lines.length && (/^\s*-\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && cur))) { const l = lines[i]; if (/^\s*-\s+/.test(l)) { const depth = l.match(/^\s*/)[0].length; cur = el('li', null, inline(l.replace(/^\s*-\s+/, ''))); if (depth >= 2 && ul.lastElementChild) { let sub = ul.lastElementChild.querySelector('ul'); if (!sub) { sub = el('ul'); ul.lastElementChild.append(sub); } sub.append(cur); } else ul.append(cur); } else cur.append(' ', inline(l.trim())); i++; } wrap.append(ul); continue; }
    if (/^\s*\d+\.\s+/.test(line)) { const ol = el('ol'); while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { ol.append(el('li', null, inline(lines[i].replace(/^\s*\d+\.\s+/, '')))); i++; } wrap.append(ol); continue; }

function chip(text, cls) { return el('span', { class: 'chip ' + (cls || '') }, text); }
