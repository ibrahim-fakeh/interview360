elay(Timeout.Infinite, token)`), cancel the token after 100 ms, and assert the task ends as cancelled within one second.\n5. In the README, write a 4-line \"Cancellation rule\" for the project.\n"},"english":{"task":"Answer Q3 aloud in 90 seconds as if you are in a meeting with the other team's lead. Use numbers (\"our p95 is…\", \"the budget is…\"). Record once, then record again and remove filler words like \"basically\" and \"actually\".\n","phrases":["Let me share what we are seeing from our side.","The total budget for this request is…, so your call can take at most…","If we retry, the retry has to fit inside the same budget.","Can I clarify — is that the p95 or the average?","For the long operations, I'd suggest we move to an async pattern.","Let's write this down so both teams can monitor it."]},"checkpoint":"Your test shows that cancelling the token stops the processing step within one second, the upload endpoint passes its token to every async call, and you can explain a 30-second timeout budget split across three hops aloud in under 90 seconds.\n","project":{"milestone":"Cancellation flows from the upload request and from the worker's stopping token down to every I/O call, with a step timeout and a test that proves cancellation works.","evidence":"In an interview you can say: 'I made cancellation end to end in our pipeline, with timeout budgets per step, and I have a test that proves abandoned work stops.'"},"references":[{"title":"Cancellation in managed threads (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/standard/threading/cancellation-in-managed-threads"},{"title":"Request timeouts middleware in ASP.NET Core (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/aspnet/core/performance/timeouts"},{"title":"Build resilient HTTP apps: key development patterns (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/core/resilience/http-resilience"},{"title":"CancellationTokenSource.CreateLinkedTokenSource (API reference)","url":"https://learn.microsoft.com/en-us/dotnet/api/system.threading.cancellationtokensource.createlinkedtokensource"}],"id":"D003"},{"day":4,"type":"learn","full":true,"title":"IAsyncEnumerable, streaming and ValueTask","objective":"Stream large data sets with IAsyncEnumerable without loading them into memory, know when ValueTask is worth its rules, and explain streaming tradeoffs to non-technical people.","task":"Project: change the document list endpoint to stream results with IAsyncEnumerable and compare memory use against the buffered version.","topics":["csharp","aspnet","data"],"roles":["lead","architect"],"difficulty":2,"explanation":"`Task<List<T>>` means: \"I will give you **all** the items, once they are all ready.\" `IAsyncEnumerable<T>` means: \"I will give you items **one by one**, and you may wait between them.\" It is the async version of `IEnumerable<T>`, and you consume it with `await foreach`.\n\n```csharp\npublic async IAsyncEnumerable<DocumentDto> ListAsync(\n    [EnumeratorCancellation] CancellationToken ct = default)\n{\n    await foreach (var d in _db.Documents\n        .AsNoTracking()\n        .OrderBy(d => d.Id)\n        .Select(d => new DocumentDto(d.Id, d.Title))\n        .AsAsyncEnumerable()\n        .WithCancellation(ct))\n    {\n        yield return d;\n    }\n}\n```\n\nWhy it matters:\n\n- **Memory stays flat.** Only the current item (plus some buffers) lives in memory, not two million objects.\n- **Time to first byte is short.** The client starts receiving data while the server still reads the database.\n- **Cancellation works per item.** `[EnumeratorCancellation]` connects the token passed to `WithCancellation` to the iterator.\n\nIn ASP.NET Core (.NET 6+), returning `IAsyncEnumerable<T>` from an action or minimal API is serialised by System.Text.Json **as a stream**, so the response is written progressively instead of being buffered first.\n\nCosts and traps:\n\n- The database connection stays **open for the whole stream**. A slow client keeps a connection and a reader busy. Stream from a short, efficient query, not from a long transaction.\n- Once the first byte is sent, you **cannot change the status code**. An error halfway gives the client a broken response, so clients must handle partial results.\n- Calling `ToListAsync()` on the stream loses all the benefit.\n- Proxies, compression or logging middleware may buffer the response anyway. Test through the real hosting path (IIS, reverse proxy, load balancer).\n\n**ValueTask** is a different tool. `ValueTask<T>` avoids allocating a `Task` when a method **often completes synchronously** — a cache hit, or a buffered read. Its rules: await it **once**, do not await it concurrently, do not call `.Result` before it completes. If you need to do any of that, call `.AsTask()` first. For most application code, `Task` is the right default; use `ValueTask` on hot paths after measuring, or when implementing interfaces that already use it (for example `IAsyncDisposable.DisposeAsync`).\n","questions":[{"id":"Q1","kind":"technical","question":"When would you return IAsyncEnumerable<T> instead of Task<List<T>>, and when would you not?","answer":"I return IAsyncEnumerable when the result can be large and the consumer can process items one at a time. Typical cases are exports, long lists from the database, or reading lines from a big file. The benefit is that memory stays flat and the first items arrive quickly.\n\nWith Task of List, the method must load everything before returning. For a hundred rows that is fine and simpler. For two million rows it means a big memory spike and maybe large object heap allocations.\n\nBut streaming has costs. The database connection stays open while the consumer reads, so a slow consumer holds a connection. Errors in the middle are harder, because in an HTTP response the status code is already sent. And many callers just call ToList anyway, which removes the benefit.\n\nSo my rule is simple. For small or bounded results, like a paged API with fifty items, I return a list. For large or unbounded results, where the consumer really processes item by item, I use IAsyncEnumerable and pass a cancellation token, so the stream stops when the client leaves.\n","deeper":"- **Mechanics:** the compiler generates an async iterator state machine; each `MoveNextAsync` returns a `ValueTask<bool>`, which keeps per-item overhead low when items are already buffered.\n- **Cancellation:** a token passed via `WithCancellation(ct)` reaches the iterator only if the parameter has `[EnumeratorCancellation]`. Without it, the token is silently ignored.\n- **EF Core:** `AsAsyncEnumerable()` streams rows from the data reader. Using `AsNoTracking()` matters, otherwise the change tracker keeps every entity and memory grows anyway.\n- **Alternatives:**\n  - **Paging** (keyset pagination) — stateless and cache-friendly; better for UI lists.\n  - **Channels** — when producer and consumer run at different speeds and you need buffering and back-pressure.\n  - **Background export to a file** — for very large data or slow clients.\n- **When it fails:** multiple enumeration (each `await foreach` runs the query again), holding a transaction open during streaming, and hidden buffering in middleware.\n","evaluating":"Whether you understand the memory and latency benefit and the real costs (open connections, partial failure, client behaviour), and whether you choose based on result size and consumer, not fashion.\n","weak":["Saying IAsyncEnumerable is always faster than a list.","Forgetting [EnumeratorCancellation] and assuming cancellation works.","Streaming entities with change tracking on, so memory grows anyway."],"levelUp":"A senior developer uses IAsyncEnumerable correctly with cancellation. A lead or architect decides at API-design level: paging for interactive lists, streaming for bulk reads, async export for very large data — and documents the contract so clients know partial responses are possible.\n","followUp":{"question":"What is the difference between IAsyncEnumerable and a Channel?","answer":"IAsyncEnumerable is pull-based: the consumer asks for the next item, and the producer runs only when asked. There is one consumer and no buffer between them. A Channel is a queue between a producer and a consumer that run independently. It has a buffer, can be bounded for back-pressure, and can have several producers or consumers. A Channel's reader can expose ReadAllAsync as an IAsyncEnumerable, so they work well together.\n"},"qid":"D004-Q1"},{"id":"Q2","kind":"scenario","question":"Users need to export about 2 million rows to CSV from a government reporting system. The current export loads everything into memory and the server crashes. How would you design it?","answer":"The current design builds the whole file in memory, so memory grows with the data. My goal is memory that stays flat whatever the row count.\n\nFirst option: stream directly. I read rows with EF Core AsNoTracking and AsAsyncEnumerable, or with a plain SqlDataReader, and write each row as a CSV line straight into the response body. I flush every few thousand rows. Memory stays small, and the user starts downloading immediately. I pass the request token so the query stops if the user cancels.\n\nBut for 2 million rows, the download can take minutes. Load balancers, proxies and some hosting platforms have request timeouts, and an error halfway gives the user a broken file.\n\nSo for this size, I would prefer an async export. The user clicks export, we queue a job, and a background worker streams the rows into a file in storage — Blob Storage in Azure, or a file share on premises. When it is ready, the user gets a notification and a download link. This also lets us limit concurrent exports, audit who exported what, and retry safely.\n\nI would keep direct streaming for medium exports, and use the job for large ones.\n","deeper":"- **Streaming details:** write with a `StreamWriter` or `PipeWriter` over `Response.Body`, flush periodically, set `Content-Disposition`, and avoid `ToListAsync()`. A raw `SqlDataReader` with `CommandBehavior.SequentialAccess` gives the lowest overhead.\n- **Platform limits:** Azure App Service has a front-end request timeout (commonly cited as 230 seconds — verify against current docs); IIS, reverse proxies and firewalls have their own idle timeouts.\n- **Consistency:** a long read may see rows change during the export. If the business needs a consistent snapshot, consider snapshot isolation or exporting from a reporting replica.\n- **Tradeoffs:**\n  - **Direct stream** — simple, no storage; fragile for very large data and slow networks.\n  - **Async job** — robust, auditable, retryable; needs storage, cleanup of old files, and notification.\n  - **Pre-generated exports** — instant for users; may be stale.\n- **Government angle:** large exports of citizen or sensitive data need authorisation checks, audit logging, maybe approval, and expiry on download links.\n","evaluating":"Whether you can design for constant memory, recognise operational limits (timeouts, partial failure), and choose between streaming and an async job based on size — plus security and audit concerns for bulk data.\n","weak":["Increasing server memory or the app pool memory limit.","Streaming but still tracking entities or building the CSV in a StringBuilder.","Ignoring who is allowed to export the data and whether the export is audited."],"levelUp":"A senior developer streams the rows and fixes the memory problem. An architect also sets a size threshold between streaming and async export, considers timeouts and snapshot consistency, and adds authorisation, auditing and link expiry because bulk export is a data-leak risk.\n","followUp":{"question":"How would you test that the export really uses constant memory?","answer":"I would generate a large test data set, for example one million rows, and run the export while watching memory with dotnet-counters — the GC heap size should stay flat instead of growing with the row count. I would also run it with two different sizes and compare peak memory. If it grows with size, something is buffering: the query, a list somewhere, or a middleware. Then I would take a gcdump to see which objects hold the memory.\n"},"qid":"D004-Q2"},{"id":"Q3","kind":"leadership","question":"The product owner says the new streaming export is 'slower' because the full download now takes longer, even though users see data immediately. How do you explain the tradeoff?","answer":"First I would make sure we are talking about the same thing. I would ask: slower from which moment, and for which users?\n\nThen I would explain with two simple measures. Time to first byte is how quickly the user sees something happening. Total time is how long until the file is complete. Before, users waited maybe forty seconds looking at a spinner, then got the file. Now the download starts in one second, but the total may be a few seconds longer, because we write the file in small pieces.\n\nI would show real numbers from both versions, and also the reason we changed it: the old version crashed the server for large exports, which affected every user.\n\nThen I would ask what matters most for their users. If total time is the real priority, we have options — bigger write buffers, compression, or moving large exports to a background job with a notification.\n\nI would close by agreeing a target we both accept, for example: the export starts within two seconds, and total time stays within ten percent of the old version. Then we measure it.\n","deeper":"- **Translate metrics:** TTFB, total duration, peak memory and failure rate. Product owners care about user experience and reliability, not bytes.\n- **Show, don't argue:** a short side-by-side demo or a small table usually ends the debate faster than explanation.\n- **Hidden benefit:** the old design's crashes hurt all users, not just exporters — this is the business case for the change.\n- **Tradeoff options:** tune buffer and flush size; compress; async export for very large files; keep the old path for small exports if it is truly faster there.\n- **Agree measurable targets** and add them to the acceptance criteria, so the next discussion is based on data, not feeling.\n- **Avoid:** being defensive, or hiding behind technical words.\n","evaluating":"Whether you can explain a technical tradeoff in business language, listen to the real concern, use data, and reach an agreed, measurable outcome rather than \"winning\".\n","weak":["Telling the product owner they are wrong and that streaming is objectively better.","Explaining with technical terms like 'buffers' and 'LOH' without connecting them to users.","Reverting the change immediately without discussing the crash risk."],"levelUp":"A senior developer explains why the change is correct. A lead turns the disagreement into shared, measurable acceptance criteria, offers options with their costs, and makes the reliability benefit visible to the business.\n","followUp":{"question":"What if the product owner still prefers the old behaviour?","answer":"Then I would make the risk explicit and let them make an informed decision within limits. I would say: \"We can keep the old behaviour for small exports, but above a certain size it crashes the server for everyone, so for large exports we need the new design or a background job.\" Reliability for all users is not something I would trade away silently. I would document the decision and the threshold.\n"},"qid":"D004-Q3"}],"exercise":{"title":"Stream the document list and measure the difference","minutes":25,"body":"1. Seed the project database with about 200,000 fake document rows (a simple SQL script or a loop with batched inserts).\n2. Create two endpoints: one returning `await query.ToListAsync(ct)`, and one returning `IAsyncEnumerable<DocumentDto>` built with `AsNoTracking().Select(...).AsAsyncEnumerable()`.\n3. Run `dotnet-counters monitor -n <process-name> System.Runtime` while calling each endpoint with `curl -o /dev/null`. Note peak GC heap size and the time until the first byte (`curl -w \"%{time_starttransfer} %{time_total}\"`).\n4. Cancel the streaming request after one second (Ctrl+C) and confirm in logs that the query stopped.\n5. Write three lines in your notes: memory difference, time-to-first-byte difference, total-time difference.\n"},"english":{"task":"Explain Q3 aloud to an imaginary product owner in 60–90 seconds without using any of these words: buffer, heap, allocation, IAsyncEnumerable. Record it. If you used one, record again.\n","phrases":["Just to make sure we're talking about the same thing — do you mean…?","There are two different measures here:…","The tradeoff is: users see data sooner, but the full file takes slightly longer.","The reason we changed it is that the old version…","We have a few options, each with a cost:…","Can we agree on a target and measure it?"]},"checkpoint":"You have measured numbers showing the streaming endpoint keeps peak memory clearly lower than the buffered one for 200,000 rows, cancellation stops the query, and you can explain TTFB vs total time to a non-technical person in under 90 seconds.\n","project":{"milestone":"Document list endpoint streams results with IAsyncEnumerable, AsNoTracking and cancellation; a short note in the repo records memory and timing before and after.","evidence":"In an interview you can say: 'I changed our list endpoint to streaming and measured it — peak memory went from [X] MB to [Y] MB for 200,000 rows' — using your own measured numbers."},"references":[{"title":"Tutorial: Generate and consume async streams (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/generate-consume-asynchronous-stream"},{"title":"Understanding the Whys, Whats, and Whens of ValueTask (.NET Blog)","url":"https://devblogs.microsoft.com/dotnet/understanding-the-whys-whats-and-whens-of-valuetask/"},{"title":"Efficient querying — EF Core (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/ef/core/performance/efficient-querying"},{"title":"dotnet-counters (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/core/diagnostics/dotnet-counters"}],"id":"D004"},{"day":5,"type":"learn","full":true,"title":"Concurrency, thread safety and Channels","objective":"Choose the right synchronisation tool (lock, SemaphoreSlim, Interlocked, concurrent collections, Channels, Parallel.ForEachAsync) and explain why in-process locks do not solve races across servers.","task":"Project: build a bounded Channel<T>-based in-process ingestion queue with a BackgroundService consumer and limited parallelism.","topics":["csharp","distributed"],"roles":["lead","architect"],"difficulty":2,"explanation":"A **race condition** happens when the result depends on the timing of threads. The classic example is read-modify-write: two requests read `counter = 41`, both write `42`. Thread safety means shared state stays correct no matter how the threads interleave.\n\nThe first question is always: **do we need shared mutable state at all?** Immutable data, local variables and per-request objects need no locks. When sharing is necessary, choose the smallest tool that works:\n\n- **`lock`** — mutual exclusion for short, synchronous critical sections. You **cannot `await` inside a `lock`** (the compiler rejects it). .NET 9 added a dedicated `System.Threading.Lock` type that the `lock` statement recognises.\n- **`SemaphoreSlim`** — `await WaitAsync()` makes it the async-friendly lock, and with a count above 1 it **limits concurrency** (for example, at most 4 calls to a slow API). Always release in `finally`.\n- **`Interlocked`** — atomic operations on a single value (`Increment`, `CompareExchange`). Fast, but only for one variable.\n- **Concurrent collections** — `ConcurrentDictionary`, `ConcurrentQueue`. Each operation is safe, but a **sequence** of operations is not atomic. `GetOrAdd(key, factory)` may run the factory more than once under contention; wrap the value in `Lazy<T>` if creation is expensive.\n- **`Channel<T>`** — an async producer/consumer queue. A **bounded** channel gives **back-pressure**: when it is full, writers wait instead of using unlimited memory.\n- **`Parallel.ForEachAsync`** (.NET 6+) — processes a collection with a maximum degree of parallelism and async bodies.\n\n```csharp\nvar channel = Channel.CreateBounded<int>(new BoundedChannelOptions(100)\n{\n    FullMode = BoundedChannelFullMode.Wait\n});\n\n// producer (e.g. upload endpoint)\nawait channel.Writer.WriteAsync(documentId, ct);\n\n// consumer (e.g. BackgroundService)\nawait foreach (var id in channel.Reader.ReadAllAsync(stoppingToken))\n    await ProcessAsync(id, stoppingToken);\n```\n\nThe most important limit: **all of these work inside one process only.** With two IIS servers behind a load balancer, a web garden, or two container instances, a C# `lock` protects nothing across them. Races across processes need the **database** (unique constraints, `SEQUENCE`, optimistic concurrency with `rowversion`, `sp_getapplock`) or a distributed lock. And an in-memory Channel loses its items on restart — fine for a first version, but not durable. Durable queues come later in the project (outbox and a message broker).\n","questions":[{"id":"Q1","kind":"technical","question":"When would you use lock, SemaphoreSlim, Interlocked or a concurrent collection in .NET?","answer":"I choose based on what I protect and whether there is async code inside.\n\nFor a single number, like a counter, I use Interlocked. It is atomic and very fast, and I don't need a lock.\n\nFor a short synchronous section that updates several fields together, I use lock. It is simple and cheap. But I cannot await inside a lock, and I keep the section very short.\n\nIf the critical section contains await, for example refreshing a token from an HTTP call, I use SemaphoreSlim with WaitAsync, and release it in a finally block. SemaphoreSlim is also my tool for limiting concurrency — for example, maximum five parallel calls to a slow external service.\n\nFor shared dictionaries or queues, I use concurrent collections. But I remember that only single operations are atomic. If I check and then add, that is still a race, so I use methods like GetOrAdd or AddOrUpdate.\n\nAnd before any of these, I ask if I need shared state at all. Often the best fix is to avoid sharing. Also, all these tools work in one process only. Across servers, I need the database or a distributed lock.\n","deeper":"- **Lock cost:** an uncontended lock is very cheap; contention is what hurts. Keep critical sections small and never call I/O inside them.\n- **Deadlocks:** two locks taken in different orders can deadlock. Use one lock, or a fixed order.\n- **SemaphoreSlim traps:** forgetting `Release` in `finally` leaks a slot forever; releasing more times than acquired throws (if a max count is set) or silently raises capacity. It is not re-entrant.\n- **ConcurrentDictionary:** `GetOrAdd` with a factory can call the factory concurrently; use `Lazy<T>` values for expensive creation. Enumeration is safe but is not a snapshot.\n- **ReaderWriterLockSlim:** useful for read-heavy data with rare writes, but more complex; for read-mostly lookups, replacing an immutable or `FrozenDictionary` snapshot atomically is often simpler.\n- **Alternatives to locking:** immutability, message passing with Channels (one consumer owns the state), and database constraints.\n","evaluating":"Whether you can match the tool to the problem, know the async limitation of lock, understand that concurrent collections do not make multi-step logic atomic, and recognise the single-process boundary.\n","weak":["Using lock around everything, including database or HTTP calls.","Believing ConcurrentDictionary makes any code that uses it thread-safe.","Not knowing that you cannot await inside a lock."],"levelUp":"A senior developer picks the correct primitive. A lead or architect first questions the shared state, prefers designs that avoid locking (ownership, immutability, database guarantees), and immediately asks how many instances the code runs on.\n","followUp":{"question":"Why can't you use await inside a lock statement?","answer":"Because a lock, which uses Monitor, is owned by a thread, and it must be released by the same thread. After an await, the continuation may run on a different thread, so releasing would fail or be wrong. Also, holding a lock while waiting for I/O blocks everyone else for a long time. That is why the compiler stops you. If I need mutual exclusion around async code, I use SemaphoreSlim with a count of one and WaitAsync.\n"},"qid":"D005-Q1"},{"id":"Q2","kind":"scenario","question":"In production, two citizens sometimes receive the same application reference number, and when the cache expires the database gets a sudden spike of identical queries. How would you investigate and fix both problems?","answer":"Both problems look like races that do not appear in development, because there we have one user and one server.\n\nFor the duplicate numbers, I would check how the number is generated. My guess is read-modify-write: read the max number, add one, save. Two requests do it at the same time and get the same number. If the developer added a C# lock, it still fails because we run on several servers. The fix belongs in the database. I would use a SQL Server sequence, or an identity column, to generate the number, and add a unique constraint so a duplicate can never be saved. Then I would find and correct the existing duplicates with the business.\n\nFor the cache spike, this is a cache stampede. When a popular entry expires, many requests miss at the same moment and all run the same query. Inside one server, I can make only one request rebuild the entry while the others wait — HybridCache in modern .NET does this for us. Across servers, I would add a small random jitter to expiry times, or refresh popular entries in the background before they expire.\n\nFinally I would add a load test that sends concurrent requests, so the race is reproducible.\n","deeper":"- **Evidence:** query the duplicates with timestamps — they will be created milliseconds apart, often on different servers. For the stampede, correlate cache-expiry times with database spikes in metrics.\n- **Duplicate fix options:**\n  - **SEQUENCE / IDENTITY** — atomic and simple; numbers may have gaps (rolled-back transactions, cached sequence values), so confirm the business accepts gaps.\n  - **Unique constraint + retry** — a safety net that turns a silent bug into a visible, handled error.\n  - **sp_getapplock or a distributed lock** — works, but adds contention and failure modes; use only when the logic cannot move into the database.\n  - **Formatted numbers** (for example `APP-2026-000123`) — generate the numeric part with a sequence and format in code.\n- **Stampede fix options:** single-flight per key (HybridCache or `Lazy<Task<T>>` in a ConcurrentDictionary), expiry jitter, background refresh, serving stale data briefly while refreshing.\n- **When it fails:** an in-process `lock` or `SemaphoreSlim` in a multi-server or web-garden deployment; a \"check then insert\" without a constraint.\n","evaluating":"Whether you understand that production races come from concurrency across requests and servers, put correctness guarantees in the right layer (the database), and know the stampede pattern and its standard mitigations.\n","weak":["Adding a C# lock around the number generation and calling it fixed.","Generating reference numbers with random values or timestamps without a uniqueness guarantee.","Only increasing cache duration, which makes the stampede rarer but bigger."],"levelUp":"A senior developer fixes the generation code and adds single-flight caching. An architect states the principle — uniqueness is guaranteed by the database, not by application code — checks the deployment topology, handles the data already affected with the business, and adds a concurrency test so the class of bug cannot return.\n","followUp":{"question":"The business says reference numbers must have no gaps. Does that change your design?","answer":"Yes, a lot. Sequences and identity columns can have gaps, for example after a rollback. Gap-free numbering needs serialisation: one transaction at a time takes the next number, usually with a counter row that is locked and updated inside the same transaction as the insert. That limits throughput. I would first ask why gaps matter — often it is an audit or legal rule. If it is truly required, I accept the cost; if not, I explain the tradeoff and use a sequence.\n"},"qid":"D005-Q2"},{"id":"Q3","kind":"leadership","question":"Just before a release, you find a race condition in a pull request written by a respected senior colleague. The release date is fixed. What do you do?","answer":"My approach is to treat it as a risk to the release, not as a personal issue.\n\nFirst I would make sure I am right. I would write a small test or a clear step-by-step timeline that shows the race. Then I would talk to my colleague directly and privately, not with a public comment that surprises them. I would say something like: \"I think I found a timing problem here — can you check my reasoning?\" A senior person often sees things I missed, so I keep it a question.\n\nIf we agree it is a real bug, we look at the risk together. How likely is it in production, and what is the impact? A wrong reference number for citizens is serious. A slightly wrong counter on a dashboard is not.\n\nThen we choose. If the fix is small and safe, we fix it with a test before release. If it is big, options are disabling the feature with a flag, releasing without it, or releasing with a documented known issue and a fast follow-up.\n\nFinally, I would inform the release owner with the facts and our recommendation, and give my colleague credit for the quick fix.\n","deeper":"- **Order of actions:** verify → private conversation → shared risk assessment → decision with the release owner → follow-up and learning.\n- **Decision options and tradeoffs:**\n  - **Fix now** — best if small and testable; risk of a rushed change.\n  - **Feature flag off** — keeps the release date; needs the flag to exist or be cheap to add.\n  - **Delay** — correct for high-impact data-integrity bugs; costs trust with stakeholders if communicated late.\n  - **Release with known issue** — only for low impact, with monitoring and a dated follow-up.\n- **Respect without avoidance:** seniority does not remove the bug. Avoiding the conversation to protect feelings shifts the risk to users.\n- **Systemic follow-up:** add concurrency scenarios to the review checklist, a concurrent integration test pattern, and possibly a rule that critical-path PRs get two reviewers.\n","evaluating":"Courage combined with respect: whether you raise a real risk even with a senior person, verify before accusing, decide by impact, involve the right decision-maker, and improve the process afterwards.\n","weak":["Staying silent because the colleague is more senior.","Blocking the release without assessing likelihood and impact.","Fixing the code yourself quietly without telling the author or the release owner."],"levelUp":"A senior developer spots and reports the bug. A tech lead manages the whole situation: verifies, keeps the relationship strong, frames the release decision by business impact, gives the decision-maker clear options, and turns the incident into a team practice.\n","followUp":{"question":"Your colleague disagrees and says the race 'will never happen in practice'. What then?","answer":"I would move from opinion to evidence. I would run a quick concurrent test — for example fifty parallel requests — and see if it reproduces. If it does, the discussion ends naturally. If it does not, I would check the production traffic and the number of servers to estimate the likelihood. If we still disagree and the impact is high, I would bring both views to the release owner and let them decide with full information.\n"},"qid":"D005-Q3"}],"exercise":{"title":"Bounded Channel ingestion queue with limited parallelism","minutes":25,"body":"1. Create an `IngestionQueue` singleton wrapping a bounded channel (capacity 100, `FullMode = Wait`), with `EnqueueAsync(Guid documentId, CancellationToken ct)` and `ReadAllAsync(CancellationToken ct)`.\n2. Create a `BackgroundService` that reads from the queue and processes up to 3 documents in parallel:\n\n```csharp\nprotected override Task ExecuteAsync(CancellationToken stoppingToken) =>\n    Parallel.ForEachAsync(\n        _queue.ReadAllAsync(stoppingToken),\n        new ParallelOptions { MaxDegreeOfParallelism = 3, CancellationToken = stoppingToken },\n        async (id, ct) => await ProcessSafelyAsync(id, ct));\n```\n\n3. In `ProcessSafelyAsync`, create a DI scope (`IServiceScopeFactory`) per document, catch and log exceptions per item so one bad document does not stop the worker.\n4. Make the upload endpoint call `EnqueueAsync` after saving the document, passing the request token.\n5. Write a test that enqueues 10 items and asserts that no more than 3 are processed at the same time (use `Interlocked.Increment`/`Decrement` on a counter and record the maximum).\n6. Add a line to the README: \"In-memory queue: items are lost on restart — accepted for v1, durable queue planned.\"\n"},"english":{"task":"Tell the Q3 answer aloud as a short story in 90 seconds: situation, what you checked, the conversation, the decision, the follow-up. Practise one sentence that raises the problem politely and one that states the release risk clearly. Record twice.\n","phrases":["I might be wrong, but I think there's a timing issue here — can you check my reasoning?","Here is how it can happen, step by step:…","The impact if this happens in production is…","We have three options:…, and I'd recommend… because…","I'm not sure how likely it is, so let's test it rather than guess."]},"checkpoint":"Your worker processes items from a bounded channel with at most 3 in parallel, a test proves the parallelism limit, a failing item does not stop the worker, and you can explain aloud in under 90 seconds why a C# lock cannot prevent duplicate reference numbers on two servers.\n","project":{"milestone":"Upload endpoint enqueues document IDs into a bounded Channel<T>; a BackgroundService processes them with limited parallelism, scoped DI per item, per-item error handling and a documented durability limitation.","evidence":"In an interview you can say: 'I built the ingestion pipeline with back-pressure using a bounded channel and limited parallelism, and I documented why it is not durable yet and what replaces it.'"},"references":[{"title":"Channels — System.Threading.Channels (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/core/extensions/channels"},{"title":"Thread-safe collections (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/standard/collections/thread-safe/"},{"title":"Overview of synchronization primitives (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/standard/threading/overview-of-synchronization-primitives"},{"title":"An Introduction to System.Threading.Channels (.NET Blog)","url":"https://devblogs.microsoft.com/dotnet/an-introduction-to-system-threading-channels/"},{"title":"HybridCache library in ASP.NET Core (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/aspnet/core/performance/caching/hybrid"}],"id":"D005"},{"day":6,"type":"crosstrack","full":true,"title":"Project kickoff: vision, scope, solution structure and ADR-001","objective":"Define the vision and MVP scope of the Research and Benchmarking Assistant, choose a solution structure you can defend, and record the decision in your first ADR.","task":"Project: create the .NET 10 solution skeleton, a README with vision, scope and non-goals, and ADR-001 explaining the chosen solution structure.","topics":["architecture","leadership","ai"],"roles":["lead","architect","ai"],"difficulty":2,"explanation":"Today is a crosstrack day. You leave runtime details for one session and practise what tech leads and architects do at the **start** of a project: make the goal clear, cut the scope, choose a structure, and write down why.\n\nA good kickoff produces four small artifacts, not a big document:\n\n1. **Vision** — one paragraph: who the users are, what problem they have, what \"better\" looks like. For our project: analysts at an R&D centre spend hours searching old benchmarking reports and indices; they need fast answers with a link to the exact source.\n2. **Scope and non-goals** — what v1 does, and what it explicitly does not do. Non-goals protect the team from silent scope growth.\n3. **Quality attributes** — the few that drive the design. Here: correctness of citations, document-level security, operability on-premises or in Azure, and simplicity for a small team.\n4. **First decisions as ADRs** — short records: context, decision, alternatives, consequences.\n\n**Solution structure options** for a new .NET system:\n\n- **Layered / clean architecture** (Api, Application, Domain, Infrastructure projects): clear dependency direction and familiar to enterprise teams. Risk: many projects and mapping code before you have real behaviour; a small feature touches four projects.\n- **Vertical slices** (code grouped by feature: `Features/Documents/Upload`): each change lives in one place; low ceremony. Risk: shared logic gets duplicated if nobody watches it.\n- **Modular monolith** (modules with explicit boundaries, one deployable): good when the domain has clear sub-areas. Risk: boundaries chosen too early are often wrong.\n\nFor a new product with an unclear domain, a common pragmatic choice is **one deployable, feature folders inside, a small core project for domain types, and tests from day one**. You keep the option to extract modules later (Phase 4) when the boundaries are proven by real code.\n\nAn **ADR** (Architecture Decision Record) is short — often one page. Its value is not the format. Its value is that six months later, a new team member can see what you knew, what you rejected and when to revisit the decision. Mark ADRs as Proposed, Accepted or Superseded; never edit history, write a new ADR instead.\n\nThe AI part of this product follows the same rule: **start with the simplest thing that gives value** — search plus answers with citations — and add agent behaviour only when evidence shows you need it.\n","questions":[{"id":"Q1","kind":"technical","question":"You are starting a new .NET solution. How do you decide between a layered or clean architecture, vertical slices, and a modular structure?","answer":"I decide based on three things: how clear the domain is, how big the team is, and how the system will grow.\n\nIf the domain is still unclear, which is normal at the start, I prefer a simple structure: one deployable API, code grouped by feature, and a small core project for domain types. Feature folders keep each change in one place, so the team moves fast and the code shows what the system actually does.\n\nClassic clean architecture, with separate Api, Application, Domain and Infrastructure projects, gives a clear dependency direction. That helps in large teams and long-lived enterprise systems. But at the start it often creates a lot of ceremony — interfaces and mapping code with almost no behaviour behind them.\n\nA modular monolith makes sense when I can already see stable sub-areas, for example documents, search and identity. I would not guess those boundaries on day one. I would let them appear from real code and then enforce them with architecture tests.\n\nWhatever I choose, I write it in an ADR, with the conditions that would make us change it. That makes the structure a decision, not an accident.\n","deeper":"- These options are not exclusive. Many teams use vertical slices **inside** the modules of a modular monolith, and keep a clean dependency direction (domain does not reference infrastructure) everywhere.\n- Signals for clean/layered: many developers, strict separation required by the organisation, long maintenance horizon, rich domain rules that deserve isolation.\n- Signals for vertical slices: CRUD-heavy features, fast iteration, small team, features that change independently.\n- Signals for a modular monolith: clear bounded contexts, several teams, a future need to extract a service without a rewrite.\n- When it fails: premature project explosion (10 projects for 3 endpoints), \"Common\" or \"Shared\" projects that become a dumping ground, and boundaries drawn by technical layer instead of business capability.\n- Enforcement matters more than diagrams: project references, `internal` visibility, and architecture tests (for example NetArchTest or ArchUnitNET) keep the structure honest.\n","evaluating":"Whether you choose structure from context instead of habit, know the costs of each option, and can explain how the structure will evolve. Architects listen for \"it depends on…\" followed by concrete criteria, not a favourite template.\n","weak":["Always using the same four-project clean architecture template regardless of size or domain.","Saying 'microservices' for a new product with a small team and unclear domain.","Describing folders and project names without explaining dependency direction or why."],"levelUp":"A senior developer describes a structure they like and explains its layers. A lead or architect starts from team size, domain clarity and change patterns, picks the simplest option that fits, records it in an ADR with a \"revisit when\" condition, and shows how boundaries will be enforced and evolved.\n","followUp":{"question":"How would you stop a 'Shared' or 'Common' project from becoming a dumping ground?","answer":"I keep it very small and give it a clear rule: only code that has no business meaning and is used by at least two features, like a Result type or a clock abstraction. Business logic stays inside its feature. In code review we ask \"who owns this?\" for anything added there. If something grows, we move it to the feature that uses it most. An architecture test can also limit what Shared is allowed to reference.\n"},"qid":"D006-Q1"},{"id":"Q2","kind":"scenario","question":"Stakeholders want an 'AI research assistant' that answers questions over hundreds of uploaded benchmarking reports. Sketch version 1. Would you start with agents?","answer":"No. For version 1, I would build search plus answers with citations, and no agents.\n\nThe flow is simple. Users upload reports. A background worker extracts text, splits it into chunks, and indexes them with metadata like report name, year, page and who can access it. When a user asks a question, we retrieve the most relevant chunks the user is allowed to see, send them to the model, and return a short answer where every claim links to the page it came from. If the sources do not contain the answer, the system says so.\n\nWhy not agents? Because this design is predictable, cheap and easy to test. We can measure retrieval quality, check every citation, and explain the behaviour to auditors. An agent adds multi-step planning, tool calls, more cost, more latency and more ways to fail, before we know if users even need it.\n\nI would add agent behaviour only with evidence. For example, our evaluation set shows a class of questions, like multi-report comparisons, that single-shot retrieval keeps failing, and logs show users manually chaining several questions to get one result. Even then, I would try a fixed workflow first.\n","deeper":"- v1 components: upload + parsing, chunking, embeddings and/or keyword index, **permission-trimmed** retrieval, grounded prompt, citation rendering, \"I don't know\" behaviour, logging of question, retrieved chunks and answer.\n- Start even simpler if possible: good keyword search over well-parsed reports may already give most of the value. Hybrid search can come next.\n- Evidence that could justify agent behaviour later:\n  - A measured failure rate on an evaluation set for multi-step questions (compare indicators across years and reports).\n  - Usage logs showing repeated manual chains of questions to answer one need.\n  - Steps that cannot be fixed in advance — the path depends on what is found.\n  - Foundations already in place: eval harness, audit trail, tool allow-lists, cost and latency budgets.\n- Order of escalation: better retrieval → deterministic workflow (plan → retrieve → compare) → single agent with limited tools → multi-agent only with a clear reason.\n- Government angle: deterministic behaviour is easier to audit and approve; on-premises model hosting may limit which models are available.\n","evaluating":"Judgement, not hype. The interviewer wants to see that you can deliver value quickly with a simple, testable design, that you treat security and citations as first-class, and that you know what evidence would justify more complexity.\n","weak":["Starting with a multi-agent design because it sounds modern.","Ignoring document permissions — retrieving chunks the user is not allowed to see.","Saying 'we will add agents later' without naming what evidence or measurement would trigger it."],"levelUp":"A senior developer describes a working RAG pipeline. A lead or architect frames v1 around user value and risk, names the quality attributes (citation accuracy, permission safety, cost), defines how quality will be measured, and sets explicit, evidence-based criteria for moving to workflows or agents.\n","followUp":{"question":"How would you know version 1 is good enough to release to analysts?","answer":"I would build a small evaluation set with the analysts — say 30 to 50 real questions with the expected source pages. We measure whether the right page is in the top results, and whether answers cite correctly. We also run a permission test: a user without access must never see content from a restricted report. Then a short pilot with a few analysts, and we collect feedback on every wrong or unhelpful answer.\n"},"qid":"D006-Q2"},{"id":"Q3","kind":"leadership","question":"At kickoff, stakeholders bring a long wish-list for the first release. How do you scope the MVP with them?","answer":"My approach is to move the conversation from features to outcomes.\n\nFirst, I ask: what decision or task should be faster or better after the first release? Who is the first user group? For example, \"analysts can find the source for a benchmark figure in minutes instead of hours.\" That becomes the MVP goal.\n\nThen I take the wish-list and sort it with the stakeholders, not alone. For each item I ask: is it needed to reach the goal for the first users? If not, it goes to \"later\", not \"never\". I also make the non-goals explicit and write them in the scope document, because what we say no to is as important as what we say yes to.\n\nI add the things stakeholders often forget but we cannot skip — security, audit, and how we measure success.\n\nFinally, I agree a short timeline and a demo date. A working demo after a few weeks builds more trust than a big plan. If priorities change, we change the scope openly, and we say what moves out when something moves in.\n","deeper":"- Useful tools: an impact or outcome statement, MoSCoW (Must/Should/Could/Won't this time), a user story map with a horizontal \"release 1\" line, and a written non-goals list.\n- Trade-off: a very small MVP risks looking unimpressive to senior sponsors; a large one risks never shipping. Aim for a thin end-to-end slice that is useful to one real group.\n- Make constraints visible early: data classification, hosting (on-premises vs Azure), approval processes, and availability of real documents for testing.\n- When it fails: scope agreed only verbally; \"MVP\" used as a label for a full product; no owner who can make priority decisions.\n- Change control: keep a visible backlog; any new must-have needs something to move out or the date to move — say this calmly, with the trade-off.\n","evaluating":"Stakeholder management, ability to say no constructively, and focus on outcomes. They also check that you include non-functional needs and that you build trust through early delivery rather than promises.\n","weak":["Accepting the full wish-list and promising a date to please stakeholders.","Refusing items without explanation or alternatives.","Scoping only features and forgetting security, data access and success measures."],"levelUp":"A senior developer estimates the listed features and flags the ones that are hard. A lead or architect reframes the list around an outcome, agrees non-goals in writing, protects non-functional needs, and sets up a visible process for scope change so trade-offs are made openly.\n","followUp":{"question":"A senior sponsor insists that an 'AI agent that writes full reports' must be in the first release. What do you say?","answer":"I would respect the goal behind it — they want to save analyst time on reports. I would explain that full report writing depends on reliable search and citations first; without them, the reports cannot be trusted. Then I offer a path: release 1 gives cited answers, release 2 drafts one report section with human review. I would show a demo early, so the sponsor sees real progress toward their goal.\n"},"qid":"D006-Q3"}],"exercise":{"title":"Create the solution skeleton, README and ADR-001","minutes":25,"body":"1. Create the solution with the .NET 10 SDK. Proposed structure:\n\n```\nResearchAssistant/\n  README.md                         vision, scope, non-goals, how to run\n  Directory.Build.props             nullable enabled, warnings as errors (start with analyzers as warnings)\n  docs/\n    adr/0001-solution-structure.md\n  src/\n    ResearchAssistant.Api/          ASP.NET Core host, DI composition, auth (later)\n      Features/\n        Documents/                  UploadDocument.cs, ListDocuments.cs\n        Search/                     placeholder for Phase 9\n      Ingestion/                    IngestionQueue.cs (Channel), IngestionWorker.cs (BackgroundService)\n      Infrastructure/               AppDbContext.cs, FileStorage.cs\n    ResearchAssistant.Core/         Document, DocumentStatus, Chunk (no ASP.NET or EF references)\n  tests/\n    ResearchAssistant.UnitTests/\n    ResearchAssistant.IntegrationTests/\n```\n\n2. Write the README in about 15 lines: vision (one paragraph), first users, MVP scope (upload, list, search with cited answers later), **non-goals** (no agents, no external sources, no multi-tenant in v1), quality attributes (citation accuracy, document-level permissions, runs on-premises or in Azure).\n3. Write ADR-001 using this template:\n\n```\n# ADR-001: Solution structure\nStatus: Proposed | Accepted | Superseded by ADR-00X\nDate: YYYY-MM-DD\n\n## Context\nWhat we know now: team size, domain clarity, hosting constraints.\n\n## Decision\nOne deployable API with feature folders, a Core project for domain types,\ntests from day one.\n\n## Alternatives considered\n- Clean architecture (4 projects): rejected for now because...\n- Modular monolith: deferred until boundaries are proven because...\n\n## Consequences\nPositive: ...\nNegative / risks: ...\n\n## Revisit when\ne.g. a second team joins, or a module needs independent deployment.\n```\n\n4. Check that `Core` has no reference to `Api` or EF Core, and that `dotnet build` and `dotnet test` succeed.\n"},"english":{"task":"Present the project in 60 seconds as if to an interviewer: vision, first users, what v1 does, what it does not do, and why. Record it, check that you said at least one non-goal and one trade-off, and record again.\n","phrases":["The goal of the first release is…","To keep the scope small, we decided not to… in version 1.","We chose this structure because…, and we will revisit it when…","Before adding more complexity, I would want evidence that…","Could you tell me more about who the first users are?"]},"checkpoint":"The repo builds and tests run; the README states vision, scope and at least three non-goals; ADR-001 lists two rejected alternatives and a \"revisit when\" condition. You can explain in under 90 seconds why v1 uses search plus citations and not agents, including two pieces of evidence that would change your mind.\n","project":{"milestone":"Solution skeleton for the Research and Benchmarking Assistant with README (vision, scope, non-goals) and ADR-001 (solution structure).","evidence":"In an interview you can say: 'I started the project by writing the vision, non-goals and the first ADR. I deliberately chose a simple structure and a non-agent v1, and I wrote down the evidence that would justify changing that.' Show the README and ADR."},"references":[{"title":"Common web application architectures (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/architecture/modern-web-apps-azure/common-web-application-architectures"},{"title":"Architecture decision record (Azure Well-Architected Framework)","url":"https://learn.microsoft.com/en-us/azure/well-architected/architect-role/architecture-decision-record"},{"title":"Documenting Architecture Decisions (Michael Nygard)","url":"https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions"},{"title":"MonolithFirst (Martin Fowler)","url":"https://martinfowler.com/bliki/MonolithFirst.html"},{"title":"Retrieval Augmented Generation in Azure AI Search (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview"}],"id":"D006"},{"day":7,"type":"review","full":true,"title":"Week 1 review and mock interview #1","objective":"Retrieve and connect week 1 topics — the answer framework, async/await and deadlocks, cancellation and timeouts, IAsyncEnumerable and ValueTask, concurrency and Channels, and project kickoff with MVP scoping — and answer them under light time pressure.","task":"Time budget: 35–45 minutes. (1) Recall, 12 min: answer the 8 recall questions aloud before revealing each answer; mark each one green (clear), amber (partly) or red (missed). (2) Mock, 15 min: set a timer and answer the 4 mock questions aloud, about 90 seconds each, recording yourself; then compare with the \"look for\" bullets. (3) Reflection, 8 min: write short answers to the reflection prompts and list your red items for re-study next week. (4) English, 5 min: the clarification-and-structure task below.\n","topics":["review","csharp","architecture"],"roles":["lead","architect"],"difficulty":2,"recall":[{"question":"What are the parts of the 90-second answer structure, and why does it help in an interview?","answer":"Direct answer first, then how it works or what I would do, then the tradeoff, then a short close. It helps because the interviewer hears the conclusion in the first 10 seconds, and the tradeoff shows judgement. It also keeps me from rambling when I search for words in English.\n"},{"question":"Why does blocking on an async call deadlock classic ASP.NET but usually not ASP.NET Core — and why is it still wrong in Core?","answer":"Classic ASP.NET has a request SynchronizationContext that allows one thread at a time; the blocked thread holds it, and the continuation waits for it forever. ASP.NET Core has no SynchronizationContext, so the continuation runs on any pool thread. But the blocking call still holds a thread, and under load this causes thread-pool starvation: queued requests and rising latency.\n"},{"question":"How do you combine the request's cancellation with your own timeout for a downstream call?","answer":"Create a linked source with `CancellationTokenSource.CreateLinkedTokenSource(requestAborted)`, call `CancelAfter(timeout)` on it, and pass its token down. The operation stops when either the client disconnects or the timeout fires. Dispose the linked source (a `using` statement) so its registration on the parent token is released.\n"},{"question":"What is a timeout budget, and what goes wrong without one?","answer":"A timeout budget means the total time for a request is split across its downstream calls, and each inner timeout is shorter than the outer one. Without it, an inner call can wait longer than the caller is willing to wait, so work continues after the caller has already given up. Combined with retries, this multiplies load on a struggling dependency.\n"},{"question":"When does returning IAsyncEnumerable<T> beat returning a List<T>, and when does it not?","answer":"It wins for large or slow sequences: items are produced and consumed one by one, so memory stays flat and time-to-first-item is short. It is a poor fit when the caller needs the full set anyway (sorting, counting, transactions over all items) or the set is small. Also, an open stream keeps the database connection open for the whole enumeration.\n"},{"question":"What are the usage rules of ValueTask, and when is it worth it?","answer":"Await a ValueTask only once, do not await it concurrently, and do not read `.Result` before it completes; if you need those, call `.AsTask()`. It is worth it on hot paths that usually complete synchronously, such as a cache hit, where avoiding a Task allocation shows in profiling. For normal application code, Task is simpler and safer.\n"},{"question":"Why can't you use lock around an await, and what do you use instead?","answer":"The compiler forbids `await` inside a `lock` body, because the continuation may run on a different thread and Monitor locks are thread-affine. For async code, use `SemaphoreSlim(1, 1)` with `await WaitAsync(ct)` and release in `finally`. For simple counters, `Interlocked` is cheaper than any lock.\n"},{"question":"What does a bounded Channel give you that an unbounded one does not, and what did ADR-001 decide for the project?","answer":"A bounded Channel applies back-pressure: when it is full, writers wait (or items are dropped, depending on the full mode), so memory cannot grow without limit. An unbounded channel hides a slow consumer until memory runs out. ADR-001 recorded the solution structure for the assistant; you should be able to state its context, decision, one rejected alternative and one consequence from memory.\n"}],"mock":{"minutes":15,"questions":[{"kind":"technical","question":"Walk me through how a cancellation from the browser reaches a SQL query in an ASP.NET Core endpoint. Where can the chain break?","lookFor":"- Starts with `HttpContext.RequestAborted` (or the `CancellationToken` parameter bound by the framework).\n- Token passed through every layer to EF Core / ADO.NET async methods, which cancel the command on the server.\n- Breaks: a method that does not accept a token, `CancellationToken.None` in a library, a sync call, or `Task.Run` without the token.\n- Mentions handling `OperationCanceledException` quietly (not logged as an error, not a 500).\n- Tradeoff: some work should not be cancelled mid-way (e.g. a write that must complete); uses a separate token or a short grace period there.\n"},{"kind":"scenario","question":"Your in-process ingestion queue works in testing, but in production memory climbs during peak upload hours and some documents are processed twice after a restart. What is going on and what do you change?","lookFor":"- Hypothesis: unbounded queue with a consumer slower than producers; in-memory queue loses or replays work on restart.\n- Evidence: queue length metric, memory counters, logs of the same document ID processed twice.\n- Fix now: bounded Channel with `BoundedChannelFullMode.Wait`, controlled consumer parallelism, idempotent processing (status check or unique key).\n- Honest limit: an in-process queue is not durable; names a durable queue or DB-backed job table as the next step, with when it is justified.\n- Clear structure: symptom → hypothesis → evidence → fix → prevention.\n"},{"kind":"technical","question":"A teammate wants to call 500 external APIs in parallel using Task.WhenAll over a Select. Is that a good idea? What would you suggest?","lookFor":"- Explains the risk: unbounded concurrency floods the downstream service, sockets and rate limits; one failure surfaces only the first exception.\n- Suggests `Parallel.ForEachAsync` with `MaxDegreeOfParallelism`, or a `SemaphoreSlim` throttle, or a Channel with N consumers.\n- Passes a cancellation token and a per-call timeout.\n- Collects partial failures instead of failing the whole batch, if the business accepts it.\n- Asks a clarifying question: downstream rate limits, ordering needs, acceptable total time.\n"},{"kind":"leadership","question":"A director asks for an 'AI assistant over all our reports' in six weeks. How do you scope the first version with them?","lookFor":"- Asks clarifying questions first: who are the users, which reports, top 5 questions they need answered, access rules.\n- Proposes a small v1: search over uploaded reports with cited answers; no agents, no automation of decisions.\n- Explains why simple first: lower risk, testable, earns trust, measurable.\n- Defines success measures and explicit out-of-scope items, written down and agreed.\n- Names the main risks (data permissions, document quality) and how v1 handles them.\n"}]},"reflection":["Which recall question did you mark red, and what exactly was missing: the mechanism, the tradeoff, or the English words?","In the mock, did you give the direct answer in your first two sentences each time? Where did you start with background instead?","Which concept from this week could you use tomorrow in your real work (for example a .Result in a legacy controller or a missing cancellation token)? Write the file or area.","What is one question you would ask the interviewer before answering the 500-API question, and why does it change your answer?"],"english":{"task":"Pick mock question 3 or 4. First, ask two clarifying questions aloud (as if to the interviewer). Then answer in 90 seconds using a spoken signpost for each part: \"First…\", \"The main tradeoff is…\", \"So, to summarise…\". Record once, then re-record and cut any sentence longer than about 15 words.\n","phrases":["Before I answer, can I check one thing: …?","Just to make sure I understand — do you mean … or …?","Are there any constraints I should know about, like … ?","I'll answer in three parts: …, …, and …","Let me start with the short answer, then explain the reasoning.","So, to summarise: …"]},"checkpoint":"At least 6 of 8 recall questions marked green; all 4 mock answers recorded, each under 2 minutes, each starting with a direct answer and naming at least one tradeoff; red items written into next week's re-study list; and you asked at least two clarifying questions aloud before answering in the English task.\n","id":"D007"},{"day":8,"type":"learn","full":true,"title":"DI lifetimes, captive dependencies and scopes in background services","objective":"Choose the right service lifetime, spot captive dependencies before they reach production, and use scopes correctly inside a BackgroundService.","task":"Create a captive dependency, watch scope validation catch it, fix it with IServiceScopeFactory, then register the project's services with correct lifetimes.","topics":["csharp","aspnet"],"roles":["lead","architect"],"difficulty":2,"explanation":"The built-in container in `Microsoft.Extensions.DependencyInjection` has three lifetimes:\n\n- **Singleton** — one instance for the whole application. Must be thread-safe. Good for configuration, caches, `HttpClient` handlers via `IHttpClientFactory`, stateless helpers.\n- **Scoped** — one instance per scope. In ASP.NET Core, one scope = one HTTP request. `DbContext` is scoped by default with `AddDbContext`, because it is **not thread-safe** and holds per-unit-of-work state.\n- **Transient** — a new instance every time it is resolved. Good for light, stateless services. Disposable transients resolved from the root container are kept alive until the app stops, so avoid that.\n\nThe key rule: **a service must not depend on a service with a shorter lifetime.** If a singleton receives a scoped `DbContext` in its constructor, that one `DbContext` is captured forever. This is a **captive dependency**. Results: \"A second operation was started on this context instance\" errors under concurrent load, stale tracked entities, and in the worst case data from one user's request leaking into another's.\n\n**Scope validation** catches many of these. In the Development environment, the host enables `ValidateScopes` and `ValidateOnBuild`, so resolving a scoped service from the root provider or injecting it into a singleton throws at startup. In Production these checks are off by default for speed — which is why the bug often appears only after deployment if nobody runs the app in Development.\n\nA `BackgroundService` is a singleton. It has no request scope. To use a scoped service, create a scope per unit of work:\n\n```csharp\npublic sealed class IngestionWorker(IServiceScopeFactory scopes, IngestionQueue queue)\n    : BackgroundService\n{\n    protected override async Task ExecuteAsync(CancellationToken ct)\n    {\n        await foreach (var id in queue.ReadAllAsync(ct))\n        {\n            await using var scope = scopes.CreateAsyncScope();\n            var db = scope.ServiceProvider.GetRequiredService<AppDbContext>();\n            // process one document with a fresh DbContext\n        }\n    }\n}\n```\n\n**Keyed services** (.NET 8+) let you register several implementations of one interface under a key, for example `AddKeyedSingleton<IFileStore, LocalFileStore>(\"local\")`, and inject with `[FromKeyedServices(\"local\")]`. Use them when the choice is static; if the choice depends on runtime data, a small factory is often clearer.\n\nService locator (`IServiceProvider.GetService` everywhere in business code) hides dependencies and makes lifetimes hard to reason about. It is acceptable at composition boundaries, like the worker above, not as the normal style.\n","questions":[{"id":"Q1","kind":"technical","question":"Explain singleton, scoped and transient lifetimes in ASP.NET Core, and what a captive dependency is.","answer":"Singleton means one instance for the whole application. Scoped means one instance per scope, and in ASP.NET Core a scope is one HTTP request. Transient means a new instance every time someone asks for it.\n\nThe lifetime tells me two things: how long the object lives, and who can use it at the same time. A singleton is shared by all requests in parallel, so it must be thread-safe. A scoped service is used by one request, so it can hold per-request state, like a DbContext with its change tracker.\n\nA captive dependency happens when a longer-lived service holds a shorter-lived one. The classic case is a singleton that takes a DbContext in its constructor. The DbContext was meant to live for one request, but now it lives forever and is shared by all requests. That causes threading errors and wrong data.\n\nThe rule I follow is simple: dependencies should have the same or a longer lifetime than the service using them. And I keep scope validation on, so the container tells us at startup when we break that rule.\n","deeper":"- Valid combinations: transient → anything; scoped → scoped or singleton; singleton → singleton only. A transient injected into a singleton also becomes effectively a singleton — fine if it is stateless, dangerous if it holds state or a scoped dependency.\n- Disposal: the container disposes services it created when the scope (or root) is disposed. Transient `IDisposable`s resolved from the root live until shutdown — a slow leak.\n- `ValidateScopes` and `ValidateOnBuild` are enabled by default in the Development environment; you can enable them explicitly in other environments if startup cost is acceptable.\n- Choosing lifetimes: default to scoped for anything touching data or user context; singleton only for stateless or thread-safe shared state; transient for cheap stateless services.\n- Alternatives to injecting `DbContext` into singletons: `IDbContextFactory<T>` (create short-lived contexts on demand) or `IServiceScopeFactory`.\n","evaluating":"Whether you understand lifetimes as concurrency and ownership decisions, not just definitions. They want to hear the captive dependency rule and how you prevent it with validation.\n","weak":["Reciting the three definitions without explaining thread safety or per-request state.","Saying 'make everything singleton for performance'.","Not knowing that BackgroundService has no request scope."],"levelUp":"A senior developer defines the lifetimes and the captive dependency rule. A lead or architect adds how to prevent the problem at team level — scope validation in every environment's tests, integration tests that resolve the whole graph, and a short registration guideline in the handbook.\n","followUp":{"question":"When would you use IDbContextFactory instead of injecting DbContext?","answer":"When the code does not live in a natural request scope, or needs several independent units of work. Examples are a singleton service, a background job processing many items, or a Blazor Server component where a scope lives for the whole circuit. With the factory, I create a short-lived context, use it for one unit of work, and dispose it. In normal controller or endpoint code, injecting the scoped DbContext is simpler and correct.\n"},"qid":"D008-Q1"},{"id":"Q2","kind":"scenario","question":"After a release, production shows intermittent errors like 'A second operation was started on this context instance', and one user reported seeing another user's data. How would you investigate and fix it?","answer":"These two symptoms together make me suspect a captive DbContext — a DbContext held by a singleton and shared across requests.\n\nFirst, I would treat the data exposure as a security incident. I inform the right people, and if we can confirm the cause quickly, we roll back to the previous release.\n\nThen I look for evidence. The error message means two threads used the same DbContext at the same time. I check what changed in the release: any new singleton, or a service changed to singleton, that takes a DbContext or a repository in its constructor. A quick check is to run the app in the Development environment, because scope validation will throw at startup and point to the exact registration.\n\nFor the fix, the singleton should not hold the DbContext. Either change it to scoped, or if it really must be a singleton, for example a cache, inject IDbContextFactory or IServiceScopeFactory and create a short-lived context per operation.\n\nFor prevention, I would add an integration test that builds the host with scope validation on, so this kind of registration fails in the pipeline, not in production.\n","deeper":"- Why wrong data appears: the shared context's change tracker keeps entities from earlier queries. With tracking queries, identity resolution can return an already-tracked entity instead of fresh data, and any per-user state stored in the singleton is shared too.\n- Evidence sources: exception logs with stack traces, the release diff of `Program.cs` registrations, and a local run with `ValidateScopes = true`.\n- Fix options:\n  - **Change the consumer to scoped** — simplest when it has no reason to be a singleton.\n  - **`IDbContextFactory<T>`** — for singletons or parallel work that need their own contexts.\n  - **`IServiceScopeFactory`** — when you need several scoped services together for one unit of work.\n- Do not \"fix\" by adding locks around the DbContext: it hides the bug, kills throughput, and the stale-data problem remains.\n- Prevention: a test using `WebApplicationFactory` with validation enabled, or a startup check that calls `BuildServiceProvider(new ServiceProviderOptions { ValidateScopes = true, ValidateOnBuild = true })` on the service collection in tests.\n","evaluating":"Incident judgement (data exposure is a security issue first), knowledge of the real mechanism, and a fix that solves the cause instead of the symptom. They also look for a prevention step in the pipeline.\n","weak":["Wrapping the DbContext in a lock to stop the exceptions.","Treating the data leak as just a bug and not escalating it.","Changing the DbContext itself to singleton or transient without understanding the cause."],"levelUp":"A senior developer finds the bad registration and fixes it. A lead also runs the incident properly — security escalation, rollback decision, user impact assessment — and adds a pipeline check plus a team guideline so lifetime mistakes are caught before release.\n","followUp":{"question":"Why did this not fail in the test environment?","answer":"Probably for two reasons. First, scope validation is on only in the Development environment by default, and the test environment was configured as Staging or Production. Second, the bug needs concurrent requests to show threading errors, and manual testing usually sends one request at a time. So I would enable validation in an automated test and add a small concurrency test on the affected endpoint.\n"},"qid":"D008-Q2"},{"id":"Q3","kind":"leadership","question":"A developer on your team uses IServiceProvider.GetService everywhere instead of constructor injection. How would you mentor them?","answer":"My approach is to understand first, then teach with their own code.\n\nI would ask why they use it. Often there is a reason: maybe they had a circular dependency, or a class with twelve dependencies, or they learned it in an older framework. That reason tells me what to teach.\n\nThen I would sit with them on one real class. Together we change it to constructor injection, and I show the benefits in practice: the dependencies are visible in one place, the class is easy to test without a container, and scope validation can now check the lifetimes. If the constructor becomes too long, that is useful feedback — the class does too much, and we can split it.\n\nI would also be clear that service locator is acceptable in a few places, like creating a scope inside a background worker or in a factory. So it is a guideline, not a religion.\n\nFinally, I would agree a small goal: new code uses constructor injection, and when they touch an old class, they convert it. I review a couple of their PRs and give quick, specific feedback.\n","deeper":"- Why service locator hurts: hidden dependencies, runtime failures instead of startup failures, harder unit tests, and lifetimes that are easy to get wrong (resolving scoped services from the root provider).\n- Legitimate uses: composition root, background services creating scopes, factories, middleware with per-request dependencies via `InvokeAsync` parameters.\n- Mentoring pattern: ask → pair on real code → explain the principle → agree a small, measurable change → follow up in reviews. Avoid public criticism in PR comments; use a short private conversation first.\n- If the habit comes from real design problems (circular dependencies, god classes), fix those; otherwise the developer will return to the locator.\n- Team-level support: a handbook line, an example in the codebase, and optionally an analyzer or review checklist item.\n","evaluating":"Coaching skill: curiosity before correction, teaching through real code, and setting a fair standard. They also check that you know the legitimate exceptions, which shows real technical understanding instead of dogma.\n","weak":["Rewriting the developer's code yourself without explaining.","Blocking all their PRs with 'use constructor injection' comments.","Saying service locator is always wrong, with no exceptions."],"levelUp":"A senior developer explains why constructor injection is better. A lead finds the root cause of the habit, coaches through pairing, agrees a realistic standard with exceptions, and follows up — growing the developer rather than just correcting the code.\n","followUp":{"question":"What if the developer pushes back and says constructor injection makes their classes too big?","answer":"I would agree that the constructor shows the problem, but it does not create it. A class with ten dependencies does ten things, and service locator only hides that. We would look at the class together and find responsibilities to split — for example, a separate service for notifications or validation. I would keep it practical: one split at a time, with tests, not a redesign of the whole module.\n"},"qid":"D008-Q3"}],"exercise":{"title":"Catch a captive dependency and fix the ingestion worker","minutes":25,"body":"1. In the project, add a deliberately wrong registration:\n\n```csharp\nbuilder.Services.AddDbContext<AppDbContext>(o => o.UseSqlServer(cs)); // scoped\nbuilder.Services.AddSingleton<DocumentStatsCache>(); // takes AppDbContext in its constructor\n```\n\n2. Run in the Development environment and read the exception. Then run with `ASPNETCORE_ENVIRONMENT=Production` and note that it starts. Write one line explaining why.\n3. Fix `DocumentStatsCache` using `IDbContextFactory<AppDbContext>` (register with `AddDbContextFactory`), creating one short-lived context per refresh.\n4. Make sure `IngestionWorker` creates one scope per document with `CreateAsyncScope()`, as in the explanation.\n5. Add a test that builds the service provider with `ValidateScopes = true` and `ValidateOnBuild = true` and expects no exception.\n6. Write a lifetimes table in the README: service → lifetime → reason.\n"},"english":{"task":"Explain Q2 to a non-technical manager in 60 seconds: what happened, the risk to users, what we did immediately, and what prevents it next time. Avoid the words \"singleton\" and \"scope\"; use simple comparisons instead. Record once and check for jargon.\n","phrases":["The root cause was that one shared object was used by many users at the same time.","Our first priority was to protect user data, so we…","I'm not completely sure yet, but the evidence points to…","Let me give you a quick example from our code.","To make sure this is caught earlier, we added…"]},"checkpoint":"Without notes, you can state the captive dependency rule, give two fixes for a singleton that needs a DbContext, and explain why scope validation did not catch the bug in Production. Your project has a passing validation test and a lifetimes table for every registered service.\n","project":{"milestone":"Register all project services with justified lifetimes, use a scope per document in the ingestion worker, and add a DI validation test.","evidence":"In an interview you can say: 'Our ingestion worker creates a scope per document, and a test validates the whole DI graph so captive dependencies fail in CI, not in production.' Show the test and the lifetimes table."},"references":[{"title":"Dependency injection in .NET (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/core/extensions/dependency-injection"},{"title":"Dependency injection guidelines (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/core/extensions/dependency-injection-guidelines"},{"title":"Use scoped services within a BackgroundService (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/dotnet/core/extensions/scoped-service"},{"title":"Dependency injection in ASP.NET Core (Microsoft Learn)","url":"https://learn.microsoft.com/en-us/aspnet/core/fundamentals/dependency-injection"},{"title":"DbContext lifetime, configuration, and initialization (EF Core)","url":"https://learn.microsoft.com/en-us/ef/core/dbcontext-configuration/"}],"id":"D008"},{"day":9,"type":"learn","full":true,"title":"Garbage collection, memory leaks and diagnosing growing memory","objective":"Explain how the .NET GC works, recognise the common causes of managed memory leaks, and diagnose growing memory with the right tools for .NET and .NET Framework.","task":"Create a small static-cache leak, observe it with dotnet-counters, find the root with dotnet-gcdump, and fix it with a bounded cache.","topics":["csharp"],"roles":["lead","architect"],"difficulty":3,"explanation":"The
